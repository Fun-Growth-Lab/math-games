      'UA: ' + navigator.userAgent;

  upd();
  window.addEventListener('resize', upd);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', upd);
  setInterval(upd, 500);
})();

// 縦持ちスマホでも横長ゲームを大きく表示するため、縦持ち×スマホ幅のときは
// canvas自体をCSSで90度回転させ、画面の縦幅を「横幅」として使うスケール計算に切り替える。
// （canvasの内部解像度はあくまで1600x900論理空間を描画したサイズのままで、
//   見た目の回転はCSS transformのみで行う。回転中はhandleInput()のタップ座標変換も対応）
let isMobileRotated = false;
function resize() {
    const vp = window.visualViewport;
    const winW = vp ? vp.width : window.innerWidth;
    const winH = vp ? vp.height : window.innerHeight;
    isMobileRotated = winW < winH && winW <= 900;
    if (isMobileRotated) {
        scale = Math.min(winH / BASE_W, winW / BASE_H);
        canvas.style.transform = 'rotate(90deg)';
    } else {
        scale = Math.min(winW / BASE_W, winH / BASE_H);
        canvas.style.transform = 'none';
    }
    canvas.width = BASE_W * scale;
    canvas.height = BASE_H * scale;
    // Xアプリ内蔵ブラウザ等、bodyのflexセンタリングがcanvas(回転前レイアウトサイズ)を
    // 正しく中央寄せできない環境があるため、flexに頼らずJSでleft/topを絶対座標指定する
    canvas.style.left = `${winW / 2 - canvas.width / 2}px`;
    canvas.style.top = `${winH / 2 - canvas.height / 2}px`;
    requestRedraw();
}

function handleInput(e) {
    requestRedraw();
    const rect = canvas.getBoundingClientRect();
    let x = -1, y = -1;
    if (e.type === 'mousedown') {
        if (isMobileRotated) {
            const px = e.clientX - rect.left, py = e.clientY - rect.top;
            x = py / scale;
            y = BASE_H - px / scale;
        } else {
            x = (e.clientX - rect.left) / scale;
            y = (e.clientY - rect.top) / scale;
        }
    }

    if (gameState === 'title') {
        if (x > 550 && x < 1050 && y >= 290 && ((y - 290) % 85) < 70) {
            const ti = Math.floor((y - 290) / 85);
            if (ti === 0) gameState = 'level_select';
            else if (ti === 1) startTutorial();
            else if (ti === 2) gameState = 'player_select';
            else if (ti === 3) { gameState = 'ranking'; rankingTab = 'world'; rankingMode = 'name'; rankingLv = 4; fetchRanking(); }
            else if (ti === 4) showLangModal();
            else if (ti === 5) window.location.href = "../index.html";
        }
    } else if (gameState === 'player_select') {
        if (x > 550 && x < 1050) {
            for (let i = 0; i < 5; i++) {
                if (y > 200 + i * 100 && y < 280 + i * 100) {
                    if (localPlayers[i] === NEW_PLAYER_MARKER) {
                        registerPlayer(i);
                    } else {
                        currentPlayerIdx = i;
                        localStorage.setItem('japan_map_current_player', i.toString());
                        gameState = 'title';
                    }
                }
            }
        }
        if (x > 1080 && x < 1180) {
            for (let i = 0; i < 5; i++) {
                if (y > 210 + i * 100 && y < 270 + i * 100 && localPlayers[i] !== NEW_PLAYER_MARKER) {
                    registerPlayer(i, true);
                }
            }
        }
        if (x > 1200 && x < 1300) {
            for (let i = 0; i < 5; i++) {
                if (y > 210 + i * 100 && y < 270 + i * 100 && localPlayers[i] !== NEW_PLAYER_MARKER) {
                    const delName = localPlayers[i];
                    showCustomConfirm(T('confirm_delete', {name: delName}), () => {
                        localPlayers[i] = NEW_PLAYER_MARKER;
                        if (currentPlayerIdx === i) {
                            currentPlayerIdx = -1;
                            localStorage.setItem('japan_map_current_player', "-1");
                        }
                        localStorage.setItem('japan_map_players', JSON.stringify(localPlayers));
                    });
                }
            }
        }
        if (x > 700 && x < 900 && y > 720 && y < 800) gameState = 'title';
    } else if (gameState === 'level_select') {
        if (x > 1250 && x < 1550 && y > 50 && y < 110) {
            showTime = !showTime; SFX.play('toggle');
            localStorage.setItem('japan_map_show_time', showTime.toString());
            return;
        }

        const modes = ['name', 'capital', 'region'];
        const levels = [2, 4, 8, 47];
        const startXLevel = 400;
        const startY = 250;
        const rowH = 150;
        const btnW = 220;
        const btnH = 100;

        modes.forEach((m, mi) => {
            levels.forEach((l, li) => {
                if (m === 'region' && l === 47) return;
                const bx = startXLevel + li * (btnW + 20);
                const by = startY + mi * rowH;
                if (x > bx && x < bx + btnW && y > by && y < by + btnH) {
                    currentMode = m;
                    TOTAL_QUESTIONS = (l === 47) ? 47 : ((m === 'region') ? 8 : 10);
                    startCountdown(l);
                }
            });
        });
        if (x > 700 && x < 900 && y > 780 && y < 860) gameState = 'title';
    } else if (gameState === 'ranking') {
        const tabW = 210; const gap = 20;
        const leftStart = (BASE_W/2 - gap*2) / 2 - (tabW * 2 + gap)/2 + 50;
        const rightStart = BASE_W/2 + (BASE_W/2 - (tabW * 3 + gap * 2))/2;

        if (y > 140 && y < 200) {
            if (x > leftStart && x < leftStart + tabW) { rankingTab = 'world'; fetchRanking(); }
            if (x > leftStart + tabW + gap && x < leftStart + tabW * 2 + gap) { rankingTab = 'local'; fetchRanking(); }
            if (x > rightStart && x < rightStart + tabW) { rankingMode = 'name'; fetchRanking(); }
            if (x > rightStart + tabW + gap && x < rightStart + tabW * 2 + gap) { rankingMode = 'capital'; fetchRanking(); }
            if (x > rightStart + (tabW + gap) * 2 && x < rightStart + tabW * 3 + gap * 2) { 
                rankingMode = 'region'; 
                if (rankingLv === 47) rankingLv = 8;
                fetchRanking(); 
            }
        }
        if (y > 220 && y < 270) {
            if (x > 670 && x < 770) { rankingLv = 2; fetchRanking(); }
            if (x > 780 && x < 880) { rankingLv = 4; fetchRanking(); }
            if (x > 890 && x < 990) { rankingLv = 8; fetchRanking(); }
            if (rankingMode !== 'region' && x > 1000 && x < 1120) { rankingLv = 47; fetchRanking(); }
        }
        if (y > 810 && y < 870) {   // ページの ボタン
            const cnt = rankingData.filter(d => d.level == rankingLv && d.mode == rankingMode).slice(0, 30).length;
            for (let p = 0; p < 3; p++) {
                if (x > 1000 + p * 130 && x < 1120 + p * 130 && p * RANK_PER_PAGE < cnt) { rankingPage = p; requestRedraw(); }
            }
        }
        if (x > 700 && x < 900 && y > 780 && y < 860) gameState = 'title';
    } else if (gameState === 'playing') {
        if (x > 1400 && y > 820) { gameState = 'title'; return; }
        questions[currentIdx].options.forEach((opt, i) => {
            const col = i % 2; const row = Math.floor(i / 2);
            const bx = 1050 + col * 270; const by = 180 + row * 150;
            if (x > bx && x < bx + 250 && y > by && y < by + 120) {
                selectedOption = opt;
                pauseTime = Date.now();
                if (currentMode === 'region') {
                    if (opt.name === questions[currentIdx].region) correctCount++;
                } else {
                    if (opt.code === questions[currentIdx].code) {
                        correctCount++;
                        if (currentLevel === 47) answeredCodes.push(opt.code);
                    } else {
                        if (currentLevel === 47) wrongCodes.push(questions[currentIdx].code);
                    }
                }
                gameState = 'waiting';
                const okAns = currentMode === 'region' ? opt.name === questions[currentIdx].region : opt.code === questions[currentIdx].code;
                SFX.play(okAns ? 'correct' : 'wrong');
            }
        });
    } else if (gameState === 'waiting') {
        if (e.type === 'keydown' && e.code !== 'Enter' && e.code !== 'Space') return;
        currentIdx++;
        startTime += (Date.now() - pauseTime);
        if (currentIdx >= TOTAL_QUESTIONS) {
            totalTime = (Date.now() - startTime) / 1000;
            gameState = 'result';
            saveScore(totalTime);
        } else {
            gameState = 'playing';
            lastTargetCodes = [];
            cachedMapImg = null;
        }
        selectedOption = null;
    } else if (gameState === 'result') {
        if (y > 580 && y < 660 && x > 650 && x < 950) { gameState = 'ranking'; rankingTab = 'world'; rankingMode = currentMode; rankingLv = currentLevel; fetchRanking(); }
        if (y > 680 && y < 760 && x > 650 && x < 950) gameState = 'title';
    }
}

            const regionPrefs = PREFECTURES.filter(p => p.region === r.name);
            return { region: r.name, ruby: r.ruby, options: REGIONS, regionPrefs: regionPrefs };
        });
    } else {
        if (level === 47) {
            questions = [...PREFECTURES].sort(() => Math.random() - 0.5)
                        .map(q => ({...q, options: generateOptions(q)}));
        } else {
            questions = [...PREFECTURES].sort(() => Math.random() - 0.5).slice(0, TOTAL_QUESTIONS)
                        .map(q => ({...q, options: generateOptions(q)}));
        }
    }
    gameState = 'playing';
    startTime = Date.now();
}

function generateOptions(correct) {
    let others = PREFECTURES.filter(p => p.code !== correct.code).sort(() => Math.random() - 0.5);
    let optCount = (currentLevel === 47) ? 8 : currentLevel;
    return [correct, ...others.slice(0, optCount - 1)].sort(() => Math.random() - 0.5);
}

// ============================================================
// チュートリアル（練習プレイ）
// ============================================================
// 実際のクイズ画面で「赤くなった都道府県の名前（県庁所在地）を選ぶ」を体験する。
// 書き込みはエンジンが止めるので、ランキング・記録は一切汚れない。
function startTutorial() {
    FGLTutorial.begin({ root: document.body, getLang: () => currentLang });
    const pref = (code) => PREFECTURES.find(p => p.code === code);
    // 手順どおりに進むよう、問題を決めた内容にする(1問目: 名前 2択 / 2問目: 県庁所在地 4択)
    currentMode = 'name'; currentLevel = 4; TOTAL_QUESTIONS = 3;
    questions = [
        { ...pref(1), options: [pref(47), pref(1)] },
        { ...pref(23), options: [pref(4), pref(23), pref(26), pref(27)] },
        { ...pref(26), options: [pref(27), pref(26)] }
    ];
    currentIdx = 0; correctCount = 0; answeredCodes = []; wrongCodes = [];
    lastTargetCode = -1; lastTargetCodes = []; cachedMapImg = null; selectedOption = null;
    startTime = Date.now();
    gameState = 'playing';
    // 1問目の答え合わせのあと、2問目は「県庁所在地」のクイズに切り替える(ゲーム本体のクリック処理より先に実行される)
    const toCapital = (e) => { if (gameState === 'waiting' && currentIdx === 0) currentMode = 'capital'; };
    window.addEventListener('mousedown', toCapital, true);
    window.addEventListener('keydown', toCapital, true);
    // canvasの論理座標(1600x900)を、画面上の位置(縦持ち回転表示も含む)に直す
    const cvR = (x, y, w, h) => {
        const r = canvas.getBoundingClientRect();
        const B = 12;                                   // canvasの枠線の太さ
        const Wb = canvas.width + B * 2, Hb = canvas.height + B * 2;
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const pt = (px, py) => {
            const u = B + px * scale - Wb / 2, v = B + py * scale - Hb / 2;
            return isMobileRotated ? [cx - v, cy + u] : [cx + u, cy + v];
        };
        const a = pt(x, y), b = pt(x + w, y + h);
        return { rect: [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1])], pad: 8 };
    };
    const mapR = () => cvR(20, 100, 1000, 750);
    const headR = () => cvR(40, 30, 1100, 70);
    const timeR = () => cvR(1050, 30, 520, 70);
    const opt2R = () => cvR(1050, 180, 520, 120);
    const opt4R = () => cvR(1050, 180, 520, 270);
    const allR = () => cvR(0, 0, BASE_W, BASE_H);
    FGLTutorial.run([
        { type: 'say', target: null, pos: 'middle', overview: true, text: {
            ja: 'これがゲーム画面だよ。まん中に「日本地図」、上に「もんだい」の文、右に「こたえ」のボタンが並ぶよ。まず全体を見て、そのあと順番に説明するね。',
            easy: 'これがゲームがめんだよ。まんなかに「にほんちず」、うえに「もんだい」のぶん、みぎに「こたえ」のボタンがならぶよ。まずぜんたいをみて、そのあとじゅんばんにせつめいするね。',
            en: 'This is the game screen. The map of Japan is in the middle, the question is at the top, and the answer buttons are on the right. Look around first, then we\'ll go through it step by step.' } },

// タイトル以外の画面にも、タイトルの背景絵(クイズ番組)をうっすら敷く。選択・ランキング画面は白い大きなパネルの上に出す
let bgCache = null, bgCacheKey = '';
function paintScreenBg(c, panel) {
    if (titleImg && titleImg.complete && titleImg.naturalWidth !== 0) c.drawImage(titleImg, 0, 0, BASE_W, BASE_H);
    c.fillStyle = panel ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.80)';
    c.fillRect(0, 0, BASE_W, BASE_H);
    if (panel) {
        c.save();
        c.shadowColor = 'rgba(40,70,20,0.35)'; c.shadowBlur = 36; c.shadowOffsetY = 12;
        c.beginPath(); c.roundRect(24, 24, BASE_W - 48, BASE_H - 48, 44);
        c.fillStyle = 'rgba(255,255,255,0.93)'; c.fill();
        c.restore();
        c.beginPath(); c.roundRect(24, 24, BASE_W - 48, BASE_H - 48, 44); c.strokeStyle = '#8fd16a'; c.lineWidth = 8; c.stroke();
    }
}
function drawScreenBg() {
    if (gameState === 'title') return;
    const panel = (gameState === 'level_select' || gameState === 'player_select' || gameState === 'ranking' || gameState === 'result');
    const imgOk = !!(titleImg && titleImg.complete && titleImg.naturalWidth !== 0);
    const key = [canvas.width, canvas.height, panel ? 1 : 0, imgOk ? 1 : 0].join('|');
    if (!bgCache || bgCacheKey !== key) {
        // 画面と同じ大きさの見えない canvas に、1回だけ描いておく(この間も同じ座標系: BASE_W x BASE_H を scale 倍)
        bgCache = document.createElement('canvas');
        bgCache.width = canvas.width; bgCache.height = canvas.height;
        const c = bgCache.getContext('2d');
        c.scale(scale, scale);
        paintScreenBg(c, panel);
        bgCacheKey = key;
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);     // 倍率なしで、そのまま貼る
    ctx.drawImage(bgCache, 0, 0);
    ctx.restore();
}

// 描きなおしが必要になったら呼ぶ(入力・通信の完了・画面サイズの変化など)。
// タイトル・選択・ランキング・けっかの画面は時間で動かないので、毎フレーム(60回/秒)描くと、
// ボタンの影やぼかし(shadowBlur)で端末が重くなり、タップへの反応が遅れる。必要なときだけ描く
let needRedraw = true, lastDrawAt = 0;
function requestRedraw() { needRedraw = true; }
const LIVE_STATES = ['countdown', 'playing', 'waiting'];   // 時間が進む画面は毎フレーム描く

function gameLoop(now) {
    now = now || performance.now();
    // 念のため、入力などで要求が漏れても 0.25 秒以内にはかならず描きなおす
    if (LIVE_STATES.indexOf(gameState) >= 0 || needRedraw || now - lastDrawAt > 250) {
        needRedraw = false; lastDrawAt = now;
        ctx.save();
        ctx.scale(scale, scale);
        ctx.clearRect(0, 0, BASE_W, BASE_H);
        drawScreenBg();
        if (gameState === 'title') drawTitle();
        else if (gameState === 'player_select') drawPlayerSelect();
        else if (gameState === 'level_select') drawLevelSelect();
        else if (gameState === 'ranking') drawRanking();
        else if (gameState === 'countdown') drawCountdown();
        else if (gameState === 'playing' || gameState === 'waiting') drawQuiz();
        else if (gameState === 'result') drawResult();
        ctx.restore();
    }
    requestAnimationFrame(gameLoop);
}

function drawQuiz() {
    const elapsed = (((gameState === 'waiting' ? pauseTime : Date.now()) - startTime) / 1000).toFixed(2);
    const q = questions[currentIdx];
    
    let targetCodes = [];
    if (currentMode === 'region') {
        if (lastTargetCodes.length === 0) {
            if (currentLevel === 2) { 
                targetCodes = q.regionPrefs.map(p => p.code);
            } else if (currentLevel === 4) {
                targetCodes = [...q.regionPrefs].sort(() => Math.random() - 0.5).slice(0, 2).map(p => p.code);
            } else {
                targetCodes = [q.regionPrefs[Math.floor(Math.random() * q.regionPrefs.length)].code];
            }
            lastTargetCodes = targetCodes;
        } else {
            targetCodes = lastTargetCodes;
        }
    } else {
        targetCodes = [q.code];
    }

    if (!cachedMapImg) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = JAPAN_MAP_SVG;
        const svgEl = tempDiv.querySelector('svg');
        if (svgEl) {
            svgEl.querySelectorAll('[data-code]').forEach(el => {
                el.style.fill = "#b0b0b0"; el.style.stroke = "#444"; el.style.strokeWidth = "1";
            });
            if (currentLevel === 47) {
                answeredCodes.forEach(code => {
                    const ansTarget = svgEl.querySelector(`[data-code="${code}"]`);
                    if (ansTarget) { ansTarget.style.fill = "#78c850"; ansTarget.style.stroke = "#444"; ansTarget.style.strokeWidth = "1"; }
                });
                wrongCodes.forEach(code => {
                    const wrgTarget = svgEl.querySelector(`[data-code="${code}"]`);
                    if (wrgTarget) { wrgTarget.style.fill = "#888888"; wrgTarget.style.stroke = "#444"; wrgTarget.style.strokeWidth = "1"; }
                });
            }
            targetCodes.forEach(code => {
                const target = svgEl.querySelector(`[data-code="${code}"]`);
                if (target) { target.style.fill = "#ff4500"; target.style.stroke = "#cc0000"; target.style.strokeWidth = "2"; }
            });
            const xml = new XMLSerializer().serializeToString(svgEl);
            const svg64 = btoa(unescape(encodeURIComponent(xml)));
            cachedMapImg = new Image();
            cachedMapImg.src = 'data:image/svg+xml;base64,' + svg64;
            if (currentMode !== 'region') lastTargetCode = q.code;
        }
    }

    if (cachedMapImg && cachedMapImg.complete) ctx.drawImage(cachedMapImg, 20, 100, 1000, 750);
    drawText(`${currentIdx + 1} / ${TOTAL_QUESTIONS}`, 100, 80, 40, "bold", "#000000", "left");
    if (showTime) {
        drawText(T('quiz_elapsed', {t: elapsed}), 1500, 80, 40, "bold", "#000000", "right");
    }

    let qTxt = currentMode === 'capital' ? T('quiz_q_capital') : (currentMode === 'region' ? T('quiz_q_region') : T('quiz_q_name'));
    drawText(qTxt, 550, 80, 36, "bold", "#000000");

    q.options.forEach((opt, i) => {
        const col = i % 2; const row = Math.floor(i / 2);
        const bx = 1050 + col * 270; const by = 180 + row * 150;
        let color = "#ffffff";
        if (gameState === 'waiting') {
            const isCorrect = (currentMode === 'region') ? opt.name === q.region : opt.code === q.code;
            if (isCorrect) {
                color = "#ff4500"; 
            } else if (selectedOption === opt) {
                color = "#4682b4"; 
            }
        }
        const label = currentMode === 'capital' ? opt.capital : opt.name;
        const ruby = currentMode === 'capital' ? opt.c_ruby : opt.ruby;
        drawQuizButton(bx, by, 250, 120, label, ruby, color);

    drawButton(1420, 830, 150, 50, T('quiz_quit'), "#c1e1c1", 20, "#000000");
    if (gameState === 'waiting') {
        const isCorrect = (currentMode === 'region') ? selectedOption.name === q.region : selectedOption.code === q.code;
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; ctx.fillRect(0, 0, BASE_W, BASE_H);
        drawText(isCorrect ? T('quiz_correct') : T('quiz_incorrect'), BASE_W/2, 400, 120, "bold", isCorrect ? "#ff4500" : "#4682b4");
        drawText(T('quiz_next_hint'), BASE_W/2, 520, 40, "bold", "#ffffff");
    }

function drawText(txt, x, y, size, weight = "", color = "#000", align = "center") {
    ctx.fillStyle = color; ctx.font = `${weight} ${size}px 'M PLUS Rounded 1c'`;
    ctx.textAlign = align; ctx.fillText(txt, x, y);
}

function shadeColor(hex, percent) {
    if (typeof hex !== 'string' || !hex.startsWith('#') || hex.length !== 7) return hex;
    let num = parseInt(hex.slice(1), 16);
    let r = Math.max(0, Math.min(255, (num >> 16) + Math.round(255 * percent)));
    let g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + Math.round(255 * percent)));
    let b = Math.max(0, Math.min(255, (num & 0xFF) + Math.round(255 * percent)));
    return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

function fillButtonGradient(x, y, w, h, r, color) {
    // 下の「縁」(少し暗い色)を先に描いて、押せる立体のボタンに見せる
    const edge = Math.max(6, Math.round(h * 0.07));
    ctx.save();
    ctx.shadowColor = 'transparent';
    ctx.beginPath(); ctx.roundRect(x, y + edge, w, h, r);
    ctx.fillStyle = (color === '#ffffff' || color === '#fff') ? '#cfc6b8' : shadeColor(color, -0.3); ctx.fill();
    ctx.restore();
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, shadeColor(color, 0.18));
    grad.addColorStop(1, color);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = grad; ctx.fill();
    // 白いふち(内側)
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(x + 2, y + 2, w - 4, h - 4, Math.max(2, r - 2)); ctx.stroke();
    ctx.restore();
}

function drawButton(x, y, w, h, txt, color, size = 32, textColor = "#fff") {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    fillButtonGradient(x, y, w, h, 30, color);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = shadeColor(color, -0.22); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 30); ctx.stroke();
    drawText(txt, x + w/2, y + h/2 + size/3.5, size, "bold", textColor);
}

function drawBalancedButton(x, y, w, h, txt, ruby, color) {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    fillButtonGradient(x, y, w, h, 30, color);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = shadeColor(color, -0.22); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 30); ctx.stroke();
    const mainSize = 34; const rubySize = 16; const gap = 6;
    const totalContentHeight = mainSize + rubySize + gap;
    const startY = y + (h - totalContentHeight) / 2 - 4;
    drawText(ruby, x + w/2, startY + rubySize / 1.1, rubySize, "bold", "rgba(255,255,255,0.95)");
    drawText(txt, x + w/2, startY + rubySize + gap + mainSize / 1.1, mainSize, "bold", "#fff");
}

function drawQuizButton(x, y, w, h, txt, ruby, color) {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.15)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    fillButtonGradient(x, y, w, h, 40, color);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = "#8d7d6a"; ctx.lineWidth = 3; ctx.stroke();
    const mainSize = 44; const rubySize = 22; const gap = 8;
    const totalH = mainSize + rubySize + gap;
    const startY = y + (h - totalH) / 2;
    drawText(ruby, x + w/2, startY + rubySize / 1.1, rubySize, "bold", "#333333");
    drawText(txt, x + w/2, startY + rubySize + gap + mainSize / 1.1, mainSize, "bold", "#000000");
}

function login() { /* ログイン機能は無効（Supabase移行済み） */ }
function logout() { /* ログアウト機能は無効（Supabase移行済み） */ }

async function saveScore(time) {
    let localName = T('rank_guest');
    if (currentPlayerIdx !== -1 && localPlayers[currentPlayerIdx] !== NEW_PLAYER_MARKER) {
        localName = localPlayers[currentPlayerIdx];
    }

    const scoreObj = {
        uid: 'guest',
        name: localName,
        time: parseFloat(time),
        mode: currentMode,
        level: currentLevel,
        correct: correctCount,
        date: Date.now()
    };

    let localScores = JSON.parse(localStorage.getItem('japan_map_scores') || '[]');
    localScores.push(scoreObj);
    localScores.sort((a,b) => (b.correct !== a.correct) ? b.correct - a.correct : a.time - b.time);
    localStorage.setItem('japan_map_scores', JSON.stringify(localScores.slice(0, 100)));

    // --- Supabase保存 (World) ---
    // turnsは整数カラムのため小数を直接保存できない。
    // turnsに整数秒、（このゲームでは未使用の）stage_scoreに小数第2位までの端数(0-99)を分けて保存し、
    // 読み出し側 fetchRanking() で turns + stage_score/100 として復元する。
    // ※過去の記録はstage_scoreが常に0(=端数未記録)のため、created_atがDECIMAL_CUTOFF以降の
    //   記録のみ小数表示の対象とし、過去の記録は従来通り整数秒のまま表示する。
    const totalCenti = Math.round(parseFloat(time) * 100);
    try {
        await fetch(window._sb.b + '/rankings', {
            method: 'POST',
            headers: window._sb.h,
            keepalive: true,
            body: JSON.stringify({
                game: 'japan_map',
                difficulty: String(currentLevel),
                player_name: FGLName.display(localName),
                point_score: correctCount,
                stage_score: totalCenti % 100,
                turns: Math.floor(totalCenti / 100),
                class_name: currentMode,
                created_at: new Date().toISOString()
            })
        });
        console.log("Score saved to Supabase!");
        clearRankingCache();
    } catch(e) {
        console.error("Error saving score:", e);
    }
}

function formatDate(dt) {
    return `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`;
}

// 世界ランキングは「モード|難易度」ごとに覚えておく。難易度を切りかえたとき、通信を待たずにすぐ表を見せるため
const rankingCache = {};
const rankingInflight = {};
let rankingLoading = false;     // いま表示している世界ランキングを、まだ読み込んでいる最中(表の代わりに「読み込み中」を出す)
function clearRankingCache() { Object.keys(rankingCache).forEach(k => delete rankingCache[k]); }

async function loadWorldRows(lv, mode) {
    const params = new URLSearchParams({
        game: 'eq.japan_map',
        difficulty: 'eq.' + String(lv),
        class_name: 'eq.' + mode,
        order: 'point_score.desc,turns.asc',
        limit: '30',
        select: 'player_name,point_score,turns,stage_score,created_at'
    });
    const res = await fetch(window._sb.b + '/rankings?' + params.toString(), { headers: window._sb.rh });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    return rows.map(d => {
        // DECIMAL_CUTOFF以降に保存された記録のみ、stage_scoreに小数第2位の端数が入っている
        const hasDecimal = new Date(d.created_at) >= DECIMAL_CUTOFF;
        return {
            name: FGLName.display(d.player_name),
            correct: d.point_score,
            time: hasDecimal ? (d.turns || 0) + (d.stage_score || 0) / 100 : (d.turns || 0),
            timeHasDecimal: hasDecimal,
            level: lv,
            mode: mode,
            date: formatDate(new Date(d.created_at))
        };
    });
}

// そのモードの、ほかの難易度も先に読んでおく(次に押したとき、待たずに出せる)
function prefetchRanking(mode) {
    [2, 4, 8, 47].forEach(lv => {
        if (mode === 'region' && lv === 47) return;
        const key = mode + '|' + lv;
        if (lv === rankingLv || rankingCache[key] || rankingInflight[key]) return;
        rankingInflight[key] = true;
        loadWorldRows(lv, mode).then(rows => {
            rankingCache[key] = rows;
            // 読み込み中に、その難易度を開いていたら、そのまま表に出す
            if (gameState === 'ranking' && rankingTab === 'world' && rankingMode === mode && rankingLv === lv) {
                rankingData = rows; rankingLoading = false;
            }
            requestRedraw();
        }).catch(e => { console.error('Ranking prefetch error:', e); })
          .then(() => { delete rankingInflight[key]; });
    });
}

async function fetchRanking() {
    rankingPage = 0;     // タブ・難易度を かえたら 1〜10位に もどす
    // 連続で難易度・タブ等を切り替えたとき、後から返ってきた古い通信結果が
    // 最新の選択結果を上書きしてしまうのを防ぐガード
    const seq = ++rankingFetchSeq;
    const lv = rankingLv, mode = rankingMode;
    if (rankingTab === 'local') {
        let localScores = JSON.parse(localStorage.getItem('japan_map_scores') || '[]');
        rankingData = localScores
            .filter(d => d.level === lv && d.mode === mode)
            .sort((a,b) => (b.correct !== a.correct) ? b.correct - a.correct : a.time - b.time)
            .map(d => ({...d, timeHasDecimal: true, date: d.date ? formatDate(new Date(d.date)) : "-"}));
        rankingLoading = false;
        requestRedraw();
        return;
    }
    // Supabase (World)
    const key = mode + '|' + lv;
    if (rankingCache[key]) { rankingData = rankingCache[key]; rankingLoading = false; }   // 覚えている分は、すぐ見せる(その間に最新を取りなおす)
    else { rankingData = []; rankingLoading = true; }
    requestRedraw();
    prefetchRanking(mode);
    try {
        const rows = await loadWorldRows(lv, mode);
        rankingCache[key] = rows;
        if (seq !== rankingFetchSeq) return; // より新しいリクエストが後から発行済みなので破棄
        rankingData = rows; rankingLoading = false;
    } catch(e) {
        console.error("Ranking Error:", e);
        if (seq === rankingFetchSeq) { if (!rankingCache[key]) rankingData = []; rankingLoading = false; }
    }
    requestRedraw();
}

init();
