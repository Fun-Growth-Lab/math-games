        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'M PLUS Rounded 1c', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            touch-action: none;
        }
        canvas {
            background-color: var(--panel-bg);
            box-shadow: 0 10px 40px rgba(120, 200, 80, 0.15);
            border: 12px solid #e2f0d9;
            border-radius: 50px;
            touch-action: none;
        }
        #modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center;
            z-index: 1000;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        #modal-box {
            background: #fdfdfd;
            border-radius: 30px;
            border: 4px solid #e2f0d9;
            padding: 32px 36px;
            width: min(90vw, 480px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            text-align: center;
        }
        #modal-title {
            font-size: 22px; font-weight: bold; color: #78c850; margin-bottom: 14px;
            white-space: pre-line;
        }
        #modal-message {
            font-size: 18px; color: #333; margin-bottom: 18px; white-space: pre-line;
        }
        #modal-input {
            width: 100%; box-sizing: border-box; font-size: 20px; text-align: center;
            padding: 10px; border: 2px solid #78c850; border-radius: 10px; margin-bottom: 18px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        #modal-buttons {
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
        }
        #modal-buttons button {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 18px; font-weight: bold; padding: 12px 26px;
            border: none; border-radius: 20px; cursor: pointer;
            color: #fff; background: #78c850;
        }
        #modal-buttons button.secondary { background: #a0a0a0; }
        #modal-buttons button.danger { background: #ea4335; }
    </style>

function T(key, params) {
    const dict = STRINGS[currentLang] || {};
    let s = (key in dict) ? dict[key] : ((key in STRINGS.ja) ? STRINGS.ja[key] : key);
    if (params) {
        Object.keys(params).forEach(k => { s = s.split('{' + k + '}').join(params[k]); });
    }
    return s;
}

const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalMessage = document.getElementById('modal-message');
const modalInput = document.getElementById('modal-input');
const modalButtons = document.getElementById('modal-buttons');

function closeModal() {
    modalOverlay.style.display = 'none';
    modalButtons.innerHTML = '';
    modalMessage.textContent = '';
    modalInput.style.display = 'none';
    modalInput.value = '';
}

function showCustomAlert(message, title) {
    modalTitle.textContent = title || '';
    modalMessage.textContent = message;
    modalInput.style.display = 'none';
    modalButtons.innerHTML = '';
    const okBtn = document.createElement('button');
    okBtn.textContent = T('dialog_ok');
    okBtn.onclick = closeModal;
    modalButtons.appendChild(okBtn);
    modalOverlay.style.display = 'flex';
}

function showCustomConfirm(message, onConfirm) {
    modalTitle.textContent = '';
    modalMessage.textContent = message;
    modalInput.style.display = 'none';
    modalButtons.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = T('dialog_cancel');
    cancelBtn.className = 'secondary';
    cancelBtn.onclick = closeModal;
    const okBtn = document.createElement('button');
    okBtn.textContent = T('dialog_ok');
    okBtn.className = 'danger';
    okBtn.onclick = () => { closeModal(); onConfirm(); };
    modalButtons.appendChild(cancelBtn);
    modalButtons.appendChild(okBtn);
    modalOverlay.style.display = 'flex';
}

function showCustomPrompt(message, defaultValue, onSubmit) {
    modalTitle.textContent = '';
    modalMessage.textContent = message;
    modalInput.style.display = 'block';
    modalInput.value = defaultValue || '';
    modalButtons.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = T('dialog_cancel');
    cancelBtn.className = 'secondary';
    cancelBtn.onclick = closeModal;
    const okBtn = document.createElement('button');
    okBtn.textContent = T('dialog_ok');
    okBtn.onclick = () => {
        const val = modalInput.value;
        closeModal();
        onSubmit(val);
    };
    modalButtons.appendChild(cancelBtn);
    modalButtons.appendChild(okBtn);
    modalOverlay.style.display = 'flex';
    setTimeout(() => modalInput.focus(), 0);
}

function showLangModal() {
    modalTitle.textContent = T('settings_title');
    modalMessage.textContent = '';
    modalInput.style.display = 'none';
    modalButtons.innerHTML = '';
    const langs = [['ja', 'lang_ja'], ['simple', 'lang_simple'], ['en', 'lang_en']];
    langs.forEach(([code, key]) => {
        const btn = document.createElement('button');
        btn.textContent = T(key);
        if (currentLang === code) btn.style.background = '#ffaa00';
        btn.onclick = () => {
            currentLang = code;
            localStorage.setItem('japan_map_lang', code);
            closeModal();
        };
        modalButtons.appendChild(btn);
    });
    const closeBtn = document.createElement('button');
    closeBtn.textContent = T('dialog_close');
    closeBtn.className = 'secondary';
    closeBtn.onclick = closeModal;
    modalButtons.appendChild(closeBtn);
    modalOverlay.style.display = 'flex';
}

let gameState = 'title';
let currentMode = 'name';
let currentLevel = 4;
let questions = [];
let currentIdx = 0;
let correctCount = 0;
let startTime, pauseTime, totalTime;
let selectedOption = null;
let user = null;
let scale = 1;

let cachedMapImg = null;
let lastTargetCode = -1;
let lastTargetCodes = [];
let countdownMapImg = null;
let answeredCodes = [];
let wrongCodes = [];

let rankingTab = 'world';
let rankingMode = 'name';
let rankingLv = 4;
let rankingData = [];

let countdownVal = 3;
let countdownTimer = null;

let localPlayers = JSON.parse(localStorage.getItem('japan_map_players') || '["あたらしく名前を登録","あたらしく名前を登録","あたらしく名前を登録","あたらしく名前を登録","あたらしく名前を登録"]');
let currentPlayerIdx = parseInt(localStorage.getItem('japan_map_current_player') || '-1');
let showTime = localStorage.getItem('japan_map_show_time') !== 'false';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let titleImg = new Image();
titleImg.src = "images/title.png";

function init() {
    window.addEventListener('resize', resize);
    resize();
    canvas.addEventListener('mousedown', handleInput);
    window.addEventListener('keydown', handleInput);
    gameLoop();
}

function resize() {
    const vp = window.visualViewport;
    scale = Math.min(window.innerWidth / BASE_W, (vp ? vp.height : window.innerHeight) / BASE_H);
    canvas.width = BASE_W * scale;
    canvas.height = BASE_H * scale;
}

function handleInput(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.type === 'mousedown') ? (e.clientX - rect.left) / scale : -1;
    const y = (e.type === 'mousedown') ? (e.clientY - rect.top) / scale : -1;

    if (gameState === 'title') {
        if (x > 550 && x < 1050) {
            if (y > 290 && y < 365) gameState = 'level_select';
            else if (y > 385 && y < 460) gameState = 'player_select';
            else if (y > 480 && y < 555) { gameState = 'ranking'; rankingTab = 'world'; rankingMode = 'name'; rankingLv = 4; fetchRanking(); }
            else if (y > 575 && y < 650) showLangModal();
            else if (y > 670 && y < 745) window.location.href = "../index.html";
        }
    } else if (gameState === 'player_select') {
        if (x > 550 && x < 1050) {
            for (let i = 0; i < 5; i++) {
                if (y > 200 + i * 100 && y < 280 + i * 100) {
                    if (localPlayers[i] === NEW_PLAYER_MARKER) {
                        registerPlayer(i);
                    } else {
                        currentPlayerIdx = i;
                        localStorage.setItem('japan_map_current_player', i.toString());
                        gameState = 'title';
                    }
                }
            }
        }
        if (x > 1080 && x < 1180) {
            for (let i = 0; i < 5; i++) {
                if (y > 210 + i * 100 && y < 270 + i * 100 && localPlayers[i] !== NEW_PLAYER_MARKER) {
                    registerPlayer(i, true);
                }
            }
        }
        if (x > 1200 && x < 1300) {
            for (let i = 0; i < 5; i++) {
                if (y > 210 + i * 100 && y < 270 + i * 100 && localPlayers[i] !== NEW_PLAYER_MARKER) {
                    const delName = localPlayers[i];
                    showCustomConfirm(T('confirm_delete', {name: delName}), () => {
                        localPlayers[i] = NEW_PLAYER_MARKER;
                        if (currentPlayerIdx === i) {
                            currentPlayerIdx = -1;
                            localStorage.setItem('japan_map_current_player', "-1");
                        }
                        localStorage.setItem('japan_map_players', JSON.stringify(localPlayers));
                    });
                }
            }
        }
        if (x > 700 && x < 900 && y > 720 && y < 800) gameState = 'title';
    } else if (gameState === 'level_select') {
        if (x > 1250 && x < 1550 && y > 50 && y < 110) {
            showTime = !showTime;
            localStorage.setItem('japan_map_show_time', showTime.toString());
            return;
        }

        const modes = ['name', 'capital', 'region'];
        const levels = [2, 4, 8, 47];
        const startXLevel = 400;
        const startY = 250;
        const rowH = 150;
        const btnW = 220;
        const btnH = 100;

        modes.forEach((m, mi) => {
            levels.forEach((l, li) => {
                if (m === 'region' && l === 47) return;
                const bx = startXLevel + li * (btnW + 20);
                const by = startY + mi * rowH;
                if (x > bx && x < bx + btnW && y > by && y < by + btnH) {
                    currentMode = m;
                    TOTAL_QUESTIONS = (l === 47) ? 47 : ((m === 'region') ? 8 : 10);
                    startCountdown(l);
                }
            });
        });
        if (x > 700 && x < 900 && y > 780 && y < 860) gameState = 'title';
    } else if (gameState === 'ranking') {
        const tabW = 210; const gap = 20;
        const leftStart = (BASE_W/2 - gap*2) / 2 - (tabW * 2 + gap)/2 + 50;
        const rightStart = BASE_W/2 + (BASE_W/2 - (tabW * 3 + gap * 2))/2;

        if (y > 140 && y < 200) {
            if (x > leftStart && x < leftStart + tabW) { rankingTab = 'world'; fetchRanking(); }
            if (x > leftStart + tabW + gap && x < leftStart + tabW * 2 + gap) { rankingTab = 'local'; fetchRanking(); }
            if (x > rightStart && x < rightStart + tabW) { rankingMode = 'name'; fetchRanking(); }
            if (x > rightStart + tabW + gap && x < rightStart + tabW * 2 + gap) { rankingMode = 'capital'; fetchRanking(); }
            if (x > rightStart + (tabW + gap) * 2 && x < rightStart + tabW * 3 + gap * 2) { 
                rankingMode = 'region'; 
                if (rankingLv === 47) rankingLv = 8;
                fetchRanking(); 
            }
        }
        if (y > 220 && y < 270) {
            if (x > 670 && x < 770) { rankingLv = 2; fetchRanking(); }
            if (x > 780 && x < 880) { rankingLv = 4; fetchRanking(); }
            if (x > 890 && x < 990) { rankingLv = 8; fetchRanking(); }
            if (rankingMode !== 'region' && x > 1000 && x < 1120) { rankingLv = 47; fetchRanking(); }
        }
        if (x > 700 && x < 900 && y > 780 && y < 860) gameState = 'title';
    } else if (gameState === 'playing') {
        if (x > 1400 && y > 820) { gameState = 'title'; return; }
        questions[currentIdx].options.forEach((opt, i) => {
            const col = i % 2; const row = Math.floor(i / 2);
            const bx = 1050 + col * 270; const by = 180 + row * 150;
            if (x > bx && x < bx + 250 && y > by && y < by + 120) {
                selectedOption = opt;
                pauseTime = Date.now();
                if (currentMode === 'region') {
                    if (opt.name === questions[currentIdx].region) correctCount++;
                } else {
                    if (opt.code === questions[currentIdx].code) {
                        correctCount++;
                        if (currentLevel === 47) answeredCodes.push(opt.code);
                    } else {
                        if (currentLevel === 47) wrongCodes.push(questions[currentIdx].code);
                    }
                }
                gameState = 'waiting';
            }
        });
    } else if (gameState === 'waiting') {
        if (e.type === 'keydown' && e.code !== 'Enter' && e.code !== 'Space') return;
        currentIdx++;
        startTime += (Date.now() - pauseTime);
        if (currentIdx >= TOTAL_QUESTIONS) {
            totalTime = (Date.now() - startTime) / 1000;
            gameState = 'result';
            saveScore(totalTime);
        } else {
            gameState = 'playing';
            lastTargetCodes = [];
            cachedMapImg = null;
        }
        selectedOption = null;
    } else if (gameState === 'result') {
        if (y > 580 && y < 660 && x > 650 && x < 950) { gameState = 'ranking'; rankingTab = 'world'; rankingMode = currentMode; rankingLv = currentLevel; fetchRanking(); }
        if (y > 680 && y < 760 && x > 650 && x < 950) gameState = 'title';
    }
}

function checkNGWord(name) {
    let hira = name.replace(/[\u30A1-\u30F6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60));
    for (let i = 0; i < NG_WORDS_HIRAGANA.length; i++) {
        if (hira.includes(NG_WORDS_HIRAGANA[i])) return true;
    }
    return false;
}

function registerPlayer(i, isEdit = false) {
    let msg = isEdit ? T('register_prompt_edit') : T('register_prompt_new');
    let defaultVal = isEdit ? (localPlayers[i] === NEW_PLAYER_MARKER ? "" : localPlayers[i]) : "";
    showCustomPrompt(msg, defaultVal, (n) => {
        if (!n) return;
        let trimmed = n.trim().substring(0, 8);
        if (trimmed === "") return;

        if (!/^[ぁ-んー]+$/.test(trimmed)) {
            showCustomAlert(T('alert_hiragana_only'));
            return;
        }

        if (checkNGWord(trimmed)) {
            showCustomAlert(T('alert_ng_word'));
            return;
        }
        localPlayers[i] = trimmed;
        localStorage.setItem('japan_map_players', JSON.stringify(localPlayers));
        if (!isEdit) {
            currentPlayerIdx = i;
            localStorage.setItem('japan_map_current_player', i.toString());
            gameState = 'title';
        }
    });
}

function startCountdown(level) {
    currentLevel = level;
    gameState = 'countdown';
    countdownVal = 3;
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = JAPAN_MAP_SVG;
    const svgEl = tempDiv.querySelector('svg');
    if (svgEl) {
        svgEl.querySelectorAll('[data-code]').forEach(el => {
            el.style.fill = "#a0a0a0"; el.style.stroke = "#666";
        });
        const xml = new XMLSerializer().serializeToString(svgEl);
        const svg64 = btoa(unescape(encodeURIComponent(xml)));
        countdownMapImg = new Image();
        countdownMapImg.src = 'data:image/svg+xml;base64,' + svg64;
    }
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        countdownVal--;
        if (countdownVal <= 0) {
            clearInterval(countdownTimer);
            startQuiz(currentLevel);
        }
    }, 1000);
}

function startQuiz(level) {
    currentIdx = 0;
    correctCount = 0;
    lastTargetCode = -1;
    lastTargetCodes = [];
    answeredCodes = [];
    wrongCodes = [];
    cachedMapImg = null;
    if (currentMode === 'region') {
        questions = [...REGIONS].sort(() => Math.random() - 0.5).map(r => {
            const regionPrefs = PREFECTURES.filter(p => p.region === r.name);
            return { region: r.name, ruby: r.ruby, options: REGIONS, regionPrefs: regionPrefs };
        });
    } else {
        if (level === 47) {
            questions = [...PREFECTURES].sort(() => Math.random() - 0.5)
                        .map(q => ({...q, options: generateOptions(q)}));
        } else {
            questions = [...PREFECTURES].sort(() => Math.random() - 0.5).slice(0, TOTAL_QUESTIONS)
                        .map(q => ({...q, options: generateOptions(q)}));
        }
    }
    gameState = 'playing';
    startTime = Date.now();
}

function generateOptions(correct) {
    let others = PREFECTURES.filter(p => p.code !== correct.code).sort(() => Math.random() - 0.5);
    let optCount = (currentLevel === 47) ? 8 : currentLevel;
    return [correct, ...others.slice(0, optCount - 1)].sort(() => Math.random() - 0.5);
}

function gameLoop() {
    ctx.save();
    ctx.scale(scale, scale);
    ctx.clearRect(0, 0, BASE_W, BASE_H);
    if (gameState === 'title') drawTitle();
    else if (gameState === 'player_select') drawPlayerSelect();
    else if (gameState === 'level_select') drawLevelSelect();
    else if (gameState === 'ranking') drawRanking();
    else if (gameState === 'countdown') drawCountdown();
    else if (gameState === 'playing' || gameState === 'waiting') drawQuiz();
    else if (gameState === 'result') drawResult();
    ctx.restore();
    requestAnimationFrame(gameLoop);
}

function drawCountdown() {
    if (countdownMapImg && countdownMapImg.complete) ctx.drawImage(countdownMapImg, 20, 100, 1000, 750);
    drawText(countdownVal, 520, 480, 200, "bold", "#ff4500");
    drawText(T('countdown_hint'), 1320, 450, 36, "bold", "#000000");
    drawButton(1420, 830, 150, 50, T('quiz_quit'), "#c1e1c1", 20, "#333");
}

function drawQuiz() {
    const elapsed = (((gameState === 'waiting' ? pauseTime : Date.now()) - startTime) / 1000).toFixed(2);
    const q = questions[currentIdx];
    
    let targetCodes = [];
    if (currentMode === 'region') {
        if (lastTargetCodes.length === 0) {
            if (currentLevel === 2) { 
                targetCodes = q.regionPrefs.map(p => p.code);
            } else if (currentLevel === 4) {
                targetCodes = [...q.regionPrefs].sort(() => Math.random() - 0.5).slice(0, 2).map(p => p.code);
            } else {
                targetCodes = [q.regionPrefs[Math.floor(Math.random() * q.regionPrefs.length)].code];
            }
            lastTargetCodes = targetCodes;
        } else {
            targetCodes = lastTargetCodes;
        }
    } else {
        targetCodes = [q.code];
    }

    if (!cachedMapImg) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = JAPAN_MAP_SVG;
        const svgEl = tempDiv.querySelector('svg');
        if (svgEl) {
            svgEl.querySelectorAll('[data-code]').forEach(el => {
                el.style.fill = "#b0b0b0"; el.style.stroke = "#444"; el.style.strokeWidth = "1";
            });
            if (currentLevel === 47) {
                answeredCodes.forEach(code => {
                    const ansTarget = svgEl.querySelector(`[data-code="${code}"]`);
                    if (ansTarget) { ansTarget.style.fill = "#78c850"; ansTarget.style.stroke = "#444"; ansTarget.style.strokeWidth = "1"; }
                });
                wrongCodes.forEach(code => {
                    const wrgTarget = svgEl.querySelector(`[data-code="${code}"]`);
                    if (wrgTarget) { wrgTarget.style.fill = "#888888"; wrgTarget.style.stroke = "#444"; wrgTarget.style.strokeWidth = "1"; }
                });
            }
            targetCodes.forEach(code => {
                const target = svgEl.querySelector(`[data-code="${code}"]`);
                if (target) { target.style.fill = "#ff4500"; target.style.stroke = "#cc0000"; target.style.strokeWidth = "2"; }
            });
            const xml = new XMLSerializer().serializeToString(svgEl);
            const svg64 = btoa(unescape(encodeURIComponent(xml)));
            cachedMapImg = new Image();
            cachedMapImg.src = 'data:image/svg+xml;base64,' + svg64;
            if (currentMode !== 'region') lastTargetCode = q.code;
        }
    }

    if (cachedMapImg && cachedMapImg.complete) ctx.drawImage(cachedMapImg, 20, 100, 1000, 750);
    drawText(`${currentIdx + 1} / ${TOTAL_QUESTIONS}`, 100, 80, 40, "bold", "#000000", "left");
    if (showTime) {
        drawText(T('quiz_elapsed', {t: elapsed}), 1500, 80, 40, "bold", "#000000", "right");
    }

    let qTxt = currentMode === 'capital' ? T('quiz_q_capital') : (currentMode === 'region' ? T('quiz_q_region') : T('quiz_q_name'));
    drawText(qTxt, 550, 80, 36, "bold", "#000000");

    q.options.forEach((opt, i) => {
        const col = i % 2; const row = Math.floor(i / 2);
        const bx = 1050 + col * 270; const by = 180 + row * 150;
        let color = "#ffffff";
        if (gameState === 'waiting') {
            const isCorrect = (currentMode === 'region') ? opt.name === q.region : opt.code === q.code;
            if (isCorrect) {
                color = "#ff4500"; 
            } else if (selectedOption === opt) {
                color = "#4682b4"; 
            }
        }
        const label = currentMode === 'capital' ? opt.capital : opt.name;
        const ruby = currentMode === 'capital' ? opt.c_ruby : opt.ruby;
        drawQuizButton(bx, by, 250, 120, label, ruby, color);
    });
    drawButton(1420, 830, 150, 50, T('quiz_quit'), "#c1e1c1", 20, "#000000");
    if (gameState === 'waiting') {
        const isCorrect = (currentMode === 'region') ? selectedOption.name === q.region : selectedOption.code === q.code;
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; ctx.fillRect(0, 0, BASE_W, BASE_H);
        drawText(isCorrect ? T('quiz_correct') : T('quiz_incorrect'), BASE_W/2, 400, 120, "bold", isCorrect ? "#ff4500" : "#4682b4");
        drawText(T('quiz_next_hint'), BASE_W/2, 520, 40, "bold", "#ffffff");
    }
}

function drawTitle() {
    if (titleImg && titleImg.complete && titleImg.naturalWidth !== 0) {
        ctx.drawImage(titleImg, 0, 0, BASE_W, BASE_H);
    }
    
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.beginPath();
    ctx.roundRect(450, 80, 700, 740, 40);
    ctx.fill();

    drawText(T('title'), BASE_W/2, 170, 80, "bold", "#78c850");
    let pName = currentPlayerIdx === -1 ? T('player_none') : localPlayers[currentPlayerIdx];
    drawText(T('player_label', {name: pName}), BASE_W/2, 240, 36, "bold", "#8d7d6a");

    const menu = [
        { t: T('menu_start'), c: "#78c850" },
        { t: T('menu_player'), c: "#ffaa00" },
        { t: T('menu_ranking'), c: "#5bc0de" },
        { t: T('menu_settings'), c: "#c39bd3" },
        { t: T('menu_index'), c: "#8d7d6a" }
    ];

function drawText(txt, x, y, size, weight = "", color = "#000", align = "center") {
    ctx.fillStyle = color; ctx.font = `${weight} ${size}px 'M PLUS Rounded 1c'`;
    ctx.textAlign = align; ctx.fillText(txt, x, y);
}

function shadeColor(hex, percent) {
    if (typeof hex !== 'string' || !hex.startsWith('#') || hex.length !== 7) return hex;
    let num = parseInt(hex.slice(1), 16);
    let r = Math.max(0, Math.min(255, (num >> 16) + Math.round(255 * percent)));
    let g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + Math.round(255 * percent)));
    let b = Math.max(0, Math.min(255, (num & 0xFF) + Math.round(255 * percent)));
    return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

function fillButtonGradient(x, y, w, h, r, color) {
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, shadeColor(color, 0.16));
    grad.addColorStop(1, color);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = grad; ctx.fill();
}

function drawButton(x, y, w, h, txt, color, size = 32, textColor = "#fff") {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    fillButtonGradient(x, y, w, h, 30, color);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = shadeColor(color, -0.22); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 30); ctx.stroke();
    drawText(txt, x + w/2, y + h/2 + size/3.5, size, "bold", textColor);
}

function drawBalancedButton(x, y, w, h, txt, ruby, color) {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    fillButtonGradient(x, y, w, h, 30, color);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = shadeColor(color, -0.22); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 30); ctx.stroke();
    const mainSize = 34; const rubySize = 16; const gap = 6;
    const totalContentHeight = mainSize + rubySize + gap;
    const startY = y + (h - totalContentHeight) / 2 - 4;
    drawText(ruby, x + w/2, startY + rubySize / 1.1, rubySize, "bold", "rgba(255,255,255,0.95)");
    drawText(txt, x + w/2, startY + rubySize + gap + mainSize / 1.1, mainSize, "bold", "#fff");
}

function drawQuizButton(x, y, w, h, txt, ruby, color) {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.15)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    fillButtonGradient(x, y, w, h, 40, color);
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = "#8d7d6a"; ctx.lineWidth = 3; ctx.stroke();
    const mainSize = 44; const rubySize = 22; const gap = 8;
    const totalH = mainSize + rubySize + gap;
    const startY = y + (h - totalH) / 2;
    drawText(ruby, x + w/2, startY + rubySize / 1.1, rubySize, "bold", "#333333");
    drawText(txt, x + w/2, startY + rubySize + gap + mainSize / 1.1, mainSize, "bold", "#000000");
}

async function saveScore(time) {
    let localName = T('rank_guest');
    if (currentPlayerIdx !== -1 && localPlayers[currentPlayerIdx] !== NEW_PLAYER_MARKER) {
        localName = localPlayers[currentPlayerIdx];
    }

    const scoreObj = {
        uid: 'guest',
        name: localName,
        time: parseFloat(time),
        mode: currentMode,
        level: currentLevel,
        correct: correctCount,
        date: Date.now()
    };

    let localScores = JSON.parse(localStorage.getItem('japan_map_scores') || '[]');
    localScores.push(scoreObj);
    localScores.sort((a,b) => (b.correct !== a.correct) ? b.correct - a.correct : a.time - b.time);
    localStorage.setItem('japan_map_scores', JSON.stringify(localScores.slice(0, 100)));

    // --- Supabase保存 (World) ---
    try {
        await fetch(window._sb.b + '/rankings', {
            method: 'POST',
            headers: window._sb.h,
            keepalive: true,
            body: JSON.stringify({
                game: 'japan_map',
                difficulty: String(currentLevel),
                player_name: localName,
                point_score: correctCount,
                stage_score: 0,
                turns: Math.round(parseFloat(time)),
                class_name: currentMode,
                created_at: new Date().toISOString()
            })
        });
        console.log("Score saved to Supabase!");
    } catch(e) {
        console.error("Error saving score:", e);
    }
}

function formatDate(dt) {
    return `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`;
}

async function fetchRanking() {
    if (rankingTab === 'local') {
        let localScores = JSON.parse(localStorage.getItem('japan_map_scores') || '[]');
        rankingData = localScores
            .filter(d => d.level === rankingLv && d.mode === rankingMode)
            .sort((a,b) => (b.correct !== a.correct) ? b.correct - a.correct : a.time - b.time)
            .map(d => ({...d, date: d.date ? formatDate(new Date(d.date)) : "-"}));
    } else {
        // Supabase (World)
        try {
            const params = new URLSearchParams({
                game: 'eq.japan_map',
                difficulty: 'eq.' + String(rankingLv),
                class_name: 'eq.' + rankingMode,
                order: 'point_score.desc,turns.asc',
                limit: '20',
                select: 'player_name,point_score,turns,created_at'
            });
            const res = await fetch(window._sb.b + '/rankings?' + params.toString(), {
                headers: window._sb.rh
            });
            const rows = await res.json();
            rankingData = rows.map(d => ({
                name: d.player_name,
                correct: d.point_score,
                time: d.turns,
                level: rankingLv,
                mode: rankingMode,
                date: formatDate(new Date(d.created_at))
            }));
        } catch(e) {
            console.error("Ranking Error:", e);
            rankingData = [];
        }
    }
}
