<script>
function startTutorial() {
    FGLTutorial.begin({ root: '#container', getLang: () => currentLang });
    state.difficulty = 'EASY';
    CONFIG = Object.assign({}, PRESET_EASY);
    initGame();
    // 手順どおりに進むよう、手札とてきのまとカードを決めた値にする
    [6, 4, 2, 7, 1].forEach((v, i) => { state.cards[i].value = v; });
    const en = state.enemies[0];
    en.values = [10, 12, 14];
    en.gemCounts = [2, 1, 3];
    const CV = '#gameCanvas';
    const cv = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [canvas.width, canvas.height], pad: 8 });
    const enemyR = () => { const e = state.enemies[0]; return cv(e.x, e.y, e.width, e.height + 50); };
    const yellowR = () => { const e = state.enemies[0]; const a = e.getCardRect(0), b = e.getCardRect(e.values.length - 1); return cv(a.x, a.y, b.x + b.w - a.x, a.h); };
    const handR = () => { const a = state.cards[0], b = state.cards[4]; return cv(a.baseX, a.baseY, b.baseX + b.width - a.baseX, a.height); };
    const twoCardsR = () => { const a = state.cards[0], b = state.cards[1]; return cv(a.baseX, a.baseY, b.baseX + b.width - a.baseX, a.height); };
    const playR = () => {
        const e = state.enemies[0], c = state.cards[1];
        const y0 = e.y, y1 = c.baseY + c.height;
        return cv(Math.min(e.x, c.baseX), y0, Math.max(e.width, c.width + 40), y1 - y0);
    };
    // 手順どおりの操作だけ許すための、ぴったりの範囲(余白なし)
    const cardP = (c) => ({ sel: CV, rect: [c.baseX, c.baseY, c.width, c.height], of: [canvas.width, canvas.height], pad: 0 });
    const yellowP = (i) => () => { const r = state.enemies[0].getCardRect(i); return { sel: CV, rect: [r.x, r.y, r.w, r.h], of: [canvas.width, canvas.height], pad: 0 }; };
    const timeR = () => cv(16, 16, 88, 88);
    const discardR = () => cv(0, state.height * 0.87, state.width, state.height * 0.13);
    const settle = () => FGLTutorial.wait(() => !state.dragInfo && !state.flyingCards.length && !state.inputLocked, 6000);
    FGLTutorial.run([
        { type: 'say', target: enemyR, pos: 'bottom', text: {
            ja: 'てきが登場した！ てきの下にある黄色い「まとカード」が、たおすためのカギだよ。カードの数字と⭐に注目！',
