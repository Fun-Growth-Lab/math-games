    <style>
        /* バイオレット×シアン。--h は共通CSSの色相(たしざん=220, ひきざん=352, かけざん=150/172) */
        :root { --h: 268; --led: #7ee8ff; --led-soft: rgba(126,232,255,0.45); }
        .mon { --c: #9a6af0; --c2: #43d9ee; }

        /* ---- ロボ(150x150の箱に描いて縮小する)。体の色は --c、さし色は --c2 ---- */
        .rbx { position:absolute; left:50%; top:50%; width:150px; height:150px; margin:-75px 0 0 -75px; transform:scale(1.04); z-index:1; }
        .rbx .ab { position:absolute; }
        .vgr { background:linear-gradient(135deg, color-mix(in srgb, var(--c) 52%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 62%, #000)); box-shadow:inset 0 -6px 0 rgba(0,0,0,.16); }
        .vgd, .vcy { background:linear-gradient(135deg, color-mix(in srgb, var(--c2) 50%, #fff), var(--c2) 55%, color-mix(in srgb, var(--c2) 62%, #000)); box-shadow:inset 0 -5px 0 rgba(0,0,0,.14); }
        .vsv { background:linear-gradient(135deg,#f7f9ff,#b8b0d8 55%,#7a72a8); box-shadow:inset 0 -6px 0 rgba(0,0,0,.14); }
        .vdk { background:linear-gradient(135deg,#5a5478,#2a2540); }
        .vsc { background:#150f2e; border:4px solid #4a3a8a; box-shadow:inset 0 0 12px rgba(120,220,255,.28); }
        .vbolt { position:absolute; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#8e9bc0); }
        /* 目(ふつうの丸い目。ハイライトつき) */
        .vjt { position:absolute; border-radius:26%; background:#0d1226; overflow:hidden; box-shadow:0 0 0 2.5px #1a1230; animation: dvBlink 4.8s infinite; }
        .vjt .vp, .vjt .vl { display:none; }
        .vjt::before { content:''; position:absolute; left:28%; right:28%; top:12%; bottom:12%; border-radius:30%; background:var(--led); box-shadow:0 0 6px var(--led), inset 0 -3px 0 rgba(0,0,0,0.15); }
        @keyframes dvBlink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
        @keyframes dvPuff { 0% { transform:translateY(0) scale(.5); opacity:.9; } 100% { transform:translateY(-30px) scale(1.3); opacity:0; } }

        /* ---- 盤面 ---- */
        .dv-eq { position:absolute; left:20px; top:12px; width:680px; height:50px; box-sizing:border-box; border-radius:25px; display:flex; align-items:center; justify-content:center;

        .dv-eq span { font-size:1.9rem; font-weight:900; color:#3a2a7a; letter-spacing:1px; white-space:nowrap; }
        .dv-eq.ph span { font-size:1.05rem; color:#8a82b8; letter-spacing:0; }
        .dv-cap { position:absolute; height:54px; text-align:center; font-weight:900; line-height:1; }
        .dv-cap small { display:block; font-size:.95rem; letter-spacing:3px; }
        .dv-cap b { display:block; margin-top:2px; font-size:2.3rem; -webkit-text-stroke:5px #1a0e40; paint-order:stroke fill; }
        .dv-cap.Q small, .dv-cap.Q b { color:#7ee8ff; } .dv-cap.R small, .dv-cap.R b { color:#ffa6d0; }
        .dv-p { position:absolute; box-sizing:border-box; border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#3a2a7a;
            background:linear-gradient(#ffffff,#e4dcff); border:4px solid #43d9ee; box-shadow:0 5px 0 rgba(0,0,0,.3); }
        .dv-p.R { border-color:#ff8ac0; background:linear-gradient(#ffffff,#ffe3f1); color:#7a2a5a; }
        .dv-p b { font-size:2.3rem; line-height:1; }
        .dv-p.hit { background:linear-gradient(#9b97b4,#77728f); border-color:#5a5478; color:rgba(40,30,70,.55); box-shadow:0 2px 0 rgba(0,0,0,.3); transform:translateY(3px); }
        .dv-p.hit::after { content:''; position:absolute; left:50%; top:50%; width:30px; height:15px; margin:-12px 0 0 -15px; border-left:6px solid rgba(255,255,255,.65); border-bottom:6px solid rgba(255,255,255,.65); transform:rotate(-45deg); }
        .dv-p.hit b { opacity:.35; }
        .dv-p.tgt { border-color:#ffd24a; animation: dvTgt 1s ease-in-out infinite; }
        .dv-p.tgt b { font-size:2.8rem; }
        .dv-p.tgt::before { content:'★'; position:absolute; right:5px; top:1px; font-size:1rem; color:#ffb300; }
        @keyframes dvTgt { 0%,100% { box-shadow:0 5px 0 rgba(0,0,0,.3), 0 0 8px 2px rgba(255,210,74,.7); } 50% { box-shadow:0 5px 0 rgba(0,0,0,.3), 0 0 22px 8px rgba(255,210,74,1); } }
        .dv-p.pv { outline:4px solid #fff3b0; outline-offset:2px; animation: dvPv .5s ease-in-out infinite; }
        @keyframes dvPv { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
        .dv-hp { position:absolute; left:246px; top:72px; width:228px; text-align:center; line-height:1; }
        .dv-hp small { display:block; font-size:.95rem; font-weight:900; letter-spacing:3px; color:#7ee8ff; -webkit-text-stroke:4px #1a0e40; paint-order:stroke fill; margin-bottom:5px; }
        .dv-hp .bar { position:relative; height:30px; box-sizing:border-box; border-radius:16px; background:rgba(0,0,0,.5); border:3px solid #fff; overflow:hidden; box-shadow:0 4px 0 rgba(0,0,0,.35); }
        .dv-hp .bar i { display:block; height:100%; border-radius:12px; background:linear-gradient(#7be07f,#2e9d3a); transition:width .35s; }
        .dv-hp .bar i.mid { background:linear-gradient(#ffe86a,#e6b800); } .dv-hp .bar i.low { background:linear-gradient(#ff8a80,#d32f2f); }
        .dv-hp .bar b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.15rem; font-weight:900; color:#fff; text-shadow:0 2px 3px rgba(0,0,0,.8); }
        .dv-enemy { position:absolute; left:265px; top:136px; width:190px; height:196px; z-index:2; }
        .dv-enemy .gnd { position:absolute; left:20px; right:20px; bottom:0; height:22px; border-radius:50%; background:radial-gradient(ellipse at center, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 70%); }
        .dv-enemy .dv-ein { position:absolute; left:0; top:0; width:190px; height:190px; animation: monBob 2.6s ease-in-out infinite; filter:drop-shadow(0 8px 6px rgba(0,0,0,.4)); }
        .dv-enemy .rbx { transform:scale(1.3); }
        .dv-enemy.pop { animation: dvPop .45s cubic-bezier(.2,1.4,.4,1); }
        .dv-enemy.hit .dv-ein { animation: monHit .45s ease-out; }
        .dv-enemy.dead { animation: dvBoom .7s ease-in forwards; pointer-events:none; }
        @keyframes dvBoom { 0% { transform:scale(1); filter:brightness(1); opacity:1; } 35% { transform:scale(1.15); filter:brightness(2.4); opacity:1; } 100% { transform:scale(1.5); filter:brightness(3); opacity:0; } }
        .dv-hbox { position:absolute; box-sizing:border-box; border-radius:22px; background:rgba(255,255,255,.1); border:3px solid rgba(255,255,255,.35); }
        .hc.fh .nm { top:50%; bottom:auto; transform:translateY(-50%); font-size:2.8rem; color:#3a2a7a; }
        .dv-slot { position:absolute; will-change:transform; z-index:2; }
        .dv-slot.pop { animation: dvPop .35s cubic-bezier(.2,1.4,.4,1); }
        .dv-slot.dead { animation: dvGone .4s ease-in forwards; pointer-events:none; }
        @keyframes dvPop { from { scale:.2; opacity:0; } to { scale:1; opacity:1; } }
        @keyframes dvGone { to { opacity:0; transform:translateY(-50px) scale(.8); } }
        .dv-nc { position:absolute; inset:0; box-sizing:border-box; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; transition:transform .12s;
            background:linear-gradient(#ffffff,#e6dfff); border:6px solid var(--tc,#9a6af0); box-shadow:0 8px 0 rgba(0,0,0,.3), 0 14px 18px rgba(0,0,0,.3); }
        .dv-nc small { font-size:.85rem; font-weight:900; letter-spacing:3px; color:#7a6ab0; margin-bottom:6px; }
        .dv-nc b { font-size:3.8rem; font-weight:900; color:#3a2a7a; text-shadow:0 3px 0 #fff; }
        .dv-slot.tgt .dv-nc { transform:scale(1.07); box-shadow:0 8px 0 rgba(0,0,0,.3), 0 0 0 5px #ffe27a, 0 0 26px 8px rgba(255,226,122,.85); }
        .dv-pop { position:absolute; transform:translate(-50%,0); text-align:center; white-space:nowrap; pointer-events:none; z-index:30; animation: dvRise 2.4s ease-out forwards; }
        .dv-pop b { display:block; font-size:2.4rem; line-height:1.1; font-weight:900; color:#ffb300; -webkit-text-stroke:7px #fff; paint-order:stroke fill; }
        .dv-pop i { display:block; font-style:normal; font-size:1.9rem; line-height:1.1; font-weight:900; color:#e64a19; -webkit-text-stroke:6px #fff; paint-order:stroke fill; }
        .dv-pop.big b { font-size:3rem; }
        @keyframes dvRise { 0% { opacity:0; margin-top:20px; } 8% { opacity:1; } 70% { opacity:1; } 100% { opacity:0; margin-top:-70px; } }
        #game-area.danger { animation: dvDanger 1.2s ease-in-out infinite; }
        @keyframes dvDanger { 0%,100% { box-shadow:inset 0 0 36px 4px rgba(255,70,90,.06); } 50% { box-shadow:inset 0 0 46px 8px rgba(255,70,90,.4); } }
        #game-area.flash { animation: dvFlash .35s ease-out; }
        @keyframes dvFlash { 0% { box-shadow:inset 0 0 0 999px rgba(255,255,255,.35); } 100% { box-shadow:inset 0 0 0 999px rgba(255,255,255,0); } }

        /* ---- 左右パネル ---- */
        .dv-row { display:flex; align-items:center; gap:8px; height:30px; font-weight:900; color:#fff; }
        .dv-row .lb { flex:1; font-size:.85rem; color:#ffd98a; letter-spacing:1px; }
        .dv-row b { font-size:1.35rem; text-shadow:0 2px 0 rgba(0,0,0,.4); }
        .dv-ap { text-align:center; line-height:1; }
        .dv-ap #disp-ap { display:block; font-size:3.6rem; font-weight:900; color:#ffe27a; text-shadow:0 3px 0 #a35c00; margin-top:2px; }
        .dv-ap #disp-ap.low { color:#ff6a5c; text-shadow:0 3px 0 #7a1a10; animation: apLow .7s ease-in-out infinite; border-radius:12px; }
        .dv-stats { display:flex; gap:6px; }
        .dv-stats .t { flex:1; text-align:center; border-radius:10px; padding:5px 2px 4px; background:rgba(0,0,0,.28); border:2px solid rgba(255,255,255,.15); }
        .dv-stats .t b { display:block; font-size:1.4rem; line-height:1.1; font-weight:900; color:#fff; }
        .dv-stats .t span { display:block; margin-top:1px; font-size:.62rem; font-weight:800; color:hsl(var(--h) 100% 86.9%); line-height:1.15; }

<script src="division-config.js?v=20261040"></script>
<script>
// ---- このゲーム(固有)の設定 ----
const RUN_LIST = [
    { id: 'normal', color: '#7a4fd6' },
    { id: 'locked', color: '#7d7f92', locked: true },
];
const GAME = {
    sbGame: 'math_braves_division_v2',
    keys: { lang: 'mb_div_lang', lastStar: 'mb_div_last_star', ranking: d => `math_braves_div_ranking_v2_${d}`, clearCount: d => `math_braves_div_clears_v2_${d}` },
    stageCount: 7,
    stageCountFor: (star) => [PRESET_EASY, PRESET_NORMAL, PRESET_HARD][star - 1].maxRound,   // ラウンド数は★ごと(3/5/7)
    stageThemes: [{ c: '#9acd4a' }, { c: '#2fbf71' }, { c: '#26c6da' }, { c: '#4aa0f0' }, { c: '#a064ea' }, { c: '#ef6aa8' }, { c: '#ff9a4a' }],
    // 15=ボックス 0=パトカー 5=しんかんせん 10=ヘリ 3=スポーツカー 14=UFO
    titleBots: [[5, 24, 545, 1.0, '#ef6aa8'], [3, 1130, 545, 1.0, '#9a6af0']],
    // タイトルの主役: 大きな数字カードの扇(まん中の金のカードが答え)と演算のバッジ
    // タイトルの主役: 商のパネル(水色)と余りのパネル(ピンク)をHITで消していく。まん中のロボのHPがへる
    titleColors: 'violet',
    titleHero: () => {
        const grid = (x, y, hits, tgt, bd, tx) => {
            let h = '';
            for (let i = 0; i < 9; i++) {
                const hit = hits.includes(i + 1), t = tgt === i + 1, l = x + (i % 3) * 74, tp = y + Math.floor(i / 3) * 74;
                h += FH.cell(hit ? '✔' : (i + 1), l, tp, 66, 66, hit ? 'linear-gradient(#9b97b4,#77728f)' : 'linear-gradient(#ffffff,#e4dcff)',
                    { fs: 36, style: 'border:4px solid ' + (t && !hit ? '#ffd24a' : hit ? '#5a5478' : bd) + ';color:' + (hit ? 'rgba(255,255,255,.85)' : tx) + ';text-shadow:0 3px 0 ' + (hit ? 'rgba(0,0,0,.25)' : '#fff') + ';box-shadow:0 5px 0 rgba(0,0,0,.3)' + (t && !hit ? ',0 0 20px 5px rgba(255,210,74,.9)' : '') + ';' });
            }
            return h;
        };
        return FH.glow(470, 200, 360, 'rgba(160,110,255,0.45)')
            + FH.pill('商', 150, 196, { w: 110, style: 'height:46px;font-size:1.6rem;color:#0d5a6a;border-color:#43d9ee;' }) + FH.pill('余り', 1018, 196, { w: 110, style: 'height:46px;font-size:1.6rem;color:#8a2a5a;border-color:#ff8ac0;' })
            + grid(140, 252, [3, 4, 9], 7, '#43d9ee', '#3a2a7a') + grid(926, 252, [2, 6], 5, '#ff8ac0', '#7a2a5a')
            + FH.hp(520, 214, 240, 70, '7 / 10') + FH.mon(monHTML(14), 528, 250, 1.4, '#9a6af0')
    },
    runArt: { shape: 15, color: '#9a6af0' },
    // ラウンドクリアの画面: ビンゴ・パーフェクト・APボーナス
    clearRows: (st, stageScore) => `<div><span>${T('bingo_label')}</span><b>${state.roundBingos}${T('times_suffix')}</b></div>`
        + `<div><span>${T('perfect_label')}</span><b>${state.roundPerfects}${T('times_suffix')}</b></div>`
        + `<div><span>${T('ap_bonus_label')}</span><b>+${state.apBonus}</b></div>`,
    endBreakdown: () => `${T('bingo_label')}${state.totalBingos}${T('times_suffix')} ＋ ${T('perfect_label')}${state.totalPerfects}${T('times_suffix')}`,
    // ゲーム画面(左右パネル+盤面)
    gameLayerHTML: `
    <div id="game-layer">
        <div id="left-panel">
            <div class="sp-brand"><i class="ico" data-ico="robot"></i><span data-i18n="subject_badge">わりざん</span><i class="ico" data-ico="robot"></i></div>
            <div class="sp-mode"><span class="rn" id="sp-run"></span><span class="df" id="sp-diff"></span></div>
            <div class="sp-card sp-player">
                <div class="av" id="sp-av">な</div>
                <div class="who"><div class="sp-lb" data-i18n="label_player" data-noemo>プレーヤー</div><span id="disp-player-name">ななしさん</span></div>
            </div>
            <div class="sp-card">
                <div class="sp-lb"><i class="ico" data-ico="flag"></i><span data-i18n="label_stage" data-noemo>ラウンド</span><b class="rt-num" id="disp-difficulty-label"></b></div>
                <div class="rt-list" id="sp-route"></div>
            </div>
            <div class="sp-card dv-ap">
                <div class="sp-lb"><i class="ico" data-ico="sword"></i><span data-i18n="label_ap" data-noemo>のこりAP</span></div>
                <b id="disp-ap">10</b>
            </div>
            <div class="sp-spacer"></div>
            <button id="btn-howto" class="sp-btn"><i class="ico" data-ico="book"></i><span data-i18n="btn_howto" data-noemo>あそびかた</span></button>
            <button id="btn-to-title" class="sp-btn red hidden title-menu-btn"><i class="ico" data-ico="home"></i><span data-i18n="btn_to_title">タイトルへ もどる</span></button>
        </div>

        <div id="game-area">
            <div id="bl"></div>
            <canvas id="gameCanvas"></canvas>
            <div id="game-result" style="display: none;"></div>
        </div>

        <div id="right-panel">
            <div id="right-panel-content" class="invisible">
                <div class="sp-card">
                    <div class="sp-lb"><i class="ico" data-ico="trophy"></i><span data-i18n="label_total_score" data-noemo>ごうけい スコア</span></div>
                    <div id="disp-total-score" class="sp-score">0</div>
                </div>
                <div class="sp-card">
                    <div class="sp-lb"><i class="ico" data-ico="medal"></i><span data-i18n="dv_this_round" data-noemo>このラウンド</span></div>
                    <div class="dv-stats">
                        <div class="t"><b id="disp-round-score">0</b><span data-i18n="dv_score_short">スコア</span></div>
                        <div class="t"><b id="disp-round-bingo">0</b><span data-i18n="dv_bingo_short">ビンゴ</span></div>
                        <div class="t"><b id="disp-round-perfect">0</b><span data-i18n="dv_perfect_short">パーフェクト</span></div>
                    </div>
                </div>
                <div class="sp-card sp-log">
                    <div class="sp-lb"><i class="ico" data-ico="list"></i><span data-i18n="panel_battle_log" data-noemo>バトルログ</span></div>
                    <div id="battle-log-entries"></div>
                </div>
            </div>
        </div>
    </div>`,

            stage_word: "ROUND", rank_stage_prefix: "R", stage_log: "<b>ラウンド{n}</b> {name}", final_title: "ファイナルラウンド！",
            label_stage: "ラウンド", stage_clear_title: "ラウンド{n} クリア！", sc_stage_score: "このラウンドの スコア", btn_next_stage: "ラウンド{n}へ ▶", end_reached: "とうたつ ラウンド",
            label_ap: "のこりAP",
            canvas_quotient: "しょう", canvas_quotient_kanji: "商", canvas_remainder: "あまり", canvas_remainder_kanji: "余り",
            equation_placeholder: "カードを かずカードに かさねて わりざん！", equation_remainder_word: "あまり",
            target_get: "ターゲットGET!", hit_text: "HIT!", perfect_text: "パーフェクト!",
            ap_bonus_label: "APボーナス", bingo_label: "ビンゴ", perfect_label: "パーフェクト", times_suffix: " かい",
            dv_quota_top: "のこり HIT", dv_dividend: "わられる数", dv_this_round: "このラウンド", dv_score_short: "スコア", dv_bingo_short: "ビンゴ", dv_perfect_short: "パーフェクト",
            dv_log_eq: "{eq}　<b>+{n}</b>", dv_log_bingo: "BINGO！ <b>+{n}</b>", dv_log_perfect: "パーフェクト！ <b>+{n}</b>",
            howto_p1: "1. <strong>てふだ(2〜10)</strong>を、場の<strong>数字カード</strong>に<br>かさねて <strong>わりざん</strong>をしよう！",
            howto_p2: "2. <strong>商</strong>と<strong>あまり</strong>の パネルを うめよう。<br>HITすると 灰色になるよ。",
            howto_p3: "3. 光っている<strong>ターゲット</strong>に HITすると<br>とくてんが 2ばい（りょうほうなら4ばい）！",
            howto_p4: "4. HITするたびに 真ん中の<strong>ロボ</strong>のHPが へるよ。<br>0に すると <strong>ラウンドクリア</strong>。APが 0で まけ。",
            howto_p5: "5. たて・よこ・ななめに 3つそろうと<br><strong>BINGO</strong>！ 1れつごとに 500pt。",
            howto_p6: "6. 9つ ぜんぶ うめると <strong>パーフェクト</strong>！ 2000pt。",
        },
        simple: {

<script src="../braves-run.js?v=20261120"></script>
<script>
// ============================================================
// チュートリアル（練習プレイ）
// ============================================================
// 実際の画面で「手札(わる数)を場の数字カード(わられる数)にかさねて、商とあまりのパネルをHITさせる」を体験する。
// 書き込みはエンジンが止めるので、ランキング・クリア回数は一切汚れない。
function startTutorial() {
    FGLTutorial.begin({ root: '#container', getLang: () => currentLang });
    state.star = 1; state.difficulty = 'STAR1';
    CONFIG = Object.assign({}, PRESET_EASY);
    STAGE_COUNT = CONFIG.maxRound;
    initGame();
    state.tutorial = true;
    startStage(1);
    // 手順どおりに進むよう、手札と場の数字カードを決めた値にする
    [7, 3, 5, 2, 9].forEach((v, i) => { state.cards[i].value = v; });
    [23, 19, 14].forEach((v, i) => { state.fieldCards[i].value = v; });
    const CV = '#gameCanvas';
    const cv = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [canvas.width, canvas.height], pad: 8 });
    const rectP = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [canvas.width, canvas.height], pad: 0 });   // 手順どおりの操作だけ許すための、ぴったりの範囲
    const fieldR = () => cv(slotX(0), SLOT_Y, 3 * SLOT_W + 2 * SLOT_GAP, SLOT_H);
    const handR = () => cv(handX(0), HAND_Y, 5 * HAND_W + 4 * HAND_GAP, HAND_H);
    const playR = () => { const a = state.fieldCards[0], c = state.cards[0]; return cv(Math.min(a.x, c.targetX) - 10, a.y, Math.max(a.w, c.w) + 40, c.baseY + c.h - a.y); };
    const panelsR = () => cv(GROUP_X_Q - 10, GROUP_Y - 60, state.width - (GROUP_X_Q - 10) * 2, GROUP_W + 70);
    let sc1 = 0;
    const settle = () => FGLTutorial.wait(() => !state.dragInfo && !state.inputLocked, 6000);
    FGLTutorial.run([
        { type: 'say', target: fieldR, pos: 'top', text: {
            ja: '下の3まいのカードの数字は「わられる数」。ここに手札のカードを重ねて、わり算をするよ！',
            easy: 'したの3まいのカードのすうじは「わられるかず」。ここにてふだのカードをかさねて、わりざんをするよ！',
            en: 'The number on each of the 3 cards below is the number to be divided. Drop a hand card onto one to do a division!' } },
        { type: 'say', target: handR, pos: 'top', text: {
            ja: 'いちばん下の手札(2〜10)は「わる数」だよ。ドラッグして、上のカードに重ねてみよう。',
            easy: 'いちばんしたのてふだ(2〜10)は「わるかず」だよ。ドラッグして、うえのカードにかさねてみよう。',
            en: 'The hand cards (2–10) at the bottom are the divisors. Drag one onto a card above.' } },
        { type: 'say', target: panelsR, pos: 'bottom', text: {
            ja: '左は「商」、右は「あまり」の 1〜9 のパネル。わり算の答えと同じ数字のパネルにHITすると、灰色になるよ！',
            easy: 'ひだりは「しょう」、みぎは「あまり」の 1〜9 のパネル。わりざんのこたえとおなじすうじのパネルにHITすると、はいいろになるよ！',
            en: 'The left grid is for the quotient, the right grid for the remainder (1–9). When your division answer matches a panel, it is HIT and turns gray!' } },
        { type: 'do', target: playR, pos: 'bottom', until: () => state.score > 0,
          only: { from: () => { const c = state.cards[0]; return rectP(c.targetX, c.baseY, c.w, c.h); }, to: () => { const f = state.fieldCards[0]; return rectP(f.x, f.y, f.w, f.h); }, hint: {
            ja: '手札の「7」を、「23」のカードにドラッグして重ねてみよう！',
            easy: 'てふだの「7」を、「23」のカードにドラッグしてかさねてみよう！',
            en: 'Drag the "7" from your hand onto the "23" card!' } }, text: {
            ja: '手札の 7 を、23 のカードにドラッグして重ねてみよう！ 23 ÷ 7 を計算するよ。',
            easy: 'てふだの 7 を、23 のカードにドラッグしてかさねてみよう！ 23 ÷ 7 をけいさんするよ。',
            en: 'Drag the 7 from your hand onto the 23 card! That calculates 23 ÷ 7.' } },
        { type: 'run', fn: settle },
        { type: 'say', target: panelsR, pos: 'bottom', text: {
            ja: '23 ÷ 7 ＝ 3 あまり 2。商の「3」とあまりの「2」のパネルがHIT！ 両方HITすると300点、片方だけなら100点だよ。',
            easy: '23 ÷ 7 ＝ 3 あまり 2。しょうの「3」とあまりの「2」のパネルがHIT！ りょうほうHITすると300てん、かたほうだけなら100てんだよ。',
            en: '23 ÷ 7 = 3 remainder 2. The quotient panel "3" and the remainder panel "2" are HIT! Both hits give 300 points, one hit gives 100.' } },
        { type: 'do', target: [fieldR, handR], pos: 'top', before: () => { sc1 = state.score; }, until: () => state.score > sc1,
          only: { from: () => { const c = state.cards.find(k => k && k.value === 2); return rectP(c.targetX, c.baseY, c.w, c.h); }, to: () => { const f = state.fieldCards.find(k => k && k.value === 14); return rectP(f.x, f.y, f.w, f.h); }, hint: {
            ja: '手札の「2」を、「14」のカードにドラッグして重ねてみよう！',
            easy: 'てふだの「2」を、「14」のカードにドラッグしてかさねてみよう！',
            en: 'Drag the "2" from your hand onto the "14" card!' } }, text: {
            ja: 'もう1回！ 手札の「2」を、「14」のカードにドラッグしてみよう。14 ÷ 2 ＝ 7 で、わりきれる（あまり0）よ。',
            easy: 'もういっかい！ てふだの「2」を、「14」のカードにドラッグしてみよう。14 ÷ 2 ＝ 7 で、わりきれる（あまり0）よ。',
            en: 'Once more! Drag the "2" onto the "14" card. 14 ÷ 2 = 7 with no remainder.' } },
        { type: 'run', fn: settle },
        { type: 'say', target: panelsR, pos: 'bottom', text: {
            ja: 'わりきれるとき（あまり0）は、あまりのパネルはなく、商のパネルだけがHITするよ。',
            easy: 'わりきれるとき（あまり0）は、あまりのパネルはなく、しょうのパネルだけがHITするよ。',
            en: 'When it divides evenly (remainder 0) there is no remainder panel — only the quotient panel is HIT.' } },
        { type: 'say', target: panelsR, pos: 'bottom', text: {
            ja: '光っているパネルは「ターゲット」。ターゲットにHITすると得点が2倍、商とあまりの両方なら4倍になるよ！ 縦・横・ななめに3つそろうとビンゴで500点のボーナス！',
            easy: 'ひかっているパネルは「ターゲット」。ターゲットにHITするととくてんが2ばい、しょうとあまりのりょうほうなら4ばいになるよ！ たて・よこ・ななめに3つそろうとビンゴで500てんのボーナス！',
            en: 'Glowing panels are "targets". Hitting a target doubles the points, and hitting both quotient and remainder targets makes it ×4! Three in a row (any direction) is a BINGO worth +500!' } },
        { type: 'say', target: '#left-panel', pos: 'right', text: {
            ja: 'カードを使うたびに「AP」が1へるよ。APが0になると負け。決められた数のパネルをHITさせれば、ラウンドクリア！ 真ん中のロボのHPは、あと何こHITすればいいかを表しているよ。HITするたびに へって、0で ロボをたおせるよ！',
            easy: 'カードをつかうたびに「AP」が1へるよ。APが0になるとまけ。きめられたかずのパネルをHITさせれば、ラウンドクリア！ まんなかのロボのHPは、あとなんこHITすればいいかをあらわしているよ。HITするたびにへって、0でロボをたおせるよ！',
            en: 'Each card you use costs 1 AP. At 0 AP you lose. HIT the required number of panels to clear the round! The HP of the robot in the middle shows how many more HITs you need — each HIT lowers it, and at 0 the robot goes down!' } }
    ]);
}
</script>
