<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>fgl-felt 見本</title>
<link rel="stylesheet" href="fgl-felt.css">
<style>
    body { margin: 0; background: #222; font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
    /* 見本用の色えらび（本番では不要）。URLに ?c=1f7a58 と付けるとその色で開く */
    #pick { display: flex; gap: 8px; padding: 8px; background: #111; }
    #pick button { width: 48px; height: 32px; border-radius: 8px; border: 2px solid #fff; cursor: pointer; }
</style>
</head>
<body>
<div id="pick"></div>
<div class="fx-screen" id="scr">
    <div class="fx-top">
        <button class="fx-btn">◀ タイトルへ戻る</button>
        <div class="fx-plaque">設定</div>
        <button class="fx-btn blue">🏆 ランキング</button>
    </div>
    <div class="fx-board" style="width:860px">
        <div class="fx-chip"><small>現在の名前：</small>ななしさん</div>
        <div style="display:flex;gap:12px;align-items:center;margin:16px 0 6px">
            <input class="fx-input" style="width:420px" placeholder="なまえをにゅうりょく">
            <button class="fx-btn orange">追加</button>
        </div>
        <div class="fx-note" style="margin-bottom:18px">メインカラーを変えると、背景・看板・縁取り・影の色がそろって変わります</div>
        <div class="fx-label">言語</div>
        <div class="fx-row">
            <button class="fx-card">かんたん</button>
            <button class="fx-card on"><em class="fx-pick">▶ 選択中</em>日本語</button>
            <button class="fx-card ok">English ✓</button>
            <button class="fx-card locked">🔒 ロック</button>
        </div>
    </div>
</div>
<script>
    const COLORS = { 緑: '#1f7a58', 青: '#2f6fb8', 紫: '#6a4fb8', 赤: '#b8452f', 橙: '#c9822a', 茶: '#7a5a3a' };
    const scr = document.getElementById('scr'), pick = document.getElementById('pick');
    function setColor(c){ scr.style.setProperty('--fx-main', c); }
    Object.entries(COLORS).forEach(([n, c]) => { const b = document.createElement('button'); b.style.background = c; b.title = n; b.onclick = () => setColor(c); pick.appendChild(b); });
    const q = new URLSearchParams(location.search).get('c'); if (q) setColor('#' + q.replace('#', ''));
</script>
</body>
</html>
