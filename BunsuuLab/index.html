function basePt(id) { return Math.round(120 / WEIGHT(CARD_BY_ID[id])); }
// Lvアップ1回で 基礎点の25%(四捨五入)ずつ上がる（どのカードも上昇率がそろう）
function lvStep(id) { return Math.round(basePt(id) * 0.25); }
function cardPts(run, id) { return basePt(id) + lvStep(id) * (run.cardLv[id] - 1); }
function yakuMult(run, yid) { if (!yid) return 1; const y = YAKU_BY_ID[yid]; return y.base + y.step * (run.yakuLv[yid] - 1); }
function comboMult(chain) { return 1 + COMBO_STEP * Math.max(0, chain - 1); }
// あてはまる役が いくつかあるときは、いちばん倍率の高い役
function yakuList(ids) {
    const out = [];
    if (ids.length < 2) return out;
    if (ids.every(x => x === ids[0])) out.push('osoroi');
    const ds = ids.map(x => CARD_BY_ID[x].d);
    if (ds.every(d => d === ds[0])) out.push('nakama');
    if (new Set(ds).size === ds.length) out.push('rainbow');
    if (ids.length >= 3 && new Set(ids).size === 2) out.push('full');
    return out;
}
function yakuOf(ids, run) {
    const l = yakuList(ids); if (!l.length) return null;
    return l.sort((a, b) => yakuMult(run, b) - yakuMult(run, a))[0];
}
// スキル: もっていて 条件を みたすと 発動し、倍率に かかる。同じスキルを また引くと Lvが上がり、倍率の 1より上の部分が たし算で ふえる
// (例: 上り階段 Lv2 = 1 + 0.25 + 0.25 = ×1.5)
const SKILLS = [
    { id: 'haisui', name: '背水の陣',     desc: '壊れた試験管がある' },
    { id: 'center', name: 'センター分け', desc: '1/2の所に区切りを作って完成させる', add: 0.25 },
    { id: 'three',  name: 'スリーカード', desc: 'ちょうど3枚で完成させる', add: 0.2 },
    { id: 'four',   name: 'フォーカード', desc: 'ちょうど4枚で完成させる', add: 0.4 },
    { id: 'five',   name: 'ファイブカード', desc: 'ちょうど5枚で完成させる', add: 0.6 },
    { id: 'up',     name: '上り階段',     desc: '小さい順に入れて完成させる（同じカードは不可）', add: 0.25 },
    { id: 'down',   name: '下り階段',     desc: '大きい順に入れて完成させる（同じカードは不可）', add: 0.25 },
    { id: 'last',   name: 'ラストピース', desc: '最後の1枚を1/12にして完成させる', add: 0.5 },
    { id: 'nomiss', name: 'ノーミス',     desc: 'このステージでまだバーストしていない', add: 0.2 },
    { id: 'uchi',   name: '打ちまわし',   desc: 'チェンジ回数を使い切っている', add: 0.5 },
    { id: 'charge', name: 'フルチャージ', desc: 'チェンジ回数を一度も使っていない', add: 0.25 },
    { id: 'mitsu',  name: '三つ巴',       desc: '他の2本にも中身が入った状態で完成させる', add: 0.3 },
];
const SKILL_BY_ID = {}; SKILLS.forEach(k => { SKILL_BY_ID[k.id] = k; });
// 発動したときの「1より上の部分」(Lv1ぶん)。発動しなければ 0
function skillAdd(id, x) {
    const ts = x.ids.map(i => CARD_BY_ID[i].t);
    switch (id) {
        case 'haisui': return x.broken * 0.5;
        case 'center': { let s = 0; for (let k = 0; k < ts.length - 1; k++) { s += ts[k]; if (s === 6) return 0.25; } return 0; }
        case 'three': return ts.length === 3 ? 0.2 : 0;
        case 'four': return ts.length === 4 ? 0.4 : 0;
        case 'five': return ts.length === 5 ? 0.6 : 0;
        case 'up': return ts.length >= 2 && ts.every((v, k) => k === 0 || v > ts[k - 1]) ? 0.25 : 0;
        case 'down': return ts.length >= 2 && ts.every((v, k) => k === 0 || v < ts[k - 1]) ? 0.25 : 0;
        case 'last': return x.ids[x.ids.length - 1] === '1/12' ? 0.5 : 0;
        case 'nomiss': return x.bursts === 0 ? 0.2 : 0;
        case 'uchi': return x.discards === 0 ? 0.5 : 0;
        case 'mitsu': return x.othersFilled ? 0.3 : 0;
        case 'charge': return x.fullChange ? 0.25 : 0;
    }
    return 0;
}
// もっているスキルのうち 発動したもの [{id, lv, m}]
function skillsFired(run, st, ti, ids) {
    const x = { ids, broken: st.tubes.filter((t, k) => k !== ti && t.broken).length, bursts: st.bursts, discards: st.discards,
        othersFilled: st.tubes.every((t, k) => k === ti || (!t.broken && t.sum > 0)), fullChange: st.discards >= run.discardMax };
    const out = [];
    Object.keys(run.skills).forEach(id => { const lv = run.skills[id], a = skillAdd(id, x); if (lv > 0 && a > 0) out.push({ id, lv, m: 1 + a * lv }); });
    return out;
}

function drawWeight(c) { return run && rule().noHalf && c.id === '1/2' ? 0 : WEIGHT(c); }
let tutDraw = [];   // チュートリアル中に引くカードを決めておく
function drawCard() {
    if (tutDraw.length) return tutDraw.shift();
    let tot = 0; CARDS.forEach(c => { tot += drawWeight(c); });
    let r = Math.random() * tot;
    for (const c of CARDS) { r -= drawWeight(c); if (r < 0) return c.id; }
    return CARDS[CARDS.length - 1].id;
}
// ボーダーに届いたら すぐクリア。クリアコイン8 ＋ 早期クリアボーナス(山札の残り3枚ごとに+2)
const CLEAR_COIN = 8, EARLY_PER = 3;
// 高得点コイン（ステラ・アレアと同じ考え方）: そのステージのボーダーの1/6を「めやす」にして、
// 得点が めやす以上で+2、2倍で+4、4倍で+6 … と、倍になるごとに+2（点数に比例させると増えすぎるため）
const PT_BASE = 6;
function ptCoin(pts) { const q = border() / PT_BASE; return pts >= q ? 2 * (1 + Math.floor(Math.log2(pts / q))) : 0; }
function clearCoins(deckLeft) { return { base: CLEAR_COIN, bonus: Math.floor(deckLeft / EARLY_PER) * 2 }; }
function newRun(star, rid) {
    const cardLv = {}; CARDS.forEach(c => { cardLv[c.id] = 1; });
    const yakuLv = {}; YAKU.forEach(y => { yakuLv[y.id] = 1; });
    return { star, stage: 1, cardLv, yakuLv, coins: 0, discardMax: DISCARDS, broken: [false, false, false], rep: [0, 0, 0], stageScores: [], sale: new Set(), skills: {}, rid };
}
function newStage(run) {
    const st = { tubes: [], hand: [], deck: DECK_SIZE, discards: run.discardMax, chain: 0, score: 0, bursts: 0 };
    for (let i = 0; i < TUBES; i++) st.tubes.push({ ids: [], sum: 0, broken: run.broken[i], rep: run.rep[i] });
    for (let i = 0; i < HAND; i++) { st.hand.push(drawCard()); st.deck--; }
    return st;
}
function refill(st, slot) {
    if (st.deck > 0) { st.hand[slot] = drawCard(); st.deck--; return true; }
    st.hand.splice(slot, 1); return false;
}
function playCard(run, st, slot, ti) {
    const id = st.hand[slot], c = CARD_BY_ID[id], tb = st.tubes[ti];
    if (tb.broken) return null;
    tb.ids.push(id); tb.sum += c.t;
    let res;
    if (tb.sum > ONE) {
        res = { type: 'burst', ids: tb.ids.slice(), ti };
        tb.broken = true; tb.rep = 0; tb.ids = []; tb.sum = 0; st.chain = 0; st.bursts++;
    } else if (tb.sum === ONE) {
        st.chain++;
        const yid = yakuOf(tb.ids, run);
        const base = tb.ids.reduce((a, x) => a + cardPts(run, x), 0);
        const ym = yakuMult(run, yid), cm = comboMult(st.chain);
        const sks = skillsFired(run, st, ti, tb.ids), sk = sks.reduce((a, k) => a * k.m, 1);
        const pts = Math.round(base * ym * cm * sk);
        let fixed = -1;
        let half = -1;
        if (rule().rep2) {   // 少し時間をくれないか: ぴったり1が2回で なおる。半分なおった管が先、なければ上から
            let k = st.tubes.findIndex(t => t.broken && t.rep === 1); if (k < 0) k = st.tubes.findIndex(t => t.broken);
            if (k >= 0) { st.tubes[k].rep++; if (st.tubes[k].rep >= 2) { st.tubes[k].broken = false; st.tubes[k].rep = 0; fixed = k; } else half = k; }
        } else for (let k = 0; k < TUBES; k++) if (st.tubes[k].broken) { st.tubes[k].broken = false; fixed = k; break; }
        res = { type: 'perfect', ids: tb.ids.slice(), ti, yaku: yid, base, ym, cm, sks, chain: st.chain, pts, fixed, half };
        st.score += pts; tb.ids = []; tb.sum = 0;
        if (pts > (run.bestPlay || 0)) { run.bestPlay = pts; run.bestYaku = yid || 'none'; }
        res.coin = ptCoin(pts); run.coins += res.coin;   // 高得点コイン
    } else res = { type: 'fill', ids: tb.ids.slice(), ti };
    res.drew = refill(st, slot);
    return res;
}
// チェンジ: 手札の1枚を 新しいカードに入れかえる（山札は減らない。同じカードが出ることもある）
function discardCard(st, slot) {
    if (st.discards <= 0) return false;
    st.discards--; st.hand[slot] = drawCard(); return true;
}
function allBroken(st) { return st.tubes.every(t => t.broken); }

function runOpen(i) { return i === 0 || bestStar(RUNS[i - 1].id) >= 1; }
// 基本は最初から★1〜3を選べる。ほかのRUNは 前のRUNでクリアした★まで（そのRUNで自分がクリアした★も選べる）
// 名人(★4)・伝説(★5)は隠れ難易度: そのRUNの★3をクリアすると名人、名人をクリアすると伝説が出る（九九ポーカーと同じ）
function starOpen(i, k) {
    const own = bestStar(RUNS[i].id), prev = i > 0 ? bestStar(RUNS[i - 1].id) : 0;
    if (k === 4 && own >= 3) return true;
    if (k === 5 && own >= 4) return true;
    if (i === 0) return k <= 3;
    return k <= prev || k <= own;
}
function starVisible(i, k) { return k <= 3 || starOpen(i, k); }

    setTimeout(() => { gachaLast = { id: k.id, lv }; renderGacha(); SFX.play(lv > 1 ? 'levelup' : 'unlock'); }, 520);
}

function escapeHtml(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ==================== ランキング ====================
// ワールド: Supabase の rankings テーブル(ほかのゲームと共有、game列で分ける)。localhost・file・チュートリアル中は送らない
const RANK_GAME = 'bunsuu_lab', RANK_HAND = 'bunsuu_lab_hand';
const SB_BASE = 'https://rpxassndgiunoqkxqcco.supabase.co/rest/v1', SB_KEY = 'sb_publishable_Wnge6OPvSf5l2YEgaPg4rw_nj4CyYAH';
const SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
const CLEAR_TAGS = ['クリア', 'Clear'];
function isClearTag(t) { return CLEAR_TAGS.indexOf(t) >= 0; }
function rankKey(rid, star) { return `${rid}_${star}`; }
function localGet(pfx, k) { try { return JSON.parse(localStorage.getItem(pfx + k) || '[]'); } catch (e) { return []; } }
function localPut(pfx, k, a) { try { localStorage.setItem(pfx + k, JSON.stringify(a.slice(0, 30))); } catch (e) {} }
// クリアした記録が先、つぎにスコアの高い順
function compareRank(a, b) { const ca = isClearTag(a.tag) ? 1 : 0, cb = isClearTag(b.tag) ? 1 : 0; return cb - ca || b.score - a.score || (b.turns || 0) - (a.turns || 0); }
window.saveOnlineScore = async (name, score, stage, diff, tag) => {
    if ((score || 0) <= 0) return;
    const res = await fetch(`${SB_BASE}/rankings`, { method: 'POST', headers: SB_HDR, keepalive: true, body: JSON.stringify({ game: RANK_GAME, difficulty: diff, player_name: FGLName.display(name || 'ななしさん'), point_score: score, stage_score: stage, turns: stage, class_name: tag || '' }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
};
window.saveOnlineHand = async (name, score, yaku, stage, diff) => {
    if ((score || 0) <= 0) return;
    const res = await fetch(`${SB_BASE}/rankings`, { method: 'POST', headers: SB_HDR, keepalive: true, body: JSON.stringify({ game: RANK_HAND, difficulty: diff, player_name: FGLName.display(name || 'ななしさん'), point_score: score, stage_score: stage, turns: stage, class_name: yaku || '' }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
};
async function loadWorld(rid, star, kind) {
    try {
        const diff = star ? { difficulty: `eq.${rid}_${star}` } : { difficulty: `like.${rid}_*` };
        const rows = async (game, extra) => {
            const q = new URLSearchParams({ select: 'player_name,class_name,point_score,turns,created_at,difficulty', game: `eq.${game}`, point_score: 'gt.0', order: 'point_score.desc,created_at.desc', limit: '30', ...diff, ...extra });
            const r = await fetch(`${SB_BASE}/rankings?${q}`, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        };
        let data;
        if (kind === 'hand') data = await rows(RANK_HAND, {});
        else { const tl = CLEAR_TAGS.map(t => `"${t}"`).join(','); data = (await rows(RANK_GAME, { class_name: `in.(${tl})` })).concat(await rows(RANK_GAME, { or: `(class_name.is.null,class_name.not.in.(${tl}))` })); }
        return data.map(r => ({ name: FGLName.display(r.player_name), tag: r.class_name, score: r.point_score, turns: r.turns, star: parseInt(String(r.difficulty || '').split('_').pop(), 10) || 0, date: r.created_at ? new Date(r.created_at).toLocaleDateString('ja-JP') : '' }));
    } catch (e) { console.error('ranking', e); return null; }
}
function recordRun(clear, total) {
    const tag = clear ? 'クリア' : 'ゲームオーバー', key = rankKey(run.rid, run.star), now = new Date();
    const date = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
    if (total > 0) { const a = localGet('bunsuuLabRank_', key); a.push({ name: curName(), score: total, turns: run.stage, tag, date }); a.sort(compareRank); localPut('bunsuuLabRank_', key, a); }
    if (run.bestPlay > 0) { const a = localGet('bunsuuLabHand_', key); a.push({ name: curName(), score: run.bestPlay, turns: run.stage, tag: run.bestYaku || '', date }); a.sort((x, y) => y.score - x.score); localPut('bunsuuLabHand_', key, a); }
    lastEnd = { rid: run.rid, star: run.star };
    const msg = $('end-msg'); msg.textContent = '';
    if (!/^https?:$/.test(location.protocol) || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
    if (total <= 0 && !run.bestPlay) return;
    msg.textContent = T('ワールドランキングに送信中…');
    Promise.all([window.saveOnlineScore(curName(), total, run.stage, key, tag), window.saveOnlineHand(curName(), run.bestPlay, run.bestYaku, run.stage, key)])
        .then(() => { msg.textContent = T('ワールドランキングに登録しました！'); })
        .catch(() => { msg.textContent = T('ワールドランキングに送れませんでした'); });
}
let lastEnd = null, rkFrom = 'title', rkRun = 'basic', rkStar = 0, rkKind = 'score', rkTab = 'world', rkSeq = 0;
function openRanking(from) {
    SFX.play('click');
    rkFrom = from || 'title';
    if (from === 'end' && lastEnd) { rkRun = lastEnd.rid; rkStar = lastEnd.star; }
    show('ranking-screen'); renderRankCtrl(); loadRank();
}
function closeRanking() { SFX.play('back'); if (rkFrom === 'end') goRun(); else goTitle(); }
function renderRankCtrl() {
    $('rk-runs').innerHTML = RUNS.map((r, i) => `<button class="b3d rk-run${r.id === rkRun ? ' on' : ''}" style="--c:${r.c}" ${runOpen(i) ? '' : 'disabled'} onclick="rkPickRun('${r.id}')">${runOpen(i) ? T(r.name) : '？？？'}</button>`).join('');
    const seg = (id, items, cur) => { $(id).innerHTML = items.map(([v, l, fn]) => `<button class="${v === cur ? 'on' : ''}" onclick="${fn}">${l}</button>`).join(''); };
    seg('rk-kind', [['score', T('合計スコア'), "rkSet('kind','score')"], ['hand', T('いちばん高い得点'), "rkSet('kind','hand')"]], rkKind);
    const ri = RUNS.findIndex(r => r.id === rkRun), stars = [1, 2, 3, 4, 5].filter(k => k <= 3 || starOpen(ri, k));
    seg('rk-star', [[0, T('すべて'), 'rkSet("star",0)']].concat(stars.map(k => [k, '★'.repeat(k), `rkSet('star',${k})`])), rkStar);
    seg('rk-tab', [['world', T('ワールド'), "rkSet('tab','world')"], ['local', T('この端末'), "rkSet('tab','local')"]], rkTab);
    const isHand = rkKind === 'hand', c = (t, cls) => `<span class="${cls || ''}">${T(t)}</span>`;
    $('rk-head').innerHTML = c('順位', 'c') + c('名前') + c('難しさ', 'c') + (isHand ? c('役', 'c') : c('結果', 'c')) + c('得点', 'r') + c('日付', 'r');
}
function rkPickRun(id) { rkRun = id; SFX.play('select'); renderRankCtrl(); loadRank(); }
function rkSet(k, v) { if (k === 'kind') rkKind = v; else if (k === 'star') rkStar = v; else rkTab = v; SFX.play('select'); renderRankCtrl(); loadRank(); }
async function loadRank() {
    const my = ++rkSeq, list = $('rk-list');
    let rows;
    if (rkTab === 'local') {
        rows = [];
        (rkStar ? [rkStar] : [1, 2, 3, 4, 5]).forEach(k => localGet(rkKind === 'hand' ? 'bunsuuLabHand_' : 'bunsuuLabRank_', rankKey(rkRun, k)).forEach(e => rows.push(Object.assign({ star: k }, e))));
    } else {
        list.innerHTML = `<li class="rk-loading">${T('読み込み中…')}</li>`;
        rows = await loadWorld(rkRun, rkStar, rkKind);
        if (my !== rkSeq) return;
        if (!rows) { list.innerHTML = `<li class="rk-empty">${T('読み込めませんでした')}</li>`; return; }
    }
    rows.sort(rkKind === 'hand' ? ((a, b) => b.score - a.score) : compareRank);
    rows = rows.slice(0, 30);
    if (!rows.length) { list.innerHTML = `<li class="rk-empty">${T('まだ記録がありません')}</li>`; return; }
    const me = curName();
    list.innerHTML = rows.map((r, i) => `<li class="rk-row${i < 3 ? ' r' + (i + 1) : ''}${r.name === me ? ' me' : ''}">
        <span class="rk-no">${i + 1}</span><span class="rk-name">${escapeHtml(FGLName.display(r.name))}</span><span class="rk-star">${'★'.repeat(r.star || 0)}</span>
        ${rkKind === 'hand' ? `<span class="rk-res" style="background:#c2501e">${YAKU_BY_ID[r.tag] ? T(YAKU_BY_ID[r.tag].name) : T('役なし')}</span>` : `<span class="rk-res${isClearTag(r.tag) ? ' clear' : ''}">${isClearTag(r.tag) ? T('クリア') : T('ステージ {0}', r.turns || 1)}</span>`}
        <span class="rk-score">${r.score}</span><span class="rk-sub">${escapeHtml(r.date || '')}</span></li>`).join('');
}

function scaleContainer() {
    const el = $('container'), vp = window.visualViewport;
    const w = vp ? vp.width : window.innerWidth, h = vp ? vp.height : window.innerHeight;
    if (w <= 0 || h <= 0) return;
    el.style.left = `${w / 2 - 640}px`; el.style.top = `${h / 2 - 360}px`;
    if (w < h && w <= 900) el.style.transform = `rotate(90deg) scale(${Math.min(h / 1280, w / 720)})`;
    else el.style.transform = `scale(${Math.min(w / 1280, h / 720)})`;
}
