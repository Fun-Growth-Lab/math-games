<script>
// ---- このゲーム(固有)の設定 ----
const RUN_LIST = [
    { id: 'normal', color: '#e0507c' },
    { id: 'locked', color: '#7d7f92', locked: true },

const FRAC = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;

    sbGame: 'math_braves_fraction',
    keys: { lang: 'mb_frac_lang', lastStar: 'mb_frac_last_star', ranking: d => `math_braves_frac_ranking_v2_${d}`, clearCount: d => `math_braves_frac_clears_v2_${d}` },
    stageCount: 10,
    stageThemes: [{ c: '#ffe27a' }, { c: '#ffb3c8' }, { c: '#ff6f8f' }, { c: '#c98a5a' }, { c: '#ff9a4a' }, { c: '#ffd24a' }, { c: '#a8e08a' }, { c: '#7ad0f0' }, { c: '#b890f0' }, { c: '#ff8ad0' }],
    // 0=ホールケーキ 1=ひときれ 2=いちご 3=カップケーキ 4=3/4のケーキ 5=おさら
    titleBots: [[2, 24, 545, 1.0, '#e8344e'], [1, 1130, 545, 1.0, '#ffb3c8']],
    // タイトルの主役: 大きな数字カードの扇(まん中の金のカードが答え)と演算のバッジ
    // タイトルの主役: 3つのケーキをそろえるスロットマシン(1/2が3つそろって当たり！)
    titleColors: 'plum',
    titleHero: () => {
        const ck = (v) => { const d = document.createElement('div'); d.innerHTML = cakeSVG(4); paintCake(d.firstElementChild, v, 4); return d.innerHTML; };
        let h = FH.glow(300, 160, 720, 'rgba(255,120,170,0.4)');
        h += '<div class="hv" style="left:250px;top:204px;width:780px;height:292px;box-sizing:border-box;border-radius:34px;border:10px solid #ffd24a;background:linear-gradient(180deg,#7a1a46,#4a0d2a);box-shadow:0 9px 0 #a35c00, 0 0 0 5px #fff3b0, 0 0 40px 10px rgba(255,210,74,.55), 0 20px 30px rgba(0,0,0,.45)"></div>';
        for (let i = 0; i < 16; i++) h += '<div class="hv" style="left:' + (292 + i * 46) + 'px;top:216px;width:14px;height:14px;border-radius:50%;background:' + (i % 2 ? '#fff3b0' : '#ff8ab0') + ';box-shadow:0 0 12px 3px rgba(255,230,140,.9)"></div>';
        [300, 540, 780].forEach((x, i) => {
            h += '<div class="hv" style="left:' + x + 'px;top:250px;width:200px;height:200px;box-sizing:border-box;border-radius:24px;background:linear-gradient(#fffaf3,#f1dfc6);border:6px solid #ffe58a;box-shadow:inset 0 0 18px rgba(120,60,20,.35), 0 0 22px 5px rgba(255,226,122,.8)"></div>';
            h += '<div class="hv" style="left:' + (x + 6) + 'px;top:256px;width:188px;height:188px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))">' + ck(12) + '</div>';
            h += '<div class="hv" style="left:' + (x + 50) + 'px;top:446px;width:100px;height:44px;border-radius:14px;background:#fff;border:3px solid #ffb3d1;box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#8a2a52">1/2</div>';
        });
        h += FH.burst('当たり!', 60, 290, 190, { fs: 36, bc: 'linear-gradient(135deg,#fff7c4,#ffd24a 60%,#ffab1a)', sk: '#8a1a46', r: 10 });
        h += '<div class="hv" style="left:1048px;top:300px;width:16px;height:120px;border-radius:8px;background:linear-gradient(90deg,#d8d8e0,#8a8a9a);box-shadow:0 4px 0 rgba(0,0,0,.4)"></div><div class="hv" style="left:1030px;top:266px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9aa8,#d81b3c);box-shadow:0 5px 0 #7a0a20"></div>';
        return h + FH.star('✦', 130, 260, 30, 0) + FH.star('✧', 1180, 440, 26, 0.8);
    },
    runArt: { shape: 0, color: '#ffb3c8' },
    runArtNums: [FRAC(1, 4), FRAC(1, 2), FRAC(3, 4)],
    runArtLayout: [[2, 58, -12], [58, 88, 7], [160, 8, 10]],
    titleNums: [FRAC(1, 4), FRAC(1, 2), FRAC(3, 4), FRAC(1, 3), FRAC(2, 3), FRAC(1, 6), FRAC(5, 8), FRAC(1, 8)],
    // タイトルのかざり: クリームのドーム(カップケーキ屋さんの屋根)のシルエット
    titleSkyline: (seed, lo, hi, step) => {
        const pts = ['0% 100%']; let x = 0, r = seed;
        while (x < 100) {
            r = (r * 9301 + 49297) % 233280;
            const w = step * (1.5 + (r % 5) / 10), h = lo + (r / 233280) * (hi - lo) * 0.7 + (hi - lo) * 0.25;
            const wall = h * 0.6, dome = h * 0.4;
            pts.push(`${x}% ${100 - wall}%`);
            for (let k = 1; k <= 8; k++) { const t = k / 8; pts.push(`${(x + w * t).toFixed(2)}% ${(100 - wall - dome * Math.sin(Math.PI * t)).toFixed(2)}%`); }
            x += w;
        }
        pts.push('100% 100%');
        return 'polygon(' + pts.join(',') + ')';
    },

<script>
// ============================================================
// チュートリアル（練習プレイ）
// ============================================================
// 実際の画面で「カードをケーキにのせて分数をたし、3つのケーキの大きさをそろえる」を体験する。
// 書き込みはエンジンが止めるので、ランキング・クリア回数は一切汚れない。
function startTutorial() {
    FGLTutorial.begin({ root: '#container', getLang: () => currentLang });
    state.star = 1; state.difficulty = 'STAR1';
    CONFIG = Object.assign({}, PRESET_EASY);
    STAGE_COUNT = CONFIG.maxRound;
    initGame();
    state.tutorial = true;
    startStage(1);
    // 手順どおりに進むよう、ケーキと手札を決めた値にする(24分の値: 6=1/4, 12=1/2, 18=3/4)
    const setHand = () => {
        state.cards = [[6, 2], [12, 1], [18, 3]].map(([v, s], i) => { const c = makeCard(i, 3); c.val = v; c.stars = s; return c; });
    };
    state.cakes = [6, 12, 12];
    state.targetValue = 12; state.targetBase = 200; state.targetKey = 'target_chance'; state.targetColor = '#ffffff';
    setHand(); updateUI();
    const CV = '#gameCanvas';
    const cv = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [720, 720], pad: 6 });
    // 手順どおりの操作だけ許すための、ぴったりの範囲(余白なし)
    const rect0 = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [720, 720], pad: 0 });
    const tableR = () => cv(12, 76, 696, 366);
    const handR = () => cv(HAND_L - 6, HAND_Y - 14, HAND_AREA + 12, HAND_H + 28);
    const chgR = () => cv(CHG.x, CHG.y, CHG.w, CHG.h);
    const chgP = () => rect0(CHG.x, CHG.y, CHG.w, CHG.h);
    const statsR = () => cv(180, 450, 360, 56);
    const card0P = () => rect0(handX(0, 3), HAND_Y, HAND_W, HAND_H);
    const cake0P = () => rect0(cakeX(0), CAKE_Y, CAKE, CAKE + 90);
    const clearShown = () => !document.getElementById('stage-clear').classList.contains('hidden');
    let ap0 = 0;
    FGLTutorial.run([
        { type: 'say', target: tableR, pos: 'bottom', text: {
            ja: '3つのケーキがあるよ。それぞれ大きさがちがうね（1/4、1/2 など）。この3つを「ぜんぶ同じ大きさ」にするのが目的だよ！',
            easy: '3つのケーキがあるよ。それぞれおおきさがちがうね（1/4、1/2 など）。この3つを「ぜんぶおなじおおきさ」にするのがもくてきだよ！',
            en: 'There are three cakes of different sizes (1/4, 1/2 …). Your goal is to make all three the SAME size!' } },
        { type: 'say', target: handR, pos: 'top', text: {
            ja: 'これが手札の分数カード。カードをケーキにドラッグしてのせると、その分数がケーキに足されるよ。',
            easy: 'これがてふだのぶんすうカード。カードをケーキにドラッグしてのせると、そのぶんすうがケーキにたされるよ。',
            en: 'These are your fraction cards. Drag a card onto a cake to add that fraction to it.' } },
        { type: 'do', target: chgR, pos: 'top', before: () => { ap0 = state.ap; }, until: () => state.ap < ap0,
          only: { from: chgP, hint: { ja: '「チェンジ」ボタンを押してみよう！', easy: '「チェンジ」ボタンをおしてみよう！', en: 'Press the "Change" button!' } }, text: {
            ja: '手札が合わないときは、「チェンジ」ボタンでカードを引き直せるよ（APが1へる）。押してみよう！',
            easy: 'てふだがあわないときは、「チェンジ」ボタンでカードをひきなおせるよ（APが1へる）。おしてみよう！',
            en: "If your cards don't fit, the 'Change' button redraws them (costs 1 AP). Press it!" } },
        { type: 'run', fn: () => { setHand(); updateUI(); } },
        { type: 'do', target: () => cv(12, 76, 696, 640), pos: 'top', until: () => state.cakes[0] === 12,
          only: { from: card0P, to: cake0P, hint: {
            ja: '手札の「1/4」のカードを、左のいちばん小さいケーキ（1/4）にドラッグしてのせてみよう！',
            easy: 'てふだの「1/4」のカードを、ひだりのいちばんちいさいケーキ（1/4）にドラッグしてのせてみよう！',
            en: 'Drag the "1/4" card onto the smallest cake on the left!' } }, text: {
            ja: '左のいちばん小さいケーキ（1/4）に、手札の「1/4」のカードをのせてみよう！ 1/4 + 1/4 = 1/2 で、3つとも同じ大きさになるよ。',
            easy: 'ひだりのいちばんちいさいケーキ（1/4）に、てふだの「1/4」のカードをのせてみよう！ 1/4 + 1/4 = 1/2 で、3つともおなじおおきさになるよ。',
            en: 'Drop the "1/4" card onto the smallest cake on the left! 1/4 + 1/4 = 1/2, so all three become the same size.' } },
        { type: 'run', fn: () => FGLTutorial.wait(clearShown, 8000) },
        { type: 'run', fn: () => new Promise(r => setTimeout(r, 700)) },
        { type: 'say', target: '#stage-clear', pos: 'top',
          after: () => document.getElementById('stage-clear').classList.add('hidden'), text: {
            ja: '3つのケーキがそろったよ、ラウンドクリア！ ターゲットの大きさにそろえると高得点。連続でそろえるとコンボで倍率もアップ！',
            easy: '3つのケーキがそろったよ、ラウンドクリア！ ターゲットのおおきさにそろえるとこうとくてん。れんぞくでそろえるとコンボでばいりつもアップ！',
            en: 'All three cakes match — round clear! Matching the target size scores more, and chaining rounds raises your combo multiplier!' } },
        { type: 'say', target: '#card-ap', pos: 'right', text: {
            ja: 'カードを使うたびに「AP」が1へるよ。0になるとゲームオーバー！ ラウンドをクリアするとAPが回復するよ。',
            easy: 'カードをつかうたびに「AP」が1へるよ。0になるとゲームオーバー！ ラウンドをクリアするとAPがかいふくするよ。',
            en: 'Each card you use costs 1 AP. At 0 it\'s game over! Clearing a round restores some AP.' } },
        { type: 'say', target: '#card-target', pos: 'left', text: {
            ja: 'ここは「ターゲット」。この大きさにそろえると、高い点数がもらえるよ（チャンス・ビッグチャンスなど）。',
            easy: 'ここは「ターゲット」。このおおきさにそろえると、たかいてんすうがもらえるよ（チャンス・ビッグチャンスなど）。',
            en: 'This is the target. Matching this size earns more points (Chance, Big Chance …).' } },
        { type: 'say', target: statsR, pos: 'top', text: {
            ja: '⭐がついたカードを使うと、クリア時の点数がふえるよ（1こ +10点）。「コンボ」は、ケーキをちょうど「1」にできた回数！',
            easy: '⭐がついたカードをつかうと、クリアのときのてんすうがふえるよ（1こ +10てん）。「コンボ」は、ケーキをちょうど「1」にできたかいすう！',
            en: 'Cards with ⭐ add bonus points on clear (+10 each). "Combo" counts how many times you made a cake exactly "1"!' } },
        { type: 'say', target: handR, pos: 'top', text: {
            ja: '「1」をこえたときは、あまりの分だけが残るよ（例：3/4 + 1/2 = 5/4 → 1/4）。手札が合わないときは「チェンジ」で引き直せる（AP -1）。',
            easy: '「1」をこえたときは、あまりのぶんだけがのこるよ（れい：3/4 + 1/2 = 5/4 → 1/4）。てふだがあわないときは「チェンジ」でひきなおせる（AP -1）。',
            en: 'If a cake goes over "1", only the extra part stays (e.g. 3/4 + 1/2 = 5/4 → 1/4). If your hand doesn\'t fit, use "Change" to redraw (−1 AP).' } }
    ]);
}
</script>
