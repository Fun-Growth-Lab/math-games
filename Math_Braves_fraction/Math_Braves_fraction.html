    <style>
        /* ストロベリーピンク×クリーム。--h は共通CSSの色相(たしざん=220, ひきざん=352, かけざん=150/172, わりざん=268, しょうすう=192) */
        :root { --h: 330; --led: #ffb3d1; --led-soft: rgba(255,179,209,0.45); }

        /* ---- 分数(たてに書く) ---- */
        .fr { display:inline-flex; flex-direction:column; align-items:center; line-height:1; }
        .fr i { display:block; font-style:normal; min-width:1.05em; text-align:center; }
        .fr i:first-child { border-bottom:.09em solid currentColor; padding-bottom:.07em; margin-bottom:.07em; }
        .pc .fr { font-size:.62em; }

        /* ---- 盤面 ---- */
        .fc-eq { position:absolute; left:20px; top:98px; width:680px; height:46px; box-sizing:border-box; border-radius:23px; display:flex; align-items:center; justify-content:center;
            background:#fff; border:4px solid #e58aa8; box-shadow:0 4px 0 #d98aa6; }
        .fc-eq span { font-size:1.7rem; font-weight:900; color:#8a2a52; letter-spacing:1px; white-space:nowrap; }
        .fc-eq.ph span { font-size:1.05rem; color:#b07a90; letter-spacing:0; }
        .fc-table { position:absolute; left:12px; top:152px; width:696px; height:322px; box-sizing:border-box; border-radius:28px; border:5px solid #e58aa8;
            background:conic-gradient(rgba(255,255,255,.85) 25%, rgba(255,205,222,.85) 0 50%, rgba(255,255,255,.85) 0 75%, rgba(255,205,222,.85) 0) 0 0 / 46px 46px, #ffe6ee;
            box-shadow:inset 0 0 24px rgba(200,70,110,.22), 0 6px 0 #d98aa6; }
        .fc-cake { position:absolute; transition:transform .15s; filter:drop-shadow(0 8px 5px rgba(150,40,80,.35)); }
        .fc-cake.over { transform:scale(1.07); }
        .fc-cake.matched { animation: fcMatch .6s ease-in-out infinite; }
        @keyframes fcMatch { 0%,100% { filter:drop-shadow(0 0 6px #ffe27a) drop-shadow(0 10px 6px rgba(40,0,20,.45)); transform:scale(1); } 50% { filter:drop-shadow(0 0 22px #ffd24a) drop-shadow(0 10px 6px rgba(40,0,20,.45)); transform:scale(1.07); } }
        .ck { width:100%; height:100%; display:block; --ck:#fff08a; }
        .ck .pl { fill:#fff; stroke:#e4d3c6; stroke-width:3; }
        .ck .bd { fill:#f7ede0; }
        .ck .sl path { transition: fill .3s; }
        .ck .sl .tp { fill:transparent; } .ck .sl .rm { fill:transparent; }
        .ck .sl.on .tp { fill:var(--ck); } .ck .sl.on .rm { fill:#d98aa6; }
        .ck .gl { stroke:#b5835a; stroke-width:1.6; opacity:.5; stroke-linecap:round; }
        .ck .sb { opacity:0; transform-box:fill-box; transform-origin:center; transform:scale(.2); transition:opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1); }
        .ck .sb.on { opacity:1; transform:scale(1); }
        .ck .ct { fill:#fff; stroke:#e0c8b0; stroke-width:2; opacity:.9; }
        .ck.whole .ct { fill:#ffd24a; stroke:#d99a10; }
        .fc-lab { position:absolute; width:108px; text-align:center; transition:transform .15s; }
        .fc-lab .pill { display:inline-flex; align-items:center; justify-content:center; min-width:92px; height:80px; padding:0 14px; box-sizing:border-box; border-radius:22px; background:#fff; border:4px solid #e58aa8; box-shadow:0 5px 0 #d98aa6;
            font-size:2.4rem; font-weight:900; color:#8a2a52; }
        .fc-lab.over { transform:scale(1.1); } .fc-lab.over .pill { border-color:#f0a000; }
        .fc-hbox { position:absolute; box-sizing:border-box; border-radius:22px; background:rgba(255,255,255,.7); border:3px solid #e58aa8; }

        /* ---- 手札 ---- */
        .fc-hc .nm { top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:2.7rem; color:#8a2a52; }
        .fc-hc.t1 { border-color:#a8d88a; } .fc-hc.t2 { border-color:#ffd24a; } .fc-hc.t3 { border-color:#ffb86b; } .fc-hc.t4 { border-color:#ff8fb0; }
        .fc-pt { position:absolute; z-index:30; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; pointer-events:none; animation: fcPt .9s ease-out forwards; }
        @keyframes fcPt { 0% { transform:translate(0,0) scale(1); opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }
        .fc-cf { position:absolute; z-index:40; width:12px; height:18px; border-radius:3px; pointer-events:none; animation: fcCf 2s ease-in forwards; }
        @keyframes fcCf { 0% { transform:translate(0,0) rotate(0); opacity:1; } 100% { transform:translate(var(--dx),740px) rotate(720deg); opacity:.9; } }

<script src="fraction-config.js?v=20261310"></script>
<script>
// ---- このゲーム(固有)の設定 ----
// RUN = ケーキの分割数(3〜10)。DIVISIONS(fraction-config.js)と同じ順番
const RUN_COLORS = ['#e0507c', '#e8704a', '#d9962a', '#6fb83a', '#2fb59a', '#3a8fe0', '#8a6ae8', '#d05ac8'];
const RUN_LIST = DIVISIONS.map((n, i) => ({ id: 'd' + n, color: RUN_COLORS[i], div: n }));
const FRAC = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const GAME = {
    sbGame: 'math_braves_fraction',
    keys: { lang: 'mb_frac_lang', lastStar: 'mb_frac_last_star', ranking: d => `math_braves_frac_ranking_v3_${d}`, clearCount: d => `math_braves_frac_clears_v3_${d}` },
    stageCount: 7,
    stageThemes: [{ c: '#ffe27a' }, { c: '#ffb3c8' }, { c: '#ff6f8f' }, { c: '#c98a5a' }, { c: '#ffd24a' }, { c: '#a8e08a' }, { c: '#ff8ad0' }],
    starMax: 3,                                            // ★1〜★3(シークレット★4・★5は いまは出さない。仕組みは GAME.starMax=5 で復活)
    starKey: (n, ri) => 'D' + DIVISIONS[ri] + '_STAR' + n,   // ランキング・クリアは RUN(分割数)×難易度ごとに分ける
    // 0=ホールケーキ 1=ひときれ 2=いちご 3=カップケーキ 4=3/4のケーキ 5=おさら
    titleBots: [],
    // タイトルの主役: 大きな数字カードの扇(まん中の金のカードが答え)と演算のバッジ
    // タイトルの主役: 3つのケーキをそろえるスロットマシン(1/2が3つそろって当たり！)
    titleColors: 'ruby',
    titleHero: () => {
        const ck = (v) => { const d = document.createElement('div'); d.innerHTML = cakeSVG(4); paintCake(d.firstElementChild, v, 4); return d.innerHTML; };
        // スロットマシン: 左のはんぶん(x=48〜708)に置く。右は ボタンの列
        let h = FH.glow(20, 270, 720, 'rgba(255,120,170,0.35)');
        h += '<div class="hv" style="left:48px;top:292px;width:660px;height:320px;box-sizing:border-box;border-radius:34px;border:10px solid #ffd24a;background:linear-gradient(180deg,#7a1a46,#4a0d2a);box-shadow:0 9px 0 #a35c00, 0 0 0 5px #fff3b0, 0 0 36px 8px rgba(255,210,74,.5), 0 20px 30px rgba(120,20,60,.4)"></div>';
        for (let i = 0; i < 14; i++) h += '<div class="hv" style="left:' + (74 + i * 44) + 'px;top:306px;width:14px;height:14px;border-radius:50%;background:' + (i % 2 ? '#fff3b0' : '#ff8ab0') + ';box-shadow:0 0 10px 3px rgba(255,230,140,.9)"></div>';
        [70, 280, 490].forEach((x) => {
            h += '<div class="hv" style="left:' + x + 'px;top:338px;width:190px;height:190px;box-sizing:border-box;border-radius:22px;background:linear-gradient(#fffaf3,#f1dfc6);border:6px solid #ffe58a;box-shadow:inset 0 0 18px rgba(120,60,20,.35), 0 0 20px 4px rgba(255,226,122,.75)"></div>';
            h += '<div class="hv" style="left:' + (x + 6) + 'px;top:344px;width:178px;height:178px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))">' + ck(2) + '</div>';
            h += '<div class="hv" style="left:' + (x + 45) + 'px;top:538px;width:100px;height:44px;border-radius:14px;background:#fff;border:3px solid #ffb3d1;box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#8a2a52">1/2</div>';
        });
        // レバー
        h += '<div class="hv" style="left:722px;top:372px;width:14px;height:110px;border-radius:8px;background:linear-gradient(90deg,#d8d8e0,#8a8a9a);box-shadow:0 4px 0 rgba(0,0,0,.4)"></div><div class="hv" style="left:707px;top:336px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9aa8,#d81b3c);box-shadow:0 5px 0 #7a0a20"></div>';
        return h + FH.star('✦', 20, 300, 30, 0) + FH.star('✧', 740, 590, 26, 0.8);
    },
    runArt: { shape: 0, color: '#ffb3c8' },
    // RUNカード(ランキングの小さなカードも)の絵: n分割のケーキと「1/n」のカード
    runArtFor: (id) => {
        const r = RUN_LIST.find(x => x.id === id);
        if (!r) return null;
        const n = r.div, ST = 360 / n;
        let w = '';
        for (let i = 0; i < n; i++) w += '<path d="' + wedgePath(90, -90 + i * ST, -90 + (i + 1) * ST) + '" fill="' + (i % 2 ? '#ffc6d8' : '#fff0f5') + '" stroke="#e58aa8" stroke-width="2"/>';
        const cherry = (a) => { const [x, y] = pt(100, 100, 56, a); return STRAWB(x.toFixed(1), y.toFixed(1), n <= 5 ? 1.5 : 1.1); };
        const svg = '<svg viewBox="0 0 200 200" style="position:absolute;left:58px;top:2px;width:148px;height:148px;filter:drop-shadow(0 6px 3px rgba(150,40,80,.35))"><circle cx="100" cy="100" r="98" fill="#fff" stroke="#e4d3c6" stroke-width="3"/>' + w + cherry(-90 + ST / 2) + cherry(-90 + ST * 1.5) + '</svg>';
        const card = (txt, l, t, rot, gold) => '<div class="pc" style="left:' + l + 'px;top:' + t + 'px;transform:rotate(' + rot + 'deg);width:56px;height:70px;background:' + (gold ? 'linear-gradient(160deg,#fff4b0,#ffc93d 55%,#e8a317);color:#7a2a00;border-color:#b57a00' : 'linear-gradient(#fff,#ffe6ee);color:#8a2a52;border-color:#e58aa8') + '">' + FRAC(1, n) + '</div>';
        return '<div class="rs-art"><div class="rsa-floor"></div>' + svg + card('', 6, 66, -12, false) + card('', 168, 8, 10, true) + '</div>';
    },
    titleNums: [FRAC(1, 4), FRAC(1, 2), FRAC(3, 4), FRAC(1, 3), FRAC(2, 3), FRAC(1, 6), FRAC(5, 8), FRAC(1, 8)],
    // タイトルのかざり: クリームのドーム(カップケーキ屋さんの屋根)のシルエット
    titleSkyline: (seed, lo, hi, step) => {
        const pts = ['0% 100%']; let x = 0, r = seed;
        while (x < 100) {
            r = (r * 9301 + 49297) % 233280;
            const w = step * (1.5 + (r % 5) / 10), h = lo + (r / 233280) * (hi - lo) * 0.7 + (hi - lo) * 0.25;
            const wall = h * 0.6, dome = h * 0.4;
            pts.push(`${x}% ${100 - wall}%`);
            for (let k = 1; k <= 8; k++) { const t = k / 8; pts.push(`${(x + w * t).toFixed(2)}% ${(100 - wall - dome * Math.sin(Math.PI * t)).toFixed(2)}%`); }
            x += w;
        }
        pts.push('100% 100%');
        return 'polygon(' + pts.join(',') + ')';
    },
    // ステージクリアの画面: きそてん・コンボばいりつ・AP回復
    clearRows: (st, stageScore) => `<div><span>${T('fc_cakepts')}</span><b>${state.roundCakePts}</b></div>`
        + (state.roundHits ? `<div><span>${T('fc_target_bonus')} ×${state.roundHits}</span><b>+${state.roundTargetPts}</b></div>` : '')
        + (state.roundShape ? `<div><span>${T('fc_shape')}</span><b>×1.1</b></div>` : '')
        + `<div><span>${T('fc_heal')}</span><b>+${state.roundHeal}</b></div>`
        + `<div><span>${T('fc_coin')}</span><b>+${state.roundCoins}</b></div>`,
    endBreakdown: () => `${T('fc_end_score')} ${state.endBase} ＋ ${T('fc_end_ap')} ${state.apBonus}` + (state.favMul > 1 ? ` ×${state.favMul.toFixed(2)}` : ''),
    // タイトル: このゲーム専用の作り(いちごピンクのギンガム+ひさし、左にスロット、右に大きさのちがうボタン)
    titleHTML: `
        <div class="ft-bg">
            <div class="ts-city far" id="ts-city1"></div><div class="ts-city" id="ts-city2"></div>
            <div id="ts-bots"></div><div class="ts-cards" id="ts-cards"></div>
        </div>
        <div class="ts-floaters" id="ts-floaters"></div>
        <div class="ft-awning"></div>
        <div class="ft-logo"><span class="l1" id="ts-l1"></span><span class="l2" id="ts-l2"></span></div>
        <div class="ts-hero" id="ts-hero"></div>
        <div class="hv-layer" id="ts-hero2"></div>
        <div class="ft-menu">
            <button id="btn-start-menu" class="ft-start"><span class="bd"><i class="ico" data-ico="cake"></i></span><span data-i18n="btn_start">はじめる</span></button>
            <button id="btn-tutorial" class="ft-wide ft-tut"><span class="bd"><i class="ico" data-ico="help"></i></span><span data-i18n="tm_tutorial">チュートリアル</span></button>
            <button id="btn-view-ranking" class="ft-wide ft-rank"><span class="bd"><i class="ico" data-ico="trophy"></i></span><span data-i18n="tm_ranking">ランキング</span></button>
            <div class="ft-small">
                <button id="btn-open-settings" class="ft-chip set"><i class="ico" data-ico="gear"></i><span data-i18n="tm_settings">設定</span></button>
                <button id="player-select-btn" class="ft-chip me" title="プレーヤーをへんこうする"><i class="ico" data-ico="user"></i><span id="current-player-name-display">ななしさん</span></button>
                <button id="btn-index" class="ft-chip idx"><i class="ico" data-ico="home"></i><span data-i18n="tm_index">INDEXへ</span></button>
            </div>
            <button id="btn-login" class="btn btn-auth title-menu-btn" style="display:none;">Googleでログイン</button>
            <button id="btn-logout" class="btn btn-danger title-menu-btn hidden" style="display:none;">ログアウト</button>
            <div id="auth-status" style="display:none;"></div>
        </div>`,
    // 設定 / 名前の登録: 白っぽいフェルト+看板(fgl-felt.css の fx-light)
    settingsHTML: `
        <div class="fx-screen fx-light" style="--fx-main:#e9e7ec">
            <div class="fx-top">
                <button id="btn-close-settings" class="fx-btn" data-i18n="btn_close">とじる</button>
                <div class="fx-plaque" data-i18n="settings_title">⚙ 設定</div>
            </div>
            <div class="fx-board" style="width:860px">
                <div class="fx-label" data-i18n="settings_sub">言語 / Language</div>
                <div class="fx-row">
                    <button id="lang-btn-simple" class="fx-card lang-btn" onclick="selectLanguage('simple')" data-i18n="lang_simple">かんたんなにほんご</button>
                    <button id="lang-btn-ja" class="fx-card lang-btn" onclick="selectLanguage('ja')" data-i18n="lang_ja">日本語</button>
                    <button id="lang-btn-en" class="fx-card lang-btn" onclick="selectLanguage('en')" data-i18n="lang_en">English</button>
                </div>
            </div>
        </div>`,
    playerManagerHTML: `
        <div class="fx-screen fx-light" style="--fx-main:#e9e7ec">
            <div class="fx-top">
                <button id="btn-close-player-manager" class="fx-btn" data-i18n="btn_close">とじる</button>
                <div class="fx-plaque" data-i18n="pm_title">プレーヤーをえらぶ</div>
            </div>
            <div class="fx-board" style="width:860px">
                <div class="fx-note" data-i18n-html="pm_hint"><b>ひらがな</b>　でにゅうりょくしてね<br>みんなが見るなまえです<br>ていねいなことばをつかってね</div>
                <div class="pm-form">
                    <input type="text" id="input-new-player" class="fx-input" placeholder="なまえ (12もじまで)" maxlength="12" data-i18n-placeholder="pm_placeholder">
                    <button id="btn-add-player" class="fx-btn orange" data-i18n="btn_add">ついか</button>
                </div>
                <ul id="player-list-ul" class="player-list"></ul>
            </div>
        </div>`,
    // ゲーム画面(左右パネル+盤面)
    gameLayerHTML: `
    <div id="game-layer">
        <div id="left-panel">
            <div class="sp-brand"><i class="ico" data-ico="cake"></i><span data-i18n="subject_badge">ぶんすう</span><i class="ico" data-ico="cake"></i></div>
            <div class="sp-mode"><span class="rn" id="sp-run"></span><span class="df" id="sp-diff"></span></div>
            <div class="sp-card sp-player">

            </div>
            <div class="sp-card">
                <div class="sp-lb"><i class="ico" data-ico="flag"></i><span data-i18n="label_stage" data-noemo>ステージ</span><b class="rt-num" id="disp-difficulty-label"></b></div>
                <div class="rt-list" id="sp-route"></div>

            <div class="sp-spacer"></div>
            <button id="btn-howto" class="sp-btn"><i class="ico" data-ico="book"></i><span data-i18n="btn_howto" data-noemo>あそびかた</span></button>
            <button id="btn-to-title" class="sp-btn red hidden title-menu-btn"><i class="ico" data-ico="home"></i><span data-i18n="btn_to_title">タイトルへ もどる</span></button>
        </div>

        <div id="game-area">

        <div id="right-panel">

                <div class="sp-card">
                    <div class="sp-lb"><i class="ico" data-ico="trophy"></i><span data-i18n="label_total_score" data-noemo>ごうけい スコア</span></div>

                <div class="fc-tarea" id="card-target">

                </div>
                <button id="btn-change" class="fc-change"><b data-i18n="fc_change">チェンジ</b><small data-i18n="fc_change_sub">(AP -1)</small></button>
            </div>

    </div>`,
    strings: {
        ja: {
            subject_badge: "ぶんすう", title_plaque: "ぶんすうスロット",
            stage_name_1: "ステージ 1", stage_name_2: "ステージ 2", stage_name_3: "ステージ 3", stage_name_4: "ステージ 4", stage_name_5: "ステージ 5", stage_name_6: "ステージ 6", stage_name_7: "ステージ 7",
            stage_word: "STAGE", rank_stage_prefix: "R", stage_log: "<b>ステージ{n}</b> {name}", final_title: "ファイナルステージ！",

<script>
// ============================================================
// チュートリアル（練習プレイ）
// ============================================================
// 実際の画面で「カードをケーキにのせて分数をたし、3つのケーキの大きさをそろえる」を体験する。
// 書き込みはエンジンが止めるので、ランキング・クリア回数は一切汚れない。
function startTutorial() {
    FGLTutorial.begin({ root: '#container', getLang: () => currentLang });
    state.star = 1; state.difficulty = 'STAR1';
    UNIT_MAX = 4;
    CONFIG = fracPreset(1, 4);
    STAGE_COUNT = CONFIG.maxRound;
    initGame();
    state.tutorial = true;
    startStage(1);
    // 手順どおりに進むよう、ケーキと手札を決めた値にする(4分割の値: 1=1/4, 2=1/2, 3=3/4)
    const setHand = () => {
        state.cards = [[1, 2], [2, 1], [3, 3]].map(([v, s], i) => { const c = makeCard(i, 3); c.val = v; return c; });
    };
    state.cakes = [1, 2, 2];
    state.targets = [2];
    setHand(); updateUI();
    const CV = '#gameCanvas';
    const cv = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [720, 720], pad: 6 });
    // 手順どおりの操作だけ許すための、ぴったりの範囲(余白なし)
    const rect0 = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [720, 720], pad: 0 });
    const tableR = () => cv(12, 152, 696, 340);
    const handR = () => cv(HAND_L - 6, HAND_Y - 14, HAND_AREA + 12, HAND_H + 28);
    const chgR = '#btn-change';
    const chgP = '#btn-change';
        const card0P = () => rect0(handX(0, 3), HAND_Y, HAND_W, HAND_H);
    const cake0P = () => rect0(cakeX(0), CAKE_Y, CAKE, CAKE + 90);
    const clearShown = () => !document.getElementById('stage-clear').classList.contains('hidden');
    let ap0 = 0;
    FGLTutorial.run([
        { type: 'say', target: tableR, pos: 'bottom', text: {
            ja: '3つのケーキがあるよ。それぞれ大きさがちがうね（1/4、1/2 など）。この3つを「ぜんぶ同じ大きさ」にするのが目的だよ！',
            easy: '3つのケーキがあるよ。それぞれおおきさがちがうね（1/4、1/2 など）。この3つを「ぜんぶおなじおおきさ」にするのがもくてきだよ！',
            en: 'There are three cakes of different sizes (1/4, 1/2 …). Your goal is to make all three the SAME size!' } },
        { type: 'say', target: handR, pos: 'top', text: {
            ja: 'これが手札の分数カード。カードをケーキにドラッグしてのせると、その分数がケーキに足されるよ。',
            easy: 'これがてふだのぶんすうカード。カードをケーキにドラッグしてのせると、そのぶんすうがケーキにたされるよ。',
            en: 'These are your fraction cards. Drag a card onto a cake to add that fraction to it.' } },
        { type: 'do', target: chgR, pos: 'top', before: () => { ap0 = state.ap; }, until: () => state.ap < ap0,
          only: { from: chgP, hint: { ja: '「チェンジ」ボタンを押してみよう！', easy: '「チェンジ」ボタンをおしてみよう！', en: 'Press the "Change" button!' } }, text: {
            ja: '手札が合わないときは、「チェンジ」ボタンでカードを引き直せるよ（APが1へる）。押してみよう！',
            easy: 'てふだがあわないときは、「チェンジ」ボタンでカードをひきなおせるよ（APが1へる）。おしてみよう！',
            en: "If your cards don't fit, the 'Change' button redraws them (costs 1 AP). Press it!" } },
        { type: 'run', fn: () => { setHand(); updateUI(); } },
        { type: 'do', target: () => cv(12, 152, 696, 560), pos: 'top', until: () => state.cakes[0] === 2,
          only: { from: card0P, to: cake0P, hint: {
            ja: '手札の「1/4」のカードを、左のいちばん小さいケーキ（1/4）にドラッグしてのせてみよう！',
            easy: 'てふだの「1/4」のカードを、ひだりのいちばんちいさいケーキ（1/4）にドラッグしてのせてみよう！',
            en: 'Drag the "1/4" card onto the smallest cake on the left!' } }, text: {
            ja: '左のいちばん小さいケーキ（1/4）に、手札の「1/4」のカードをのせてみよう！ 1/4 + 1/4 = 1/2 で、3つとも同じ大きさになるよ。',
            easy: 'ひだりのいちばんちいさいケーキ（1/4）に、てふだの「1/4」のカードをのせてみよう！ 1/4 + 1/4 = 1/2 で、3つともおなじおおきさになるよ。',
            en: 'Drop the "1/4" card onto the smallest cake on the left! 1/4 + 1/4 = 1/2, so all three become the same size.' } },
        { type: 'run', fn: () => FGLTutorial.wait(clearShown, 8000) },
        { type: 'run', fn: () => new Promise(r => setTimeout(r, 700)) },
        { type: 'say', target: '#stage-clear', pos: 'top',
          after: () => document.getElementById('stage-clear').classList.add('hidden'), text: {
            ja: '3つのケーキがそろったよ、ステージクリア！ ターゲットの大きさにそろえると高得点。',
            easy: '3つのケーキがそろったよ、ステージクリア！ ターゲットのおおきさにそろえるとこうとくてん。',
            en: 'All three cakes match — stage clear! Matching the target size scores more,.' } },
        { type: 'say', target: '#card-ap', pos: 'bottom', text: {
            ja: 'カードを使うたびに「AP」が1へるよ。0になるとゲームオーバー！ ステージをクリアするとAPが回復するよ。',
            easy: 'カードをつかうたびに「AP」が1へるよ。0になるとゲームオーバー！ ステージをクリアするとAPがかいふくするよ。',
            en: 'Each card you use costs 1 AP. At 0 it\'s game over! Clearing a stage restores some AP.' } },
        { type: 'say', target: '#card-target', pos: 'left', text: {
            ja: 'ここは「ターゲット」。この大きさにそろえると、高い点数がもらえるよ（チャンス・ビッグチャンスなど）。',
            easy: 'ここは「ターゲット」。このおおきさにそろえると、たかいてんすうがもらえるよ（チャンス・ビッグチャンスなど）。',
            en: 'This is the target. Matching this size earns more points (Chance, Big Chance …).' } },
        { type: 'say', target: handR, pos: 'top', text: {
            ja: '「1」をこえたときは、あまりの分だけが残るよ（例：3/4 + 1/2 = 5/4 → 1/4）。手札が合わないときは「チェンジ」で引き直せる（AP -1）。',
            easy: '「1」をこえたときは、あまりのぶんだけがのこるよ（れい：3/4 + 1/2 = 5/4 → 1/4）。てふだがあわないときは「チェンジ」でひきなおせる（AP -1）。',
            en: 'If a cake goes over "1", only the extra part stays (e.g. 3/4 + 1/2 = 5/4 → 1/4). If your hand doesn\'t fit, use "Change" to redraw (−1 AP).' } }
    ]);
}
