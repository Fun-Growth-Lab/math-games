<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script>if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ステラ・アレア - Fun & Growth Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --night1:#0c1132; --night2:#201a58; --night3:#3a2c86; --ol:#0a0826;
            --ink:#241c4e; --white:#fffaf0; --dim:#bfb4f0;
            --gold:#ffc93d; --gold-dk:#d9971a; --pink:#ff6fa5; --pink-dk:#d84a82;
            --teal:#35d0c0; --teal-dk:#1d9c90; --violet:#8b6cff; --danger:#ff5d6c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: #070a1e; font-family: "M PLUS Rounded 1c", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; height: 100vh; width: 100vw; color: var(--white); }
        #container { width: 1280px; height: 720px; position: absolute; top: 0; left: 0; transform-origin: center center; overflow: hidden; border-radius: 24px; border: 3px solid #4a3fa0;
            background: radial-gradient(ellipse at 50% 0%, var(--night3) 0%, var(--night2) 45%, var(--night1) 100%); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        .screen { position: absolute; inset: 0; z-index: 100; }
        .starfield { position:absolute; inset:0; pointer-events:none; background-image:
            radial-gradient(2px 2px at 8% 12%, #fff 60%, transparent), radial-gradient(1.5px 1.5px at 22% 70%, #ffe9a8 60%, transparent),
            radial-gradient(2px 2px at 37% 30%, #fff 60%, transparent), radial-gradient(1.5px 1.5px at 51% 85%, #fff 60%, transparent),
            radial-gradient(2.5px 2.5px at 66% 18%, #ffe9a8 60%, transparent), radial-gradient(1.5px 1.5px at 79% 60%, #fff 60%, transparent),
            radial-gradient(2px 2px at 91% 38%, #fff 60%, transparent), radial-gradient(1.5px 1.5px at 14% 45%, #ffe9a8 60%, transparent),
            radial-gradient(1.5px 1.5px at 58% 50%, #fff 60%, transparent), radial-gradient(2px 2px at 88% 90%, #fff 60%, transparent);
            animation: twinkle 3.2s ease-in-out infinite alternate; }
        @keyframes twinkle { from { opacity:.55 } to { opacity:1 } }

        /* ---------- buttons ---------- */
        .btn { font-family: inherit; font-weight: 800; border: 4px solid var(--ol); border-radius: 18px; padding: 10px 24px; font-size: 1.3rem; cursor: pointer; color: var(--ink);
            background: linear-gradient(#fff,#e2dbff); box-shadow: 0 5px 0 var(--ol), 0 9px 14px rgba(0,0,0,.35); transition: transform .08s; }
        .btn:hover { transform: translateY(2px); box-shadow: 0 3px 0 var(--ol); }
        .btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ol); }
        .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--ol); }
        .btn-gold { background: linear-gradient(#ffe27a,var(--gold)); }
        .btn-pink { background: linear-gradient(#ff9cc3,var(--pink)); color:#fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
        .btn-teal { background: linear-gradient(#7ae8dc,var(--teal)); }
        .btn-violet { background: linear-gradient(#b9a6ff,var(--violet)); color:#fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
        .btn-sm { font-size: 1.05rem; padding: 6px 16px; border-radius: 14px; border-width: 3px; box-shadow: 0 4px 0 var(--ol); }
        .btn-danger { background: linear-gradient(#ff9aa5,var(--danger)); color:#fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }

        /* ---------- title ---------- */
        #title-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; background:
            radial-gradient(ellipse at 50% 38%, rgba(255,150,200,.30) 0%, rgba(0,0,0,0) 55%),
            linear-gradient(180deg, #2c2380 0%, #1a1458 55%, #0c1132 100%); }
        .t-rays { position:absolute; left:50%; top:36%; width:1900px; height:1900px; margin:-950px 0 0 -950px; border-radius:50%; pointer-events:none;
            background: repeating-conic-gradient(from 0deg, rgba(255,214,90,.26) 0 6deg, rgba(255,214,90,0) 6deg 20deg);
            -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 28%, transparent 56%); mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 28%, transparent 56%);
            animation: tspin 60s linear infinite; }
        @keyframes tspin { to { transform: rotate(360deg); } }
        .t-glow { position:absolute; left:50%; top:36%; width:1000px; height:520px; margin:-260px 0 0 -500px; pointer-events:none;
            background: radial-gradient(ellipse, rgba(255,201,61,.50), rgba(255,111,165,.22) 45%, transparent 70%); animation: tglow 2.8s ease-in-out infinite alternate; }
        @keyframes tglow { from { opacity:.65; transform:scale(.94); } to { opacity:1; transform:scale(1.06); } }
        .t-dice { position:absolute; animation: floaty 5s ease-in-out infinite; z-index:1; }
        @keyframes floaty { 0%,100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-20px) rotate(calc(var(--r) + 9deg)); } }
        .t-fs { position:absolute; bottom:-40px; width:var(--s,22px); height:var(--s,22px); opacity:0; pointer-events:none; animation: trise var(--t,10s) linear infinite; animation-delay:var(--d,0s); }
        .t-fs svg { width:100%; height:100%; display:block; filter: drop-shadow(0 0 6px rgba(255,216,74,.9)); }
        @keyframes trise { 0% { transform: translate(0,0) rotate(0deg); opacity:0; } 8% { opacity:.95; } 50% { transform: translate(var(--x,30px),-380px) rotate(180deg); } 92% { opacity:.9; } 100% { transform: translate(calc(var(--x,30px) * -1),-820px) rotate(360deg); opacity:0; } }
        .t-shoot { position:absolute; width:180px; height:4px; border-radius:4px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff 80%, #ffe9a8); opacity:0; pointer-events:none; animation: tshoot 5.5s linear infinite; animation-delay:var(--d,0s); filter: drop-shadow(0 0 6px #fff); }
        @keyframes tshoot { 0% { opacity:0; transform: translate(0,0) rotate(28deg); } 4% { opacity:1; } 14% { opacity:0; transform: translate(520px,280px) rotate(28deg); } 100% { opacity:0; transform: translate(520px,280px) rotate(28deg); } }
        .t-logo { text-align:center; position:relative; z-index:2; margin-bottom: 22px; }
        .t-sub { display:inline-block; font-size: 1.6rem; font-weight: 900; letter-spacing: 8px; color: #3a1c00; padding: 4px 38px 6px; border-radius: 999px; border: 4px solid var(--ol); background: linear-gradient(#fff0a8,#ffc93d 55%,#ff9f2e); box-shadow: 0 5px 0 var(--ol), 0 0 28px rgba(255,201,61,.65); text-shadow: 0 2px 0 rgba(255,255,255,.55); transform: rotate(-2deg); }
        .t-title { font-size: 8.4rem; font-weight: 900; letter-spacing: 8px; line-height: 1.12; margin-top:6px; }
        .t-title span { display:inline-block; animation: bob 2.4s ease-in-out infinite;
            text-shadow: 0 -4px 0 var(--ol), 0 4px 0 var(--ol), -4px 0 0 var(--ol), 4px 0 0 var(--ol), -4px -4px 0 var(--ol), 4px -4px 0 var(--ol), -4px 4px 0 var(--ol), 4px 4px 0 var(--ol),
                          0 10px 0 #05031a, 0 0 36px rgba(255,201,61,.85), 0 0 70px rgba(255,111,165,.5); }
        @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
        .t-title.ja7 { font-size: 6.6rem; letter-spacing: 3px; }
        .t-title.en { font-size: 6.2rem; letter-spacing: 4px; }
        .lang-en .t-en { display:none; }
        .t-en { font-size:1.35rem; letter-spacing:14px; color:#fff; font-weight:900; margin-top:4px; text-shadow: 0 3px 0 var(--ol), 0 0 18px rgba(255,201,61,.9); }
        .t-menu { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:14px; }
        .t-start { font-size: 2.4rem; padding: 14px 84px; position:relative; overflow:hidden; animation: tpulse 1.6s ease-in-out infinite; }
        .t-start::after { content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-20deg); animation: tshine 2.8s ease-in-out infinite; }
        @keyframes tshine { 0% { left:-60%; } 55%,100% { left:130%; } }
        @keyframes tpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
        .t-row { display:flex; gap:12px; }

        /* ---------- common ---------- */
        .rs-top { position: relative; z-index: 2; width: 100%; display: flex; align-items: center; justify-content: space-between; height: 62px; flex-shrink: 0; }
        .rs-plaque { position: absolute; left: 50%; transform: translateX(-50%); padding: 6px 40px 8px; font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; color: #fff; background: linear-gradient(#5a46c0,#3a2c86); border: 5px solid var(--ol); border-radius: 16px; box-shadow: 0 6px 0 #05031a, inset 0 0 0 3px rgba(255,255,255,0.14); text-shadow: 0 3px 0 var(--ol); white-space: nowrap; }
        .modal-backdrop { position:absolute; inset:0; background:rgba(8,6,30,.78); display:flex; align-items:center; justify-content:center; z-index:300; }
        .modal-box { background: linear-gradient(#2e2670,#1d1850); border:5px solid var(--ol); outline: 3px solid var(--gold); border-radius: 26px; padding: 24px 36px; text-align:center; min-width:420px; max-width:1120px; max-height:690px; overflow:auto; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
        .modal-msg { font-size: 1.4rem; font-weight: 800; margin-bottom: 18px; line-height: 1.6; }
        .modal-title { font-size: 2rem; font-weight: 900; color: var(--gold); margin-bottom: 12px; text-shadow: 0 3px 0 var(--ol); }
        .toast { position:absolute; left:50%; top:90px; transform: translateX(-50%); background: rgba(0,0,0,.88); border:3px solid var(--gold); border-radius: 14px; padding: 8px 22px; font-weight:900; font-size:1.2rem; z-index: 999; }
        .coin-pill { display:inline-flex; align-items:center; gap:8px; background: linear-gradient(#3b2e00,#241b00); border:4px solid var(--ol); outline:2px solid var(--gold); border-radius: 999px; padding: 2px 18px 2px 8px; font-weight:900; font-size:1.7rem; color: var(--gold); box-shadow: 0 4px 0 var(--ol); }
        .coin-pill i { width:34px; height:34px; border-radius:50%; background: radial-gradient(circle at 35% 30%, #fff3a8, var(--gold) 50%, var(--gold-dk)); border:3px solid #fff1b8; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:1.1rem; color:#8a5a00; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }

        /* ---------- dice ---------- */
        .df { position:relative; background: linear-gradient(145deg,#fffdf6,#e8e0cc); border: 3px solid #cfc3a0; border-radius: 22%; box-shadow: inset 0 -5px 0 rgba(0,0,0,.1), 0 6px 0 #a89c78, 0 10px 14px rgba(0,0,0,.4); }
        .df .pips { position:absolute; inset:14%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); }
        .df .pips i { display:block; width:78%; height:78%; margin:auto; border-radius:50%; }
        .df .pips i.on { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), var(--pc) 60%); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
        .df.one .pips i.on { width:118%; height:118%; }
        .df .dst { position:absolute; left:50%; bottom:-15px; transform:translateX(-50%); display:flex; filter: drop-shadow(0 2px 2px rgba(0,0,0,.55)); z-index:2; }
        .df .dst svg { width:var(--sz,24px); height:var(--sz,24px); margin:0 -3px; display:block; }
        .df.big { width:112px; height:112px; --sz:30px; }
        .df.sm { width:46px; height:46px; border-width:2px; border-radius:22%; --ss:.8rem; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1), 0 3px 0 #a89c78; }
        .df.sm .pips i.on { box-shadow:none; }
        .df.md { width:66px; height:66px; --sz:19px; border-width:2px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1), 0 4px 0 #a89c78, 0 6px 8px rgba(0,0,0,.35); }
        .df.xs { width:30px; height:30px; border-width:2px; border-radius:24%; --ss:.6rem; box-shadow: inset 0 -2px 0 rgba(0,0,0,.1), 0 2px 0 #a89c78; }
        .df.xs .pips i.on { box-shadow:none; }
        .df.t-onepair    { --tc:#58b0ff; background: linear-gradient(145deg,#f2f9ff,#b4d7fa); border-color:var(--tc); }
        .df.t-trio       { --tc:#62d97e; background: linear-gradient(145deg,#f1fff4,#b6ebc3); border-color:var(--tc); }
        .df.t-twopair    { --tc:#35d0c0; background: linear-gradient(145deg,#effffc,#a9ebe3); border-color:var(--tc); }
        .df.t-fullhouse  { --tc:#b08cff; background: linear-gradient(145deg,#f5f0ff,#cdbcfb); border-color:var(--tc); }
        .df.t-threepair  { --tc:#ff7ab8; background: linear-gradient(145deg,#fff1f8,#ffbbd9); border-color:var(--tc); }
        .df.t-doubletrio { --tc:#ffc93d; background: linear-gradient(145deg,#fffbe6,#ffd966); border-color:var(--tc); }
        .df.glow { border-color: var(--gold); }
        .df.glow::after { content:''; position:absolute; inset:-5px; border-radius:inherit; box-shadow: 0 0 22px 7px rgba(255,201,61,.9), inset 0 0 14px rgba(255,236,150,.8); pointer-events:none; animation: glowp 1.1s ease-in-out infinite alternate; }
        @keyframes glowp { from { opacity:.45; } to { opacity:1; } }
        .dc.glow { box-shadow: 0 5px 0 var(--ol), 0 0 0 3px var(--gold), 0 0 20px 5px rgba(255,201,61,.7); }
        .sr.glow { border-color: var(--gold); box-shadow: 0 3px 0 var(--ol), 0 0 14px 3px rgba(255,201,61,.6); }
        .df.q { background: linear-gradient(145deg,#4a3fa0,#2a2270); border-color:#7a6ad8; box-shadow: inset 0 -5px 0 rgba(0,0,0,.2), 0 6px 0 #150f45, 0 10px 14px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; font-size:4.6rem; font-weight:900; color:#cfc5ff; }
        .df.q[class*="t-"] { background: linear-gradient(145deg,#4a3fa0,#2a2270); border-color: var(--tc); }
        .df.rolling { animation: wob .12s linear infinite; }
        @keyframes wob { 0% { transform: rotate(-9deg) translateY(-6px) } 50% { transform: rotate(8deg) translateY(2px) } 100% { transform: rotate(-9deg) translateY(-6px) } }
        .df.land { animation: land .35s ease-out; }
        @keyframes land { 0% { transform: translateY(-40px) scale(1.15) } 60% { transform: translateY(4px) scale(.96) } 100% { transform: none } }

        /* 面の一覧(目の数字ごとに色分け。スキルのアイコンと同じ色) */
        .faces { display:flex; gap:4px; justify-content:center; }
        .fc { display:flex; flex-direction:column; width:var(--w); height:var(--h); border-radius:9px; overflow:hidden; border:2px solid var(--ol); box-shadow: 0 3px 0 var(--ol); background: var(--ink); flex-shrink:0; }
        .fc b { flex:1; display:flex; align-items:center; justify-content:center; background: var(--c); color: #fff; font-weight:900; font-size: var(--fs); line-height:1; text-shadow: calc(var(--o)*-1) calc(var(--o)*-1) 0 var(--ink), var(--o) calc(var(--o)*-1) 0 var(--ink), calc(var(--o)*-1) var(--o) 0 var(--ink), var(--o) var(--o) 0 var(--ink), 0 var(--o) 0 var(--ink), 0 calc(var(--o)*-1) 0 var(--ink), var(--o) 0 0 var(--ink), calc(var(--o)*-1) 0 0 var(--ink); }
        .fc i { height: var(--bh); background: var(--ink); color: var(--gold); font-style:normal; font-size: var(--bs); text-align:center; line-height: var(--bh); letter-spacing:-1px; white-space:nowrap; }
        .fc.s { box-shadow: 0 0 0 2px var(--gold), 0 0 12px 2px rgba(255,201,61,.8); }
        .fc.hit { transform: translateY(-8px) scale(1.18); z-index:2; box-shadow: 0 0 0 3px #fff, 0 0 18px 6px rgba(255,255,255,.85); }
        .fc.lg { --o:2px; --w:46px; --h:66px; --fs:1.9rem; --bh:21px; --bs:.8rem; }
        .fc.md { --o:1.5px; --w:25px; --h:42px; --fs:1.3rem; --bh:13px; --bs:.5rem; border-width:1.5px; border-radius:7px; box-shadow: 0 2px 0 var(--ol); }
        .fc.xl { --o:2.5px; --w:58px; --h:62px; --fs:2.3rem; --bh:20px; --bs:.85rem; }
        .faces.g3 { display:grid; grid-template-columns: repeat(3, 58px); gap:6px 6px; justify-content:center; }

        /* サイコロカード(型の色でふちどり) */
        .dc { position:relative; background: linear-gradient(#34297e,#251d62); border: 4px solid var(--rc); border-radius: 16px; padding: 6px 7px 7px; box-shadow: 0 5px 0 var(--ol), 0 0 0 2px var(--ol); }
        .dc-h { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
        .dc-t { flex:1; text-align:left; font-weight:900; font-size:1rem; color: var(--rc); text-shadow: 0 1px 0 var(--ol); white-space:nowrap; }
        .dc-st { font-weight:900; font-size:1rem; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 0 9px; border:2px solid var(--ol); }
        .dc-st.none { background: #4a4290; color:#a49cd8; }
        .dc-f { display:flex; align-items:center; justify-content:flex-end; margin-top:5px; font-weight:900; font-size:1rem; color: var(--gold); text-shadow: 0 1px 0 var(--ol); }
        .dc.lgc { padding: 10px 12px 12px; border-radius: 20px; }
        .dc.lgc .dc-t { font-size:1.35rem; } .dc.lgc .dc-st { font-size:1.25rem; padding: 0 12px; }
        .dc.lgc .faces { gap:6px; }
        .dc.pick { cursor:pointer; transition: transform .1s; }
        .dc.pick:hover { transform: translateY(-4px); }
        .dc .tag-n { position:absolute; left:-10px; top:-12px; width:30px; height:30px; border-radius:50%; background: var(--teal); color: var(--ink); border:3px solid var(--ol); font-weight:900; display:flex; align-items:center; justify-content:center; font-size:1.05rem; }
        .dc.inuse { background: linear-gradient(#1f5f6a,#173f55); }
        .sell-btn { font-family:inherit; font-weight:900; font-size:.95rem; white-space:nowrap; color:#fff; background: linear-gradient(#ff9cc3,var(--pink)); border:3px solid var(--ol); border-radius: 10px; padding: 0 12px; cursor:pointer; box-shadow: 0 3px 0 var(--ol); }
        .sell-btn:active { transform: translateY(3px); box-shadow:none; }

        /* ---------- スキルのパネル ---------- */
        .sk { position:relative; display:flex; align-items:center; gap:8px; height:72px; padding: 0 10px 0 4px; border-radius: 16px; border:3px solid var(--ol); background: linear-gradient(90deg, var(--c) 0 66px, #2d2570 66px); box-shadow: 0 3px 0 var(--ol); overflow:hidden; }
        .sk-ic { width:58px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .sk-gl { font-weight:900; font-size:1.6rem; color: var(--ink); line-height:1.0; text-align:center; }
        .sk-gl.long { font-size:.8em; white-space:nowrap; }
        .sk-gl.two { font-size:.7em; line-height:1.05; white-space:nowrap; }
        .sk-gl .cmp { width:.5em; height:.72em; vertical-align:-.08em; margin-right:1px; }
        .sk-mid { flex:1; min-width:0; }
        .sk-nm { font-weight:900; font-size:1.1rem; white-space:nowrap; text-shadow: 0 2px 0 var(--ol); }
        .lvp { display:flex; gap:2px; margin-top:3px; }
        .lvp i { width:9px; height:8px; border-radius:3px; background: #4a4290; }
        .lvp i.on { background: var(--c); box-shadow: 0 0 6px var(--c); }
        .sk-ml { font-weight:900; font-size:1.55rem; color: #fff; text-shadow: 0 2px 0 var(--ol); }
        .sk.empty { background: rgba(255,255,255,.05); border:3px dashed rgba(255,255,255,.2); box-shadow:none; justify-content:center; color: rgba(255,255,255,.25); font-weight:900; font-size:1.5rem; }
        .sk.hit { animation: hitflash 1s ease-out; }
        @keyframes hitflash { 0% { transform: scale(1.1); filter: brightness(1.8); box-shadow: 0 0 22px 6px var(--c); } 100% { transform:none; filter:none; } }
        .sk.cp { height:60px; background: linear-gradient(90deg, var(--c) 0 64px, #2d2570 64px); }
        .sk.cp .sk-ic { width:56px; } .sk.cp .sk-gl { font-size:1.3rem; } .sk.cp .sk-nm { font-size:1.05rem; } .sk.cp .sk-ml { font-size:1.4rem; }
        .sk.sel { box-shadow: 0 0 0 4px var(--gold), 0 0 22px 6px rgba(255,201,61,.7); }
        .sk .tag-n { position:absolute; left:2px; top:2px; z-index:2; width:24px; height:24px; border-radius:50%; background: var(--teal); color: var(--ink); border:3px solid var(--ol); font-weight:900; display:flex; align-items:center; justify-content:center; font-size:.85rem; }

        /* ---------- 役のパネル ---------- */
        .rl { position:relative; display:grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-items:center; column-gap:8px; row-gap:2px; height:70px; padding: 6px 12px 6px; border-radius: 14px; border:3px solid var(--ol); background: linear-gradient(90deg, var(--c) -40%, #2d2570 70%); box-shadow: 0 3px 0 var(--ol); }
        .rl-dice { display:flex; gap:4px; grid-row:2; grid-column:1 / span 2; }
        .rl-nm { grid-row:1; grid-column:1; font-weight:900; font-size:1.2rem; text-shadow: 0 2px 0 var(--ol); line-height:1.1; white-space:nowrap; }
        .rl-nm small { font-size:.85rem; color: #fff; background: rgba(0,0,0,.35); border-radius: 8px; padding: 0 7px; margin-left:6px; vertical-align:middle; }
        .rl-ml { grid-row:1; grid-column:2; font-weight:900; font-size:2rem; line-height:1.05; text-shadow: 0 3px 0 var(--ol); color:#fff; }
        .rl.hit { animation: hitflash 1s ease-out; outline: 3px solid #fff; }

<body>
<div id="container">

    <!-- ==================== TITLE ==================== -->

                <button class="btn btn-violet" onclick="openSettings()" data-i18n="btn_settings"></button>

<script>
'use strict';
// ============================================================
// CORE（ルール本体。画面に依存しない。バランス調整用シミュレーションからもここだけ取り出して使う）
// ============================================================
// <<CORE
const STAGES = 7, GAMES_PER_STAGE = 3, DICE_CAP = 10, LOADOUT = 3, SKILL_MAX_LV = 10, ROLE_MAX_LV = 7;
const GACHA_PRICE = 10, ROLE_COST_BASE = 20, ROLE_COST_STEP = 0;   // 役レベルUPは20コイン固定(1回のショップで、1つの役につき1回だけ)
const SKILL_SLOTS = 4;                // セットできるスキルは4つまで(持つのは何個でも可)
const START_COINS = 10;                // さいしょにもっているコイン(1ゲームめのコインもふくむ)
const ROLE_SALE_RATE = 0.5;            // ショップでは毎回、役レベルアップが1つ半額
const GAME_COIN = 3;                   // 1ゲームはじめるたびに もらえるコイン
const SKILL_RELOAD_COST = 3;          // スキルえらびで、3つのスキルを引きなおす(リロード)のコイン
const REROLL_COST = 5;                 // コインをはらえば、サイコロを1つ、何回でも振りなおせる
const SKILL_LV2_RATE = 0.10;           // スキルえらびで、Lv2のカードが出る確率(持っているスキルなら+2レベル)
const STAR_MULT_STEP = 0.1;           // ☆1個につき倍率+0.1
const SKILL_LV_RATE = 0.5;            // スキルLv+1ごとに、ボーナス部分(倍率-1)が+50%
const CLEAR_COIN = 15;                // ステージクリア時のコイン(ボーダーに届いても、3ゲームすべて遊んでから判定する)

// ---- 役（Lv1の倍率と、Lvが1上がるごとの増加）----
const ROLES = [
    { id: 'none',    base: 1,   step: 0 },
    { id: 'pair',    base: 1.5, step: 0.3 },
    { id: 'stairs',  base: 2.5, step: 0.5 },
    { id: 'zorome',  base: 5,   step: 1 },
    { id: 'pinzoro', base: 50,  step: 10 }
];
const ROLE_BY_ID = {}; ROLES.forEach(r => ROLE_BY_ID[r.id] = r);
function roleMult(id, lv){ const r = ROLE_BY_ID[id]; return r.base + r.step * ((lv || 1) - 1); }
function judgeRole(v){
    const s = v.slice().sort((a, b) => a - b);
    if (s[0] === 1 && s[2] === 1) return 'pinzoro';
    if (s[0] === s[2]) return 'zorome';
    if (s[1] === s[0] + 1 && s[2] === s[1] + 1) return 'stairs';
    if (s[0] === s[1] || s[1] === s[2]) return 'pair';
    return 'none';
}

// ---- スキル（発動確率pに反比例して 倍率=1+0.25/p。出た目スキルは目が小さいほど強い）----
const PRIMES = [2, 3, 5, 7, 11, 13, 17];
const SKILLS = [
    { id: 'f1', kind: 'face', n: 1, x: 0.40 }, { id: 'f2', kind: 'face', n: 2, x: 0.36 },
    { id: 'f3', kind: 'face', n: 3, x: 0.32 }, { id: 'f4', kind: 'face', n: 4, x: 0.30 },
    { id: 'f5', kind: 'face', n: 5, x: 0.28 }, { id: 'f6', kind: 'face', n: 6, x: 0.26 },
    { id: 'alleven', kind: 'all', m: 3.0,  test: (v, s) => v.every(x => x % 2 === 0) },
    { id: 'allodd',  kind: 'all', m: 3.0,  test: (v, s) => v.every(x => x % 2 === 1) },
    { id: 'le10',    kind: 'all', m: 1.5,  test: (v, s) => s <= 10 },
    { id: 'ge11',    kind: 'all', m: 1.5,  test: (v, s) => s >= 11 },
    { id: 'even',    kind: 'all', m: 1.5,  test: (v, s) => s % 2 === 0 },
    { id: 'odd',     kind: 'all', m: 1.5,  test: (v, s) => s % 2 === 1 },
    { id: 'prime',   kind: 'all', m: 1.75, test: (v, s) => PRIMES.indexOf(s) >= 0 },
    { id: 'm3',      kind: 'all', m: 1.75, test: (v, s) => s % 3 === 0 },
    { id: 'm4',      kind: 'all', m: 2.0,  test: (v, s) => s % 4 === 0 },
    { id: 'm5',      kind: 'all', m: 2.25, test: (v, s) => s % 5 === 0 },
    { id: 'm6',      kind: 'all', m: 2.5,  test: (v, s) => s % 6 === 0 }
];
const SKILL_BY_ID = {}; SKILLS.forEach(k => SKILL_BY_ID[k.id] = k);
function lvRate(lv){ return 1 + SKILL_LV_RATE * (lv - 1); }

// ---- サイコロ ----
const DICE_TYPES = [
    { id: 'normal',     w: 30, sell: 1 },
    { id: 'onepair',    w: 22, sell: 2 },
    { id: 'trio',       w: 14, sell: 3 },
    { id: 'twopair',    w: 14, sell: 3 },
    { id: 'fullhouse',  w: 8,  sell: 4 },
    { id: 'threepair',  w: 7,  sell: 5 },
    { id: 'doubletrio', w: 5,  sell: 7 }
];
const DICE_TYPE_BY_ID = {}; DICE_TYPES.forEach(t => DICE_TYPE_BY_ID[t.id] = t);
const STAR_COUNT_W = [20, 30, 20, 15, 10, 5];            // ☆1〜6個の確率(%)
const STAR_SELL_FACTOR = [1.0, 1.5, 2.2, 3, 4, 5.5];     // ☆1〜6個の売値係数
const MAX_STAR_PER_FACE = 3;

function pickW(arr, rnd){
    let t = 0; arr.forEach(a => t += (a.w !== undefined ? a.w : a));
    let r = rnd() * t;
    for (let i = 0; i < arr.length; i++){ r -= (arr[i].w !== undefined ? arr[i].w : arr[i]); if (r < 0) return i; }
    return arr.length - 1;
}
function shuffled(a, rnd){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function diceFaces(type, rnd){
    const a = shuffled([1, 2, 3, 4, 5, 6], rnd);
    switch (type){
        case 'normal':     return [1, 2, 3, 4, 5, 6];
        case 'onepair':    return [a[0], a[1], a[2], a[3], a[4], a[0]];
        case 'trio':       return [a[0], a[0], a[0], a[1], a[2], a[3]];
        case 'twopair':    return [a[0], a[0], a[1], a[1], a[2], a[3]];
        case 'fullhouse':  return [a[0], a[0], a[0], a[1], a[1], a[2]];
        case 'threepair':  return [a[0], a[0], a[1], a[1], a[2], a[2]];
        case 'doubletrio': return [a[0], a[0], a[0], a[1], a[1], a[1]];
    }
    return [1, 2, 3, 4, 5, 6];
}
let _diceSeq = 0;
function makeDie(type, faces, stars){
    // 面は小さい目の順にそろえる(同じ目なら☆が多い面を先に)
    const ord = [0, 1, 2, 3, 4, 5].sort((a, b) => faces[a] - faces[b] || stars[b] - stars[a] || a - b);
    faces = ord.map(i => faces[i]); stars = ord.map(i => stars[i]);
    const k = stars.reduce((s, x) => s + x, 0);
    return { id: ++_diceSeq, type, faces, stars, starTotal: k };
}
function startDie(){ return makeDie('normal', [1, 2, 3, 4, 5, 6], [0, 0, 0, 0, 0, 0]); }
function gachaDie(rnd){
    const type = DICE_TYPES[pickW(DICE_TYPES, rnd)].id;
    const faces = diceFaces(type, rnd);
    const k = pickW(STAR_COUNT_W, rnd) + 1;
    const stars = [0, 0, 0, 0, 0, 0];
    for (let i = 0; i < k; i++){
        let idx; do { idx = Math.floor(rnd() * 6); } while (stars[idx] >= MAX_STAR_PER_FACE);
        stars[idx]++;
    }
    return makeDie(type, faces, stars);
}
function sellValue(d){
    if (d.starTotal === 0) return 1;
    return Math.max(1, Math.round(DICE_TYPE_BY_ID[d.type].sell * STAR_SELL_FACTOR[d.starTotal - 1]));
}

// ---- 得点 ----
// v: 出た目3つ  st: その面の☆3つ  skillLv: {id:Lv}  roleLv: {id:Lv}
function calcScore(v, st, skillLv, roleLv){
    const sum = v[0] + v[1] + v[2];
    const role = judgeRole(v);
    const rm = roleMult(role, roleLv[role] || 1);
    const parts = [];
    let skillMul = 1;
    SKILLS.forEach(k => {
        const lv = skillLv[k.id]; if (!lv) return;
        const rate = lvRate(lv);
        if (k.kind === 'face'){
            const cnt = v.filter(x => x === k.n).length;
            if (cnt){ const m = Math.pow(1 + k.x * rate, cnt); parts.push({ id: k.id, mult: m, cnt }); skillMul *= m; }
        } else if (k.test(v, sum)){
            const m = 1 + (k.m - 1) * rate; parts.push({ id: k.id, mult: m }); skillMul *= m;
        }
    });
    const starCount = st[0] + st[1] + st[2];
    const starMul = 1 + STAR_MULT_STEP * starCount;
    const total = Math.round(sum * rm * skillMul * starMul);
    return { sum, role, roleMult: rm, parts, skillMul, starCount, starMul, total };
}
function rollDice(dice, rnd){
    const idx = dice.map(d => Math.floor(rnd() * 6));
    return { idx, v: dice.map((d, i) => d.faces[idx[i]]), st: dice.map((d, i) => d.stars[idx[i]]) };
}
// 3つのサイコロの期待得点(216通りを全部数える。calcScoreと同じ式を軽くしたもの)
function expectedScore(dice, skillLv, roleLv){
    const act = SKILLS.filter(k => skillLv[k.id]).map(k => ({ k, r: lvRate(skillLv[k.id]) }));
    const rm = {}; ROLES.forEach(r => rm[r.id] = roleMult(r.id, roleLv[r.id] || 1));
    let t = 0;
    for (let a = 0; a < 6; a++) for (let b = 0; b < 6; b++) for (let c = 0; c < 6; c++){
        const v = [dice[0].faces[a], dice[1].faces[b], dice[2].faces[c]];
        const sum = v[0] + v[1] + v[2];
        let m = rm[judgeRole(v)] * (1 + STAR_MULT_STEP * (dice[0].stars[a] + dice[1].stars[b] + dice[2].stars[c]));
        for (let i = 0; i < act.length; i++){
            const k = act[i].k, rate = act[i].r;
            if (k.kind === 'face'){ const cnt = (v[0] === k.n) + (v[1] === k.n) + (v[2] === k.n); if (cnt) m *= Math.pow(1 + k.x * rate, cnt); }
            else if (k.test(v, sum)) m *= 1 + (k.m - 1) * rate;
        }
        t += sum * m;
    }
    return t / 216;
}

// ---- ステージ目標(3ゲーム合計)と難易度★ ----
// ★1〜3はボット(貪欲＋ミス15%。スキル4枠・毎ゲームのスキル獲得・コイン5枚でふりなおし)のシミュレーションで、通しクリア率が約80/50/19%(役レベルUP20G固定・最大Lv7・1ショップ1回の条件で再確認)(sim2.js)。★4・★5は上手い人向けの見積もり(実プレーのステージ7=9889点が目安)
const TARGETS = [
    [34, 48, 60, 72, 84, 96, 108],                 // ★1 やさしい
    [40, 66, 92, 118, 142, 164, 186],              // ★2 ふつう
    [66, 110, 152, 194, 234, 272, 312],            // ★3 むずかしい
    [110, 190, 310, 520, 880, 1470, 2500],         // ★4 名人(上手いボットの中央値と、実プレーの最高点から見積もり)
    [150, 290, 560, 1090, 2100, 4100, 8000]        // ★5 伝説(実プレーでステージ7に9889点が出た実績から見積もり)
];
function stageTarget(stage, star){ return TARGETS[(star || 1) - 1][stage - 1]; }
function clearCoins(){ return CLEAR_COIN; }
function roleUpCost(buys){ return ROLE_COST_BASE + ROLE_COST_STEP * buys; }
function roleUpPrice(buys, onSale){ const c = roleUpCost(buys); return onSale ? Math.ceil(c * ROLE_SALE_RATE) : c; }
// スキルえらびの3枚。{id, up}: upは上がるレベル(ふつう1、10%で2)
function offerSkills(rnd){ return shuffled(SKILLS.map(k => k.id), rnd).slice(0, 3).map(id => ({ id, up: rnd() < SKILL_LV2_RATE ? 2 : 1 })); }
// スキルは、1ゲームおわるたびに3択で獲得(ゲーム全体の最後の1ゲームだけは、なし)
function hasSkillPick(stage, gameNo){ return !(stage === STAGES && gameNo === GAMES_PER_STAGE); }
// ふりなおし: 1つだけ振りなおしたとき、いちばん期待値が上がるサイコロの番号と、その期待値
function rerollEval(ds, r, skillLv, roleLv){
    const cur = calcScore(r.v, r.st, skillLv, roleLv).total;
    let bi = -1, bv = cur;
    for (let i = 0; i < 3; i++){
        let t = 0;
        for (let f = 0; f < 6; f++){
            const v = r.v.slice(), st = r.st.slice(); v[i] = ds[i].faces[f]; st[i] = ds[i].stars[f];
            t += calcScore(v, st, skillLv, roleLv).total;
        }
        t /= 6;
        if (t > bv){ bv = t; bi = i; }
    }
    return { i: bi, exp: bv, cur };
}

const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#ffd84a" stroke="#0a0826" stroke-width="5.5" stroke-linejoin="round"/><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#ffd84a" stroke="#ffd84a" stroke-width="2.6" stroke-linejoin="round"/></svg>';
const PIP_POS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function dieFaceHtml(v, stars, cls, style, die){
    let p = '';
    for (let i = 0; i < 9; i++) p += `<i class="${PIP_POS[v].indexOf(i) >= 0 ? 'on' : ''}"></i>`;
    const st = stars ? `<div class="dst">${STAR_SVG.repeat(stars)}</div>` : '';
    const tc = die ? ` t-${die.type}${die.starTotal >= 4 ? ' glow' : ''}` : '';
    return `<div class="df ${cls || ''}${tc}${v === 1 ? ' one' : ''}" style="--pc:${PIP_COLOR[v]};${style || ''}"><div class="pips">${p}</div>${st}</div>`;
}
function faceCell(v, s, size, hit){
    return `<div class="fc ${size}${s ? ' s' : ''}${hit ? ' hit' : ''}" style="--c:${FACE_COLOR[v]}"><b>${v}</b><i>${s ? '★'.repeat(s) : ''}</i></div>`;
}
function facesHtml(d, size, hitIdx){
    return `<div class="faces${size === 'xl' ? ' g3' : ''}">` + d.faces.map((v, i) => faceCell(v, d.stars[i], size, i === hitIdx)).join('') + '</div>';
}
// サイコロカード。o: { size:'md'|'lg', inuse, tagN, click, sell, foot }
function dieCardHtml(d, o){
    o = o || {};
    return `<div class="dc${d.starTotal >= 4 ? ' glow' : ''}${o.size === 'lg' || o.size === 'xl' ? ' lgc' : ''}${o.inuse ? ' inuse' : ''}${o.click ? ' pick' : ''}" style="--rc:${TYPE_COLOR[d.type]}" ${o.click ? `onclick="${o.click}"` : ''}>

        <div class="dc-h"><span class="dc-t">${TYPE_NAME[d.type]}</span>${d.starTotal ? `<span class="dc-st">★${d.starTotal}</span>` : ''}</div>
        ${facesHtml(d, o.size === 'xl' ? 'xl' : (o.size === 'lg' ? 'lg' : 'md'))}
        ${o.foot === false ? '' : `<div class="dc-f"><span>🪙 ${sellValue(d)}</span>${o.sell ? `<button class="sell-btn" onclick="event.stopPropagation();${o.sell}">${tx('sell')}</button>` : ''}</div>`}
    </div>`;
}

const RANKING_ENABLED = true;
const RANK_STORAGE_PREFIX = 'stellaAleaRanking_', HAND_STORAGE_PREFIX = 'stellaAleaHand_';
const isClearTag = tag => tag === 'クリア' || tag === 'Clear';
const rankKey = (sid, star) => `${sid}_${star}`;
function getLocalRanking(sid, star){ try { return JSON.parse(localStorage.getItem(RANK_STORAGE_PREFIX + rankKey(sid, star)) || '[]'); } catch (e){ return []; } }
function getLocalHand(sid, star){ try { return JSON.parse(localStorage.getItem(HAND_STORAGE_PREFIX + rankKey(sid, star)) || '[]'); } catch (e){ return []; } }
// クリアした人を上に、そのなかでスコアの高い順
function compareRank(a, b){
    const ca = isClearTag(a.tag) ? 1 : 0, cb = isClearTag(b.tag) ? 1 : 0;
    if (ca !== cb) return cb - ca;
    if (b.score !== a.score) return b.score - a.score;
    if (b.turns !== a.turns) return b.turns - a.turns;
    return (b.dateIso || '').localeCompare(a.dateIso || '');
}
const compareHand = (a, b) => b.score - a.score || (b.dateIso || '').localeCompare(a.dateIso || '');
function saveLocal(prefix, getter, sid, star, entry, cmp){
    const list = getter(sid, star); list.push(entry); list.sort(cmp);
    try { localStorage.setItem(prefix + rankKey(sid, star), JSON.stringify(list.slice(0, 30))); } catch (e){}
}
let lastEnd = null;
function recordRun(cleared){
    const tag = tx(cleared ? 'tag_clear' : 'tag_over'), now = new Date();
    const base = { name: getCurPlayerName(), turns: run.stage, dateIso: now.toISOString(), date: `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}` };
    lastEnd = { sid: run.sid, star: run.star, score: run.sumScore || 0, hand: run.bestGame, role: run.bestRole, stage: run.stage, tag };
    if (lastEnd.score > 0) saveLocal(RANK_STORAGE_PREFIX, getLocalRanking, run.sid, run.star, Object.assign({ score: lastEnd.score, tag }, base), compareRank);
    if (lastEnd.hand > 0) saveLocal(HAND_STORAGE_PREFIX, getLocalHand, run.sid, run.star, Object.assign({ score: lastEnd.hand, tag: run.bestRole }, base), compareHand);
    if (RANKING_ENABLED && lastEnd.score > 0) submitScoreToWorld();
}
async function submitScoreToWorld(){
    const msg = $('end-world-msg'); if (!msg || !lastEnd) return;
    // ローカル確認・ファイル直開き・チュートリアル中は、世界ランキングを汚さない
    if (!/^https?:$/.test(location.protocol) || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)){ msg.textContent = tx('world_skip'); return; }
    msg.textContent = tx('world_sending');
    try {
        const key = rankKey(lastEnd.sid, lastEnd.star), nm = getCurPlayerName();
        await Promise.all([window.saveOnlineScore(nm, lastEnd.score, lastEnd.stage, key, lastEnd.tag), window.saveOnlineHand(nm, lastEnd.hand, lastEnd.role, lastEnd.stage, key)]);
        msg.textContent = tx('world_done'); msg.style.color = 'var(--teal)';
    } catch (e){ msg.textContent = tx('world_fail'); msg.style.color = 'var(--danger)'; console.error('submitScoreToWorld error:', e); }
}
function closeEndToRanking(){
    $('end-modal').classList.add('hidden');
    const e = lastEnd;
    openRanking('run-select-screen', e && e.sid, e && e.star);
}
// ---- ランキング画面 ----
let rankTab = 'world', rankSid = 'basic', rankStar = 0, rankKind = 'score', rankFrom = 'title-screen', rankSeq = 0;
function openRanking(from, sid, star){
    rankFrom = from || 'title-screen';
    if (sid){ rankSid = sid; rankStar = star || 0; }
    goTo('ranking-screen');
    renderRankScreen();
    loadAndRenderRanking();
}
function closeRanking(){ if (rankFrom === 'run-select-screen') goToRunSelect(); else goTo('title-screen'); }
function renderRankScreen(){
    const seg = (id, items, cur) => { $(id).innerHTML = items.map(([v, label, fn]) => `<button class="${v === cur ? 'on' : ''}" onclick="${fn}">${escapeHtml(label)}</button>`).join(''); };
    seg('rk-seg-kind', [['score', tx('rank_kind_score'), "switchRank('kind','score')"], ['hand', tx('rank_kind_hand'), "switchRank('kind','hand')"]], rankKind);
    seg('rk-seg-star', [[0, tx('rank_star_all'), "switchRank('star',0)"]].concat([1, 2, 3, 4, 5].map(n => [n, '★'.repeat(n), `switchRank('star',${n})`])), rankStar);
    seg('rk-seg-tab', [['world', tx('rank_tab_world'), "switchRank('tab','world')"], ['local', tx('rank_tab_local'), "switchRank('tab','local')"]], rankTab);
}
function switchRank(what, v){
    if (what === 'kind') rankKind = v; else if (what === 'star') rankStar = v; else rankTab = v;
    renderRankScreen(); loadAndRenderRanking();
}
function localRows(){
    const stars = rankStar ? [rankStar] : [1, 2, 3, 4, 5];
    let rows = [];
    stars.forEach(st => { (rankKind === 'hand' ? getLocalHand(rankSid, st) : getLocalRanking(rankSid, st)).forEach(e => rows.push(Object.assign({}, e, { star: st }))); });
    rows.sort(rankKind === 'hand' ? compareHand : compareRank);
    return rows.slice(0, 30);
}
async function loadAndRenderRanking(){
    const list = $('rank-list'), mySeq = ++rankSeq;
    renderRankHead();
    if (rankTab === 'local'){ renderRankList(localRows()); return; }
    list.innerHTML = `<li class="rk-loading">${escapeHtml(tx('rank_loading'))}</li>`;
    const rows = await (window.loadWorldRanking ? window.loadWorldRanking(rankSid, rankStar, rankKind) : Promise.resolve(null));
    if (mySeq !== rankSeq) return;
    let l2 = rows || [];
    l2 = l2.slice().sort(rankKind === 'hand' ? compareHand : compareRank).slice(0, 30);
    renderRankList(l2);
}
function renderRankHead(){
    const hand = rankKind === 'hand';
    $('rk-panel') ;
    const col = (k, cls) => `<span class="${cls || ''}">${escapeHtml(tx(k))}</span>`;
    $('rk-head').innerHTML = col('rk_col_rank') + col('rk_col_name') + col('rk_col_star', 'c') + (hand ? col('rk_col_role', 'c') : col('rk_col_result', 'c')) + col('rk_col_score', 'r') + (hand ? '' : col('rk_col_stage', 'r')) + col('rk_col_date', 'r');
    $('rk-head').classList.toggle('hand', hand); $('rank-list').classList.toggle('hand', hand);
}
function renderRankList(rows){
    const list = $('rank-list');
    if (!rows || rows.length === 0){ list.innerHTML = `<li class="rk-empty"><b>${escapeHtml(tx('rank_empty'))}</b><span>${escapeHtml(tx('rank_empty_sub'))}</span></li>`; return; }
    const hand = rankKind === 'hand', me = getCurPlayerName();
    list.innerHTML = rows.map((r, i) => {
        const mid = hand ? `<span class="c">${escapeHtml(ROLE_COLOR[r.tag] ? ROLE_NAME[r.tag] : '')}</span>` : `<span class="c rk-res${isClearTag(r.tag) ? ' clear' : ''}">${escapeHtml(r.tag || '')}</span>`;
        return `<li class="rk-row${i < 3 ? ' r' + (i + 1) : ''}${r.name === me ? ' me' : ''}"><span class="rk-no">${i + 1}</span><span class="rk-name">${escapeHtml(FGLName.display(r.name))}</span><span class="c rk-star">${'★'.repeat(r.star || 0)}</span>${mid}<span class="r rk-sc">${r.score}</span>${hand ? '' : `<span class="r">${r.turns}</span>`}<span class="r rk-dt">${escapeHtml(r.date || '')}</span></li>`;
    }).join('');
}

// RUN選択（九九ポーカーと同じ形式。Balatroのブラインド選択をオマージュ）
// ============================================================
const RUNS = [
    { id: 'basic', color: '#7a5cff', nameKey: 'run_basic_name', shortKey: 'run_basic_short', ready: true },
    { id: 'next1', color: '#2fb8a8', nameRaw: '？？？', shortKey: 'run_soon', ready: false },
    { id: 'next2', color: '#ff7a5c', nameRaw: '？？？', shortKey: 'run_soon', ready: false }
];
const runName = r => r.nameKey ? tx(r.nameKey) : r.nameRaw;
const STARS = 5;
const RS_CARD_W = 244, RS_GAP = 20;
const PROG_KEY = 'stellaAleaProg2';
function getProgAll(){ try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e){ return {}; } }
function getProg(sid){
    const p = getProgAll()[sid] || {};
    return { stars: p.stars || {}, best: p.best || {} };
}
function saveProg(sid, p){ const all = getProgAll(); all[sid] = p; try { localStorage.setItem(PROG_KEY, JSON.stringify(all)); } catch (e){} }
function runIndex(sid){ return RUNS.findIndex(r => r.id === sid); }
function maxCleared(sid){ const st = getProg(sid).stars; let m = 0; for (let n = 1; n <= STARS; n++) if (st[n]) m = n; return m; }
function runOpen(sid){ return !!RUNS[runIndex(sid)].ready; }
function starOpen(sid, n){ return runOpen(sid) && (n === 1 || !!getProg(sid).stars[n - 1]); }
let selSid = 'basic', selStar = 1;
function goToRunSelect(){
    goTo('run-select-screen');
    renderRunSelect();
}
function artDie(v, s, l, t, rot, size){ return `<div class="art-d" style="left:${l}px;top:${t}px;transform:rotate(${rot}deg)">${dieFaceHtml(v, s, '', `width:${size}px;height:${size}px;--ss:${size / 46}rem`)}</div>`; }
function sp(ch, l, t, s, d){ return `<div class="spark" style="left:${l}px;top:${t}px;font-size:${s}px;animation-delay:${d || 0}s">${ch}</div>`; }
function runArt(id){
    if (id === 'basic'){
        return `<div class="rs-art" style="background:radial-gradient(circle at 50% 110%,#5a46c0,#201a58 60%,#0c1132)">
            ${sp('✦', 24, 12, 18)}${sp('✦', 196, 22, 24, .6)}${sp('✦', 170, 118, 14, 1.1)}${sp('✦', 14, 112, 16, .3)}
            ${artDie(5, 0, 20, 56, -14, 62)}${artDie(5, 0, 86, 34, 4, 70)}${artDie(5, 0, 154, 56, 14, 62)}
</div>`;
    }
    return `<div class="rs-art" style="background:radial-gradient(circle at 50% 60%,#2a2a6a,#0c1132)">
        ${artDie(2, 0, 28, 52, -12, 62)}${artDie(4, 0, 90, 38, 6, 66)}${artDie(6, 0, 156, 56, 14, 60)}
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem;font-weight:900;color:rgba(255,255,255,.55)">？</div></div>`;
}
function renderRunSelect(){
    const prog = getProg(selSid);
    if (!starOpen(selSid, selStar)) selStar = 1;
    $('rs-strip').innerHTML = RUNS.map(r => {
        const mc = maxCleared(r.id), lk = !r.ready;
        return `<div class="rs-card${r.id === selSid ? ' sel' : ''}${lk ? ' locked' : ''}" style="--c:${r.color}" onclick="selectRun('${r.id}')">
            <div class="rs-tab">${runName(r)}</div>
            ${runArt(r.id)}
            ${mc >= STARS ? '<div class="rs-crown">👑</div>' : ''}
            <div class="rs-body"><div class="rs-short">${tx(r.shortKey).split('\n').map(escapeHtml).join('<br>')}</div></div>
            <button class="rs-go${lk ? ' off' : ''}" ${lk ? 'disabled' : ''} onclick="event.stopPropagation(); startRunFromSelect()">${lk ? '🔒' : `<span class="go-st">${'★'.repeat(selStar)}</span><span>${tx('btn_go')}</span>`}</button>
        </div>`;
    }).join('');
    centerRun();
    const best = prog.best[selStar];
    $('rs-desc').innerHTML = tx(runOpen(selSid) ? 'rs_desc_basic' : 'rs_desc_soon') + (best ? `　<span class="ds-best">${tx('best_label', best)}</span>` : '');
    $('star-row').innerHTML = [1, 2, 3, 4, 5].filter(n => n <= 3 || starOpen(selSid, n)).map(n => {
        const locked = !starOpen(selSid, n);
        return `<button class="star-btn${n === selStar ? ' active' : ''}${locked ? ' locked' : ''}${prog.stars[n] ? ' cleared' : ''}" onclick="selectStar(${n})">${n === selStar ? `<em class="sbpk">${tx('picked')}</em>` : ''}${'★'.repeat(n)}<small>${starLabel(n)}</small></button>`;
    }).join('');
    $('border-row').innerHTML = Array.from({ length: STAGES }, (_, i) => `<div class="border-chip"><small>${tx('stage_chip', i + 1)}</small>${stageTarget(i + 1, selStar)}</div>`).join('');
    const idx = runIndex(selSid);
    $('rs-prev').disabled = idx <= 0;
    $('rs-next').disabled = idx >= RUNS.length - 1;
}
function centerRun(){
    const vp = $('rs-viewport'), idx = runIndex(selSid), PAD = 22;
    const total = RUNS.length * RS_CARD_W + (RUNS.length - 1) * RS_GAP + PAD * 2;
    const vw = vp.clientWidth || 1010;
    let x = vw / 2 - (PAD + idx * (RS_CARD_W + RS_GAP) + RS_CARD_W / 2);
    x = Math.max(Math.min(0, vw - total), Math.min(0, x));
    $('rs-strip').style.transform = `translateX(${x}px)`;
}
function selectRun(id){ selSid = id; renderRunSelect(); }
function moveRun(d){ const i = runIndex(selSid) + d; if (i < 0 || i >= RUNS.length) return; selSid = RUNS[i].id; renderRunSelect(); }
function selectStar(n){ if (!starOpen(selSid, n)) return; selStar = n; renderRunSelect(); }
function startRunFromSelect(){ if (!runOpen(selSid) || !starOpen(selSid, selStar)) return; startRun(selSid, selStar); }

function target(){ return stageTarget(run.stage, run.star); }
function eqLv(){ const o = {}; run.equipped.forEach(id => { if (id && run.skillLv[id]) o[id] = run.skillLv[id]; }); return o; }

function updateBar(){

function skillPanelHtml(id, lv, o){

function renderSkills(){

function rolePanelHtml(id){

        <div class="rl-nm">${ROLE_NAME[id]}<small>Lv${run.roleLv[id]}</small></div>

// ============================================================
// セット画面(サイコロ・スキル共通): ドラッグで入れかえ。タップでも「えらぶ→おく」でできる
// ============================================================
const dd = { mode: null, sel: null, st: null };
function ddKey(t){ return t ? t.kind + ':' + (t.kind === 'slot' ? t.i : (t.kind === 'list' ? t.id : '')) : ''; }
function ddRender(){ if (dd.mode === 'dice') renderDiceModal(); else renderSkillModal(); }
function ddApply(src, dst){
    if (dd.mode === 'dice'){
        if (dst.kind !== 'slot') return;
        if (src.kind === 'slot'){ if (src.i !== dst.i){ const t = run.loadout[src.i]; run.loadout[src.i] = run.loadout[dst.i]; run.loadout[dst.i] = t; } }
        else run.loadout[dst.i] = Number(src.id);
    } else {
        if (dst.kind === 'slot'){
            if (src.kind === 'slot'){ if (src.i !== dst.i){ const t = run.equipped[src.i]; run.equipped[src.i] = run.equipped[dst.i]; run.equipped[dst.i] = t; } }
            else run.equipped[dst.i] = src.id;
        } else if (src.kind === 'slot'){ run.equipped[src.i] = null; }   // 一覧にもどす = はずす
    }
}
function ddSrcOf(el){
    if (el.dataset.drag === 'slot') return { kind: 'slot', i: Number(el.dataset.i) };
    return { kind: 'list', id: el.dataset.id };
}
function ddDstOf(el){
    if (!el) return null;
    const d = el.closest('[data-dz]');
    if (!d) return null;
    if (d.dataset.dz === 'slot') return { kind: 'slot', i: Number(d.dataset.i) };
    return { kind: 'area' };
}
function ddLocal(cx, cy){
    const rc = $('container').getBoundingClientRect();
    if (!isMobileRotated) return { x: (cx - rc.left) / currentScale, y: (cy - rc.top) / currentScale };
    const mx = rc.left + rc.width / 2, my = rc.top + rc.height / 2;
    return { x: 640 + (cy - my) / currentScale, y: 360 - (cx - mx) / currentScale };
}
document.addEventListener('pointerdown', e => {
    if (!dd.mode) return;
    const el = e.target.closest('[data-drag]');
    if (!el) { const z = e.target.closest('[data-dz]'); if (z){ dd.st = { el: null, zone: z, sx: e.clientX, sy: e.clientY, drag: false }; } return; }
    dd.st = { el, sx: e.clientX, sy: e.clientY, drag: false, src: ddSrcOf(el) };
});
document.addEventListener('pointermove', e => {
    const s = dd.st; if (!s || !s.el) return;
    if (!s.drag && Math.hypot(e.clientX - s.sx, e.clientY - s.sy) > 8){
        s.drag = true;
        const g = s.el.cloneNode(true); g.classList.add('dd-ghost'); g.style.width = s.el.offsetWidth + 'px';
        $('container').appendChild(g); s.ghost = g; s.el.classList.add('dd-src');
    }
    if (s.drag){
        const p = ddLocal(e.clientX, e.clientY);
        s.ghost.style.left = p.x + 'px'; s.ghost.style.top = p.y + 'px';
        document.querySelectorAll('.dd-over').forEach(x => x.classList.remove('dd-over'));
        const t = document.elementFromPoint(e.clientX, e.clientY), z = t && t.closest('[data-dz="slot"]');
        if (z) z.classList.add('dd-over');
    }
});
document.addEventListener('pointerup', e => {
    const s = dd.st; dd.st = null; if (!s || !dd.mode) return;
    document.querySelectorAll('.dd-over').forEach(x => x.classList.remove('dd-over'));
    if (s.drag){
        s.ghost.remove();
        const dst = ddDstOf(document.elementFromPoint(e.clientX, e.clientY));
        if (dst) ddApply(s.src, dst);
        dd.sel = null; ddRender(); return;
    }
    // タップ: えらぶ → おく
    let target = null;
    if (s.el) target = s.el.dataset.drag === 'slot' ? { kind: 'slot', i: Number(s.el.dataset.i) } : { kind: 'list', id: s.el.dataset.id };
    else if (s.zone) target = s.zone.dataset.dz === 'slot' ? { kind: 'slot', i: Number(s.zone.dataset.i) } : { kind: 'area' };
    if (!target) return;
    if (!dd.sel){ if (target.kind !== 'area'){ dd.sel = target; } }
    else if (ddKey(dd.sel) === ddKey(target)){ dd.sel = null; }
    else {
        const x = dd.sel, y = target;
        if (x.kind === 'slot' && y.kind === 'list') ddApply(y, x);          // スロットをえらんでから、一覧のものをタップ → そのスロットへ
        else if (x.kind === 'list' && y.kind === 'slot') ddApply(x, y);
        else if (x.kind === 'slot' && y.kind === 'slot') ddApply(x, y);     // 入れかえ
        else if (x.kind === 'slot' && y.kind === 'area') ddApply(x, y);     // はずす(スキルのみ)
        dd.sel = null;
    }
    ddRender();
});
function ddSelCls(kind, key){ return dd.sel && ddKey(dd.sel) === kind + ':' + key ? ' holding' : ''; }

        ${id ? `<div data-drag="slot" data-i="${i}" class="dragitem${ddSelCls('slot', i)}">${skillPanelHtml(id, run.skillLv[id], { cls: 'cp', noId: true })}</div>` : `<div class="sk empty cp">＋</div>`}</div>`).join('');

// ---- ふる ----
function doRoll(){
    if (run.phase !== 'ready') return;
    run.phase = 'rolling';
    const ds = loadoutDice();
    const f = run.forceIdx;
    const r = f ? { idx: f.slice(), v: ds.map((d, i) => d.faces[f[i]]), st: ds.map((d, i) => d.stars[f[i]]) } : rollDice(ds, rnd);
    run.forceIdx = null;
    run.cur = { r, ds };
    $('act-row').innerHTML = '';
    $('brk').innerHTML = '';
    const rollFace = (d) => { const i = Math.floor(Math.random() * 6); return dieFaceHtml(d.faces[i], d.stars[i], 'big rolling', '', d); };
    const done = [false, false, false];
    ds.forEach((d, i) => { $('dslot-' + i).innerHTML = rollFace(d); });
    const iv = setInterval(() => { ds.forEach((d, i) => { if (!done[i]) $('dslot-' + i).innerHTML = rollFace(d); }); }, 70);
    ds.forEach((d, i) => setTimeout(() => {
        done[i] = true;
        $('dslot-' + i).innerHTML = dieFaceHtml(d.faces[r.idx[i]], d.stars[r.idx[i]], 'big land', '', d);
        $('dstrip-' + i).innerHTML = facesHtml(d, 'xl', r.idx[i]);
        if (i === ds.length - 1){ clearInterval(iv); setTimeout(() => showResult(false), 450); }
    }, 650 + i * 380));
}
// ---- ふりなおし: コインをはらって、サイコロを1つ(何回でも)振りなおせる ----
function markRerollable(){
    run.cur.ds.forEach((d, i) => {
        const el = $('dslot-' + i);
        el.querySelectorAll('.rr-badge').forEach(b => b.remove());
        const ok = run.coins >= REROLL_COST;
        el.classList.toggle('rr', ok);
        if (ok) el.setAttribute('onclick', `rerollDie(${i})`); else el.removeAttribute('onclick');
        el.insertAdjacentHTML('beforeend', `<div class="rr-badge${ok ? '' : ' off'}">🔄<b>${REROLL_COST}</b></div>`);
    });
}
function clearRerollable(){
    run.cur.ds.forEach((d, i) => { const el = $('dslot-' + i); el.classList.remove('rr'); el.removeAttribute('onclick'); el.querySelectorAll('.rr-badge').forEach(b => b.remove()); });
}
function rerollDie(i){
    if (run.phase !== 'shown' || run.coins < REROLL_COST) return;
    run.coins -= REROLL_COST; $('hud-coin').textContent = run.coins;
    run.phase = 'rolling';
    clearRerollable();
    const { r, ds } = run.cur, d = ds[i];
    const el = $('dslot-' + i);
    const iv = setInterval(() => { const f = Math.floor(Math.random() * 6); el.innerHTML = dieFaceHtml(d.faces[f], d.stars[f], 'big rolling', '', d); }, 70);
    setTimeout(() => {
        clearInterval(iv);
        const f = Math.floor(rnd() * 6);
        r.idx[i] = f; r.v[i] = d.faces[f]; r.st[i] = d.stars[f];
        el.innerHTML = dieFaceHtml(d.faces[f], d.stars[f], 'big land', '', d);
        $('dstrip-' + i).innerHTML = facesHtml(d, 'xl', f);
        setTimeout(() => showResult(true), 350);
    }, 700);
}
function showResult(instant){
    const r = run.cur.r;
    const res = calcScore(r.v, r.st, eqLv(), run.roleLv);
    run.curRes = res;
    const chip = (label, val, c) => `<div class="chip" style="--c:${c}"><small>${label}</small><b>${val}</b></div>`;
    const pieces = [];
    pieces.push(chip(tx('sum'), res.sum, '#fff7e6'));
    pieces.push(`<span class="op">×</span>` + chip(ROLE_NAME[res.role], fm(res.roleMult), ROLE_COLOR[res.role]));
    res.parts.forEach(p => pieces.push(`<span class="op">×</span>` + chip(SKILL_NAME[p.id] + (p.cnt > 1 ? tx('count', p.cnt) : ''), fm(p.mult), skillColor(p.id))));
    if (res.starCount) pieces.push(`<span class="op">×</span>` + chip('★' + res.starCount, fm(res.starMul), 'var(--gold)'));
    const big = res.role === 'pinzoro' || res.role === 'zorome';
    const banner = res.role === 'none' ? `<div class="role-banner none">${ROLE_NAME.none}</div>` : `<div class="role-banner${big ? ' big' : ''}">${res.role === 'pinzoro' ? tx('pinzoro_banner') : (res.role === 'zorome' ? tx('zorome_banner') : ROLE_NAME[res.role])}</div>`;
    $('brk').innerHTML = `<div class="brk-top">${banner}<div id="brk-total" style="min-height:58px"></div></div><div class="chips" id="brk-chips"></div>`;
    renderRoleList(res.role);
    const box = $('brk-chips');
    const step = instant ? 0 : 300;
    const add = h => { box.insertAdjacentHTML('beforeend', h); fitChips(); };
    pieces.forEach((h, i) => { if (instant) add(h); else setTimeout(() => add(h), step * i); });
    res.parts.forEach((p, i) => { const e = $('sk-' + p.id); if (e) setTimeout(() => { e.classList.remove('hit'); void e.offsetWidth; e.classList.add('hit'); }, instant ? 0 : 300 * (2 + i)); });
    setTimeout(() => {
        $('brk-total').innerHTML = `<div class="total-line"><small>${tx('total')}</small>${res.total}</div>`;
        run.pending = res.total;
        updateBar();
        run.phase = 'shown';
        const cleared = run.total + run.pending >= target();
        const lastGame = run.gameNo >= GAMES_PER_STAGE;
        const label = !lastGame ? tx('next_game') : (cleared ? tx(run.stage === STAGES ? 'clear_final' : 'clear_stage') : tx('see_result'));
        $('act-row').innerHTML = `<button class="btn ${cleared && lastGame ? 'btn-gold' : 'btn-teal'} btn-roll" style="font-size:1.8rem" onclick="afterResult()">${label}</button>`;
        markRerollable();
    }, step * pieces.length + (instant ? 0 : 350));
}
// 倍率のコンテナが多いときは、1行におさまるように縮小する(改行しない)
function fitChips(){
    const box = $('brk-chips'); if (!box) return;
    box.style.transform = 'none';
    const avail = box.parentElement.clientWidth - 16, w = box.offsetWidth;
    box.style.transform = w > avail ? `scale(${avail / w})` : 'none';
}
function afterResult(){
    if (run.phase !== 'shown') return;
    clearRerollable();
    run.total += run.pending;
    run.sumScore += run.pending;
    if (run.pending > run.bestGame){ run.bestGame = run.pending; run.bestRole = run.curRes.role; }
    run.pending = 0;
    updateBar();
    run.phase = 'picking';
    const last = run.gameNo >= GAMES_PER_STAGE;
    // 3ゲームめがおわったらボーダーの判定(途中でボーダーに届いても、ステージクリアにはしない)
    if (last && run.total < target()){ endRun(false); return; }
    if (!hasSkillPick(run.stage, run.gameNo)){ endRun(true); return; }
    openPick();
}

// ---- スキルえらび(毎ゲームのあと) ----
function openPick(){
    run.offer = offerSkills(rnd);
    renderPick();
    $('pick-modal').classList.remove('hidden');
}
function renderPick(){
    $('pick-title').innerHTML = `${tx('pick_title')}　<span class="coin-pill" style="font-size:1.3rem;vertical-align:middle"><i style="width:26px;height:26px;font-size:.9rem">$</i>${run.coins}</span>`;
    $('pick-row').innerHTML = run.offer.map(o => {
        const id = o.id, lv = run.skillLv[id] || 0, maxed = lv >= SKILL_MAX_LV, nl = Math.min(SKILL_MAX_LV, lv + o.up);
        return `<div class="pk${o.up > 1 ? ' rare' : ''}" style="--c:${skillColor(id)}" onclick="pickSkill('${id}',${o.up})">${o.up > 1 ? '<div class="pk-rare">Lv+2！</div>' : ''}<div class="pk-top">${skillIcon(id, 'big')}<div class="pk-lv${lv ? '' : ' new'}">${lv ? (maxed ? `Lv${lv} MAX` : `Lv${lv} → ${nl}`) : `NEW！ Lv${nl}`}</div></div>
            <div class="pk-body"><div class="pk-name">${SKILL_NAME[id]}</div><div class="pk-desc">${skillDesc(id, nl)}</div>
            <div class="pk-ml"><small>${tx('mult_label')}</small>×${fm(skillMultAt(id, nl))}</div></div></div>`;
    }).join('');
    const rb = $('btn-reload');
    rb.disabled = run.coins < SKILL_RELOAD_COST;
    rb.innerHTML = `${tx('reload')} <span class="coin-pill" style="font-size:1.15rem;padding:0 10px 0 5px;box-shadow:none;border-width:3px"><i style="width:22px;height:22px;font-size:.8rem">$</i>${SKILL_RELOAD_COST}</span>`;
}
function reloadSkills(){
    if (run.coins < SKILL_RELOAD_COST) return;
    run.coins -= SKILL_RELOAD_COST;
    $('hud-coin').textContent = run.coins;
    run.offer = offerSkills(rnd);
    renderPick();
}
function pickSkill(id, up){
    run.skillLv[id] = Math.min(SKILL_MAX_LV, (run.skillLv[id] || 0) + (up || 1));
    if (run.equipped.indexOf(id) < 0){
        const free = run.equipped.indexOf(null);
        if (free >= 0) run.equipped[free] = id; else run.newSkill = true;
    }
    $('pick-modal').classList.add('hidden');
    if (run.gameNo < GAMES_PER_STAGE){ run.gameNo++; beginGame(); return; }
    // ステージクリア
    run.coins += clearCoins();
    enterShop();
    toast(tx('toast_clear', clearCoins()));
}

// ============================================================
// ショップ
// ============================================================
const BALL_COLORS = ['#ff6b7a', '#ffd84a', '#62d97e', '#58b0ff', '#b08cff', '#ff9a3d', '#ff7ab8', '#35d0c0'];
function buildGachaDome(){
    const pos = [[8, 78], [50, 84], [92, 76], [28, 48], [70, 50], [10, 28], [52, 22], [90, 34]];
    $('gm-dome').innerHTML = pos.map((p, i) => `<div class="gm-ball" style="left:${p[0]}px;top:${p[1]}px;--b:${BALL_COLORS[i]}"></div>`).join('');
}
function enterShop(){
    run.phase = 'shop';
    const cand = ['pair', 'stairs', 'zorome', 'pinzoro'].filter(id => run.roleLv[id] < ROLE_MAX_LV);
    run.saleRole = cand.length ? cand[Math.floor(rnd() * cand.length)] : null;
    run.boughtRoles = [];
    run.gachaLast = null;
    goTo('shop-screen');
    buildGachaDome();
    renderShop();
}
function renderShop(){
    $('shop-coin').textContent = run.coins;
    const full = run.dice.length >= DICE_CAP;
    $('btn-gacha').disabled = run.coins < GACHA_PRICE || full;
    $('btn-gacha').innerHTML = full ? tx('full') : `${tx('gacha')}<span class="coin-pill" style="font-size:1.35rem;padding:0 12px 0 6px;box-shadow:none;border-width:3px"><i style="width:26px;height:26px;font-size:.9rem">$</i>${GACHA_PRICE}</span>`;
    const g = run.gachaLast;
    $('gacha-show').innerHTML = g ? `${g.starTotal >= 4 || g.type === 'doubletrio' || g.type === 'threepair' ? `<div class="rare">${tx('rare')}</div>` : ''}${dieCardHtml(g, { size: 'xl', foot: false })}` : '';
    $('shop-roles').innerHTML = ['pair', 'stairs', 'zorome', 'pinzoro'].map(id => {
        const lv = run.roleLv[id], max = lv >= ROLE_MAX_LV, done = run.boughtRoles.indexOf(id) >= 0, sale = id === run.saleRole, cost = roleUpPrice(run.roleBuys, sale);
        return `<div class="rl rl-shop" style="--c:${ROLE_COLOR[id]}">${sale && !max ? `<div class="sale-tag">${tx('sale_tag')}</div>` : ''}<div class="rs-left"><div class="rl-nm">${ROLE_NAME[id]}<small>Lv${lv}${max ? ' MAX' : ''}</small></div>
            <div class="rl-dice">${ROLE_SAMPLE[id].map(v => dieFaceHtml(v, 0, 'xs')).join('')}</div></div>
            <div class="rs-flow">${max ? '<span></span><span></span>' : `<span class="from">×${fm(roleMult(id, lv))}</span><span class="arr">▶</span>`}<span class="to">×${fm(roleMult(id, max ? lv : lv + 1))}</span></div>
            <button class="lv-up${done ? ' done' : ''}" ${max || done || run.coins < cost ? 'disabled' : ''} onclick="buyRole('${id}')">${done ? tx('bought') : `UP<small>${sale && !max ? `<s>${roleUpCost(run.roleBuys)}</s> ` : ''}🪙${cost}</small>`}</button></div>`;
    }).join('');
    $('bag-cap').textContent = `${run.dice.length}/${DICE_CAP}`;
    const sorted = run.loadout.map(dieById).concat(run.dice.filter(d => run.loadout.indexOf(d.id) < 0));
    $('shop-bag').innerHTML = sorted.map(d => {
        const set = run.loadout.indexOf(d.id) >= 0;
        return `<div class="sr${set ? ' set' : ''}${d.starTotal >= 4 ? ' glow' : ''}" style="--rc:${TYPE_COLOR[d.type]}">${set ? `<span class="sr-set">${tx('set_badge')}</span>` : ''}<div class="sr-l"><span class="sr-t">${TYPE_NAME[d.type]}</span>${d.starTotal ? `<span class="dc-st">★${d.starTotal}</span>` : ''}</div>
            ${facesHtml(d, 'md')}<div class="sr-p">🪙${sellValue(d)}</div><button class="sell-btn" onclick="sellDie(${d.id})">${tx('sell')}</button></div>`;
    }).join('');
    $('skill-dot').classList.toggle('hidden', !run.newSkill);
}
function buyGacha(){
    if (run.coins < GACHA_PRICE || run.dice.length >= DICE_CAP) return;
    run.coins -= GACHA_PRICE;
    const d = gachaDie(rnd);
    run.dice.push(d);
    run.gachaLast = d;
    const gm = $('gm'); gm.classList.remove('shake'); void gm.offsetWidth; gm.classList.add('shake');
    renderShop();
}
function buyRole(id){
    run.gachaLast = null;
    const cost = roleUpPrice(run.roleBuys, id === run.saleRole);
    if (run.coins < cost || run.roleLv[id] >= ROLE_MAX_LV || run.boughtRoles.indexOf(id) >= 0) return;
    run.coins -= cost; run.roleBuys++; run.roleLv[id]++; run.boughtRoles.push(id);
    renderShop();
}
function sellDie(id){
    run.gachaLast = null;
    if (run.dice.length <= LOADOUT){ toast(tx('toast_min_dice')); return; }
    const d = dieById(id); if (!d) return;
    run.coins += sellValue(d);
    run.dice = run.dice.filter(x => x.id !== id);
    for (let i = 0; i < run.loadout.length; i++){
        if (!dieById(run.loadout[i])){
            const free = run.dice.find(x => run.loadout.indexOf(x.id) < 0);
            run.loadout[i] = free.id;
        }
    }
    renderShop();
}
function goNextStage(){
    run.stage++; run.gameNo = 1; run.total = 0;
    goTo('play-screen');
    beginGame();
}

// ============================================================
// おわり
// ============================================================
function endRun(cleared){
    const p = getProg(run.sid);
    if ((p.best[run.star] || 0) < run.stage) p.best[run.star] = run.stage;
    if (cleared) p.stars[run.star] = true;
    saveProg(run.sid, p);
    const sk = run.equipped.filter(Boolean).map(id => skillPanelHtml(id, run.skillLv[id], { cls: 'cp', noId: true })).join('');
    const dice = run.loadout.map(dieById).map(d => dieCardHtml(d, { foot: false })).join('');
    const roles = ['pinzoro', 'zorome', 'stairs', 'pair'].map(id => `<div class="er" style="--c:${ROLE_COLOR[id]}"><span>${ROLE_NAME[id]}<small>Lv${run.roleLv[id]}</small></span><b>×${fm(roleMult(id, run.roleLv[id]))}</b></div>`).join('');
    $('end-box').innerHTML = `<div class="end-title${cleared ? '' : ' fail'}">${tx(cleared ? 'end_clear' : 'end_over')}</div>
        <div class="end-stats">
            <div class="end-stat">${tx('end_reached')}<b>${tx('end_stage', run.stage)}</b></div>
            <div class="end-stat">${tx('end_total')}<b>${run.sumScore || 0}</b>${tx('end_pts')}</div>
            <div class="end-stat">${tx('end_best')}<b>${run.bestGame}</b>${tx('end_pts')}<small style="display:block;color:#cbbfff">${ROLE_NAME[run.bestRole]}</small></div>
            <div class="end-stat">${tx('end_diff')}<b>${'★'.repeat(run.star)}</b></div>
        </div>
        <div class="end-cap">${tx('end_cap_dice')}</div><div class="end-dice">${dice}</div>
        <div class="end-cap">${tx('end_cap_roles')}</div><div class="end-roles">${roles}</div>
        <div class="end-cap">${tx('end_cap_skills')}</div><div class="end-sk">${sk}</div>
        <div id="end-world-msg" class="end-world"></div>
        <button class="btn btn-gold" onclick="retryRun()">${tx('btn_retry')}</button>
        <button class="btn" onclick="closeEndToRanking()">${tx('btn_end_ranking')}</button>
        <button class="btn" onclick="closeEnd()">${tx('btn_to_select')}</button>`;
    $('end-modal').classList.remove('hidden');
    recordRun(cleared);
}
function retryRun(){ $('end-modal').classList.add('hidden'); startRun(run.sid, run.star); }
function closeEnd(){ $('end-modal').classList.add('hidden'); goToRunSelect(); }
function requestRetire(){ $('retire-modal').classList.remove('hidden'); }
function confirmRetire(){ $('retire-modal').classList.add('hidden'); goToRunSelect(); }

// ============================================================
// あそびかた
// ============================================================
function openHowTo(){
    $('howto-body').innerHTML = tx('howto_body');
    $('howto-modal').classList.remove('hidden');
}

// ============================================================
// 画面サイズ
// ============================================================
let isMobileRotated = false, currentScale = 1;
function scaleContainer(){
    const el = $('container'), vp = window.visualViewport;
    const w = vp ? vp.width : window.innerWidth, h = vp ? vp.height : window.innerHeight;
    if (w <= 0 || h <= 0) return;
    el.style.left = `${w / 2 - 640}px`; el.style.top = `${h / 2 - 360}px`;
    isMobileRotated = w < h && w <= 900;
    if (isMobileRotated){ const s = Math.min(h / 1280, w / 720); currentScale = s; el.style.transform = `rotate(90deg) scale(${s})`; }
    else { const s = Math.min(w / 1280, h / 720); currentScale = s; el.style.transform = `scale(${s})`; }
}
window.addEventListener('resize', scaleContainer);
window.addEventListener('load', scaleContainer);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scaleContainer);
scaleContainer(); setTimeout(scaleContainer, 100); setTimeout(scaleContainer, 300);

applyI18n();
buildTitle();
updateNameBtn();
if (!RANKING_ENABLED) $('btn-ranking').classList.add('hidden');
try {
    const allText = Object.values(TX).map(e => (typeof e.ja === 'string' ? e.ja + e.ja_easy + e.en : '')).join('') + '全偶奇素倍和個↑↓×＋：、。！？ステラ・アレアサイコロぐうすうきすう以下上のばい目';
    ['700', '800', '900'].forEach(w => document.fonts.load(`${w} 16px "M PLUS Rounded 1c"`, allText));
} catch (e) {}
</script>
