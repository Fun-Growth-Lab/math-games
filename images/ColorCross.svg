<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#eaf6ff"/>
      <stop offset="50%"  stop-color="#eafff2"/>
      <stop offset="100%" stop-color="#fff0f0"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff6b6b"/>
      <stop offset="50%"  stop-color="#4dabf7"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- scattered marks: circle / triangle / square in 3 bright colors, white sticker outline -->
  <circle   cx="54"  cy="60"  r="26" fill="#ff6b6b" stroke="#fff" stroke-width="4" opacity="0.9"/>
  <polygon  points="150,34 180,90 120,90" fill="#4dabf7" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.9"/>
  <rect     x="230" y="36" width="52" height="52" rx="8" fill="#4ade80" stroke="#fff" stroke-width="4" opacity="0.9"/>
  <circle   cx="360" cy="60" r="24" fill="#4dabf7" stroke="#fff" stroke-width="4" opacity="0.75"/>

  <circle   cx="40"  cy="230" r="24" fill="#4ade80" stroke="#fff" stroke-width="4" opacity="0.7"/>
  <polygon  points="410,190 438,236 382,236" fill="#ff6b6b" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.75"/>
  <rect     x="120" y="215" width="46" height="46" rx="8" fill="#4dabf7" stroke="#fff" stroke-width="4" opacity="0.7"/>
  <polygon  points="330,208 356,222 356,252 330,266 304,252 304,222" fill="#4ade80" stroke="#fff" stroke-width="4" stroke-linejoin="round" opacity="0.65"/>

  <!-- center cross card motif -->
  <rect x="205" y="120" width="70" height="70" rx="12" fill="#ffffff" stroke="#ff6b6b" stroke-width="4"/>
  <text x="240" y="168" text-anchor="middle" font-family="Nunito, sans-serif" font-size="42" font-weight="800" fill="#ff6b6b">3</text>

  <!-- title text -->
  <text x="240" y="248" text-anchor="middle"
        font-family="Georgia, serif" font-size="46" font-weight="bold"
        fill="url(#title)" letter-spacing="2">ColorCross</text>
  <text x="240" y="272" text-anchor="middle"
        font-family="sans-serif" font-size="15" fill="#8a8a94" letter-spacing="4">色をかぞえて消すパズル</text>
</svg>
