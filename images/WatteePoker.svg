<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3fb27c"/>
      <stop offset="0.6" stop-color="#1b6b4e"/>
      <stop offset="1" stop-color="#0d3d33"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4b0"/>
      <stop offset="0.55" stop-color="#ffc93d"/>
      <stop offset="1" stop-color="#e8a317"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e0ff"/>
      <stop offset="0.55" stop-color="#c78bff"/>
      <stop offset="1" stop-color="#8f4fe0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafff2"/>
      <stop offset="0.55" stop-color="#8ce6b0"/>
      <stop offset="1" stop-color="#3fbf7a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#felt)"/>
  <!-- 渦のすじ -->
  <g opacity="0.07" fill="#fff">
    <path d="M200 120 L-60 -40 L40 -80 Z"/><path d="M200 120 L460 -40 L360 -80 Z"/>
    <path d="M200 120 L-80 160 L-80 260 Z"/><path d="M200 120 L480 160 L480 260 Z"/>
  </g>
  <!-- 数字カードの扇 -->
  <g stroke="#fff" stroke-width="5" font-family="'M PLUS Rounded 1c', sans-serif" font-weight="900" font-size="46" fill="#fff" text-anchor="middle">
    <g transform="rotate(-28 200 255)"><rect x="162" y="38" width="76" height="106" rx="11" fill="#f7d247"/><text x="200" y="107" stroke="none">3</text></g>
    <g transform="rotate(-14 200 255)"><rect x="162" y="38" width="76" height="106" rx="11" fill="#a5da64"/><text x="200" y="107" stroke="none">4</text></g>
    <g transform="rotate(0 200 255)"><rect x="162" y="38" width="76" height="106" rx="11" fill="#a5da64"/><text x="200" y="107" stroke="none">4</text></g>
    <g transform="rotate(14 200 255)"><rect x="162" y="38" width="76" height="106" rx="11" fill="#a5da64"/><text x="200" y="107" stroke="none">4</text></g>
    <g transform="rotate(28 200 255)"><rect x="162" y="38" width="76" height="106" rx="11" fill="#55d8b4"/><text x="200" y="107" stroke="none">5</text></g>
  </g>
  <!-- 特別カード -->
