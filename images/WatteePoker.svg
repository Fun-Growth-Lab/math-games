    <g transform="rotate(-14 56 90)"><rect x="22" y="40" width="68" height="94" rx="10" fill="url(#gold)" stroke="#ffa800" stroke-width="4"/><text x="56" y="103" font-size="30" fill="#7a4a00">24</text></g>
    <g transform="rotate(13 346 86)"><rect x="312" y="36" width="68" height="94" rx="10" fill="url(#purple)" stroke="#6f2fc8" stroke-width="4"/><text x="346" y="99" font-size="30" fill="#3b1470">36</text></g>
    <g transform="rotate(8 366 176)"><rect x="338" y="138" width="54" height="76" rx="8" fill="url(#green)" stroke="#1f9a5a" stroke-width="4"/><text x="365" y="188" font-size="24" fill="#0f4a2a">20</text></g>
  </g>
  <!-- ロゴ -->
  <g font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
