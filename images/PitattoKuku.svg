<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#ffe0a8"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb56b"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb0ff"/>
      <stop offset="100%" stop-color="#4d7ff7"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2b8"/>
      <stop offset="100%" stop-color="#ffc93d"/>
    </linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6bf2c8"/>
      <stop offset="100%" stop-color="#22b8a0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="60" cy="50" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="70" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="90" cy="250" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="240" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- 3 + 6 = 9 のたし算で九九の答えを作るイメージ -->
  <g>
    <rect x="60" y="108" width="84" height="84" rx="18" fill="url(#t1)"/>
    <text x="102" y="163" font-family="Verdana, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  </g>
  <text x="168" y="163" font-family="Verdana, sans-serif" font-size="40" font-weight="800" fill="#c06030" text-anchor="middle">+</text>
  <g>
    <rect x="192" y="108" width="84" height="84" rx="18" fill="url(#t2)"/>
    <text x="234" y="163" font-family="Verdana, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
  </g>
  <text x="300" y="163" font-family="Verdana, sans-serif" font-size="40" font-weight="800" fill="#c06030" text-anchor="middle">=</text>
  <g>
    <rect x="316" y="98" width="70" height="104" rx="18" fill="url(#t3)"/>
    <text x="351" y="163" font-family="Verdana, sans-serif" font-size="46" font-weight="800" fill="#5a3d00" text-anchor="middle">9</text>
  </g>

  <text x="200" y="60" font-family="'M PLUS Rounded 1c', Verdana, sans-serif" font-size="30" font-weight="800" fill="#e2632f" text-anchor="middle">ピタッと九九</text>
  <rect x="60" y="222" width="326" height="34" rx="17" fill="#ffffff" opacity="0.75"/>
  <text x="223" y="245" font-family="'M PLUS Rounded 1c', Verdana, sans-serif" font-size="16" font-weight="700" fill="#3a2e55" text-anchor="middle">たし算で九九の答えをつくろう！</text>
</svg>
