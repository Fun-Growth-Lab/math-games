<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0f5132"/>
      <stop offset="100%" stop-color="#052318"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d872"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <rect x="4" y="4" width="392" height="252" rx="14" fill="none" stroke="#d4af37" stroke-width="3"/>

  <!-- card 1 -->
  <g transform="translate(120,60) rotate(-12)">
    <rect width="86" height="120" rx="10" fill="#fffaf0" stroke="#9b6bf0" stroke-width="4"/>
    <text x="12" y="28" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#b3273a">A</text>
    <text x="43" y="70" font-family="Georgia, serif" font-size="34" text-anchor="middle" fill="#b3273a">♥</text>
    <text x="74" y="112" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#b3273a" transform="rotate(180 74 112)">A</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(196,50) rotate(8)">
    <rect width="86" height="120" rx="10" fill="#fffaf0" stroke="#d4af37" stroke-width="3"/>
    <text x="12" y="28" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c1c1c">K</text>
    <text x="43" y="70" font-family="Georgia, serif" font-size="34" text-anchor="middle" fill="#1c1c1c">♠</text>
    <text x="74" y="112" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c1c1c" transform="rotate(180 74 112)">K</text>
  </g>

  <text x="200" y="215" font-family="Georgia, serif" font-size="30" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="2">BLACKJACK ARCANA</text>
  <text x="200" y="238" font-family="Georgia, serif" font-size="15" fill="#b9a77e" text-anchor="middle" letter-spacing="4">21</text>
