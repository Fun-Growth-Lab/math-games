<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ストーリーパート テスト表示</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-page:   #0c0805;
        --bg-grad1:  #22160e;
        --bg-grad2:  #3c2a1a;
        --ink:       #f3e8d6;
        --ink-dim:   #a8967f;
        --accent:    #c9d2dc;
        --gold:      #ffc95c;
        --gold-dk:   #c2911f;
        --card-bg:   #22160e;
        --card-bdr:  #5a4632;
        --danger:    #ff5c56;
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
        overflow: hidden; background: var(--bg-page);
        font-family: "M PLUS Rounded 1c", sans-serif; user-select:none; -webkit-user-select:none;
        display:flex; justify-content:center; align-items:center; height:100vh; width:100vw;
    }
    /* ==== ストーリー画面本体：1280x720固定キャンバスを画面に収める（本編index.htmlと同じ考え方） ==== */
    #stage {
        width:1280px; height:720px; flex-shrink:0; position:relative; overflow:hidden;
        background: radial-gradient(ellipse at 50% 30%, var(--bg-grad2) 0%, var(--bg-grad1) 60%, var(--bg-page) 100%);
        box-shadow: 0 0 60px rgba(255,201,92,0.08), 0 20px 60px rgba(0,0,0,0.5);
        border-radius: 24px; border: 3px solid #4a3a28;
    }
    /* テスト用の目印。実装時は背景CGに差し替える想定 */
    .bg-note {
        position:absolute; top:22px; left:50%; transform:translateX(-50%);
        font-size:0.8rem; font-weight:800; color: var(--ink-dim); letter-spacing:2px;
        background: rgba(0,0,0,0.35); padding:4px 14px; border-radius:20px; border:1px solid var(--card-bdr);
    }
    /* ==== 立ち絵（画面下、中央やや左に大きく。素材は512x512の透過PNG） ==== */
    #portrait-wrap {
        position:absolute; left:50%; bottom:150px; transform:translateX(-50%);
        width:460px; height:460px; pointer-events:none;
        filter: drop-shadow(0 18px 24px rgba(0,0,0,0.55));
    }
    #portrait {
        width:100%; height:100%; object-fit:contain; image-rendering:pixelated;
        opacity:0; transform:translateY(16px) scale(0.97);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #portrait.show { opacity:1; transform:translateY(0) scale(1); }
    /* 発言していないとき（相槌の間などの表現用）は少し暗くする */
    #portrait.dim { filter: brightness(0.55) saturate(0.7); }
    /* ==== 名前プレート ==== */
    #name-plate {
        position:absolute; left:64px; bottom:214px; z-index:3;
        display:inline-flex; align-items:center; gap:8px;
        background: linear-gradient(135deg, #3a2210, #1c1108);
        border:2px solid var(--gold-dk); border-radius:14px 14px 4px 14px;
        padding:8px 26px; box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    #name-plate .crown { font-size:1.1rem; }
    #name-plate span.txt { font-size:1.25rem; font-weight:800; color: var(--gold); text-shadow:0 1px 3px rgba(0,0,0,0.6); }
    /* ==== メッセージウィンドウ ==== */
    #msg-box {
        position:absolute; left:32px; right:32px; bottom:28px; z-index:2;
        min-height:150px;
        background: rgba(20,13,8,0.88); border:2px solid var(--card-bdr); border-radius:20px;
        box-shadow: 0 -4px 0 rgba(255,255,255,0.03) inset, 0 10px 30px rgba(0,0,0,0.5);
        padding:22px 30px 18px; cursor:pointer;
    }
    #msg-text {
        font-size:1.32rem; line-height:1.7; font-weight:700; color: var(--ink);
        min-height:96px; white-space:pre-wrap;
    }
    #msg-text .cursor { display:inline-block; width:0; animation:none; }
    #next-arrow {
        position:absolute; right:22px; bottom:14px; font-size:1.1rem; color: var(--gold);
        animation: nextBounce 1s ease-in-out infinite;
    }
    @keyframes nextBounce { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(5px); } }
    /* ==== 上部バー：進行状況・スキップ（テスト用の最小限のUI） ==== */
    #top-bar {
        position:absolute; top:0; left:0; right:0; height:52px; z-index:4;
        display:flex; align-items:center; justify-content:space-between; padding:0 20px;
        background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0));
    }
    #top-bar .title { font-size:0.92rem; font-weight:800; color: var(--ink-dim); letter-spacing:2px; }
    #skip-btn {
        font-size:0.82rem; font-weight:800; color: var(--ink); background: rgba(255,255,255,0.08);
        border:1px solid var(--card-bdr); border-radius:10px; padding:6px 14px; cursor:pointer;
    }
    #skip-btn:hover { border-color: var(--gold); color: var(--gold); }
    /* ==== 表情テストパネル（本番では不要。動作確認用に表情を直接選べるようにする） ==== */
    #dev-panel {
        position:absolute; top:60px; right:16px; z-index:5;
        background: rgba(0,0,0,0.55); border:1px solid var(--card-bdr); border-radius:12px;
        padding:8px; display:flex; gap:6px;
    }
    #dev-panel button {
        font-family:inherit; font-size:0.72rem; font-weight:800; color: var(--ink);
        background:#1c140e; border:1px solid var(--card-bdr); border-radius:8px; padding:6px 10px; cursor:pointer;
    }
    #dev-panel button.active { border-color: var(--gold); color: var(--gold); }
    #dev-panel button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div id="stage">
    <div class="bg-note">背景CG（テスト表示のため未設定）</div>
    <div id="top-bar">
        <span class="title">プロローグ・試作</span>
        <span id="skip-btn" onclick="skipToEnd()">スキップ ▶▶</span>
    </div>

    <div id="dev-panel"></div>

    <div id="portrait-wrap">
        <img id="portrait" src="" alt="">
    </div>

    <div id="name-plate"><span class="crown">👑</span><span class="txt" id="name-text">魔王</span></div>

    <div id="msg-box" onclick="advance()">
        <div id="msg-text"></div>
        <div id="next-arrow">▼</div>
    </div>
</div>

<script>
// ==== 表示する素材：images/kao/maou1_<表情>.png（normal/smile/angry/cry） ====
const EXPR_FILES = {
    normal: 'images/kao/maou1_normal.png',
    smile:  'images/kao/maou1_smile.png',
    angry:  'images/kao/maou1_angry.png',
    cry:    'images/kao/maou1_cry.png',
};
const EXPR_LABEL = { normal:'通常', smile:'笑顔', angry:'怒り', cry:'涙' };

// ==== テスト用の台詞データ（本編では別ファイル・JSONなどに切り出す想定） ====
const SCRIPT = [
    { name:'魔王', expr:'normal', text:'……ようやく、この迷宮の主となる時が来たようだな。' },
    { name:'魔王', expr:'smile',  text:'人間どもよ、精々足掻くがいい。私の可愛い配下たちが、お前たちを歓迎してくれる。' },
    { name:'魔王', expr:'angry',  text:'ふん……まだ挑んでくるつもりか。身の程を知れ。' },
    { name:'魔王', expr:'cry',    text:'……くっ、こんなところで、私が……。' },
];

let idx = 0;
const portraitEl = document.getElementById('portrait');
const nameEl = document.getElementById('name-text');
const textEl = document.getElementById('msg-text');

// タイプライター表示（1文字ずつ）。表示中にクリック/タップしたら全文を即表示する
let typing = null;
function typeText(full){
    if (typing) clearInterval(typing);
    textEl.textContent = '';
    let i = 0;
    typing = setInterval(() => {
        i++;
        textEl.textContent = full.slice(0, i);
        if (i >= full.length){ clearInterval(typing); typing = null; }
    }, 28);
}
function showLine(line){
    nameEl.textContent = line.name;
    const nextSrc = EXPR_FILES[line.expr];
    if (portraitEl.getAttribute('data-expr') !== line.expr){
        portraitEl.classList.remove('show');
        setTimeout(() => {
            portraitEl.src = nextSrc;
            portraitEl.setAttribute('data-expr', line.expr);
            portraitEl.classList.add('show');
        }, 120);
    }
    typeText(line.text);
    highlightDevPanel(line.expr);
}
function advance(){
    if (typing){ clearInterval(typing); typing = null; textEl.textContent = SCRIPT[idx].text; return; }
    idx++;
    if (idx >= SCRIPT.length) idx = 0; // テスト表示のためループする
    showLine(SCRIPT[idx]);
}
function skipToEnd(){ idx = SCRIPT.length - 1; showLine(SCRIPT[idx]); }

// ==== 開発用パネル：表情を直接選んで見た目を確認できるようにする（本番の会話進行には使わない） ====
function highlightDevPanel(expr){
    document.querySelectorAll('#dev-panel button').forEach(b => b.classList.toggle('active', b.dataset.expr===expr));
}
function buildDevPanel(){
    const wrap = document.getElementById('dev-panel');
    wrap.innerHTML = Object.keys(EXPR_FILES).map(k =>
        `<button data-expr="${k}" onclick="previewExpr('${k}')">${EXPR_LABEL[k]}</button>`
    ).join('');
}
function previewExpr(expr){
    const line = SCRIPT[idx];
    showLine({ name: line.name, expr, text: line.text });
}

buildDevPanel();
showLine(SCRIPT[0]);

// 画面サイズが変わっても縦横比(1280×720)を保ったまま拡大縮小する（本編index.htmlと同じ仕組み）
function scaleStage(){
    const el = document.getElementById('stage');
    const w = window.innerWidth, h = window.innerHeight;
    if (w <= 0 || h <= 0) return;
    el.style.transform = `scale(${Math.min(w / 1280, h / 720)})`;
}
window.addEventListener('resize', scaleStage);
window.addEventListener('load', scaleStage);
scaleStage();
requestAnimationFrame(scaleStage);
</script>
</body>
</html>
