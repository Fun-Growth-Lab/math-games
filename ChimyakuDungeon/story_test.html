<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ストーリーパート テスト表示</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-page:   #0c0805;
        --bg-grad1:  #22160e;
        --bg-grad2:  #3c2a1a;
        --ink:       #f3e8d6;
        --ink-dim:   #a8967f;
        --accent:    #c9d2dc;
        --gold:      #ffc95c;
        --gold-dk:   #c2911f;
        --card-bg:   #22160e;
        --card-bdr:  #5a4632;
        --danger:    #ff5c56;
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
        overflow: hidden; background: var(--bg-page);
        font-family: "M PLUS Rounded 1c", sans-serif; user-select:none; -webkit-user-select:none;
        display:flex; justify-content:center; align-items:center; height:100vh; width:100vw;
    }
    /* ==== ストーリー画面本体：1280x720固定キャンバスを画面に収める（本編index.htmlと同じ考え方） ==== */
    #stage {
        width:1280px; height:720px; flex-shrink:0; position:relative; overflow:hidden;
        background: radial-gradient(ellipse at 50% 30%, var(--bg-grad2) 0%, var(--bg-grad1) 60%, var(--bg-page) 100%);
        box-shadow: 0 0 60px rgba(255,201,92,0.08), 0 20px 60px rgba(0,0,0,0.5);
        border-radius: 24px; border: 3px solid #4a3a28;
    }
    /* テスト用の目印。実装時は背景CGに差し替える想定 */
    .bg-note {
        position:absolute; top:22px; left:50%; transform:translateX(-50%);
        font-size:0.8rem; font-weight:800; color: var(--ink-dim); letter-spacing:2px;
        background: rgba(0,0,0,0.35); padding:4px 14px; border-radius:20px; border:1px solid var(--card-bdr);
    }
    /* ==== 立ち絵（画面下、中央やや左に大きく。素材は512x512の透過PNG） ==== */
    #portrait-wrap {
        position:absolute; left:50%; bottom:150px; transform:translateX(-50%);
        width:460px; height:460px; pointer-events:none;
        filter: drop-shadow(0 18px 24px rgba(0,0,0,0.55));
    }
    #portrait {
        width:100%; height:100%; object-fit:contain; image-rendering:pixelated;
        opacity:0; transform:translateY(16px) scale(0.97);
        transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #portrait.show { opacity:1; transform:translateY(0) scale(1); }
    /* 発言していないとき（相槌の間などの表現用）は少し暗くする */
    #portrait.dim { filter: brightness(0.55) saturate(0.7); }
    /* ==== 名前プレート ==== */
    #name-plate {
        position:absolute; left:64px; bottom:214px; z-index:3;
        display:inline-flex; align-items:center; gap:8px;
        background: linear-gradient(135deg, #3a2210, #1c1108);
        border:2px solid var(--gold-dk); border-radius:14px 14px 4px 14px;
        padding:8px 26px; box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    #name-plate .crown { font-size:1.1rem; }
    #name-plate span.txt { font-size:1.25rem; font-weight:800; color: var(--gold); text-shadow:0 1px 3px rgba(0,0,0,0.6); }
    /* ==== メッセージウィンドウ ==== */
    #msg-box {
        position:absolute; left:32px; right:32px; bottom:28px; z-index:2;
        min-height:172px;
        background: rgba(20,13,8,0.88); border:2px solid var(--card-bdr); border-radius:20px;
        box-shadow: 0 -4px 0 rgba(255,255,255,0.03) inset, 0 10px 30px rgba(0,0,0,0.5);
        padding:22px 30px 18px; cursor:pointer;
    }
    #msg-text {
        font-size:1.7rem; line-height:1.6; font-weight:700; color: var(--ink);
        min-height:112px; white-space:pre-wrap;
    }
    #msg-text .cursor { display:inline-block; width:0; animation:none; }
    #next-arrow {
        position:absolute; right:22px; bottom:14px; font-size:1.1rem; color: var(--gold);
        animation: nextBounce 1s ease-in-out infinite;
    }
    @keyframes nextBounce { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(5px); } }
    /* ==== 上部バー：進行状況・スキップ（テスト用の最小限のUI） ==== */
    #top-bar {
        position:absolute; top:0; left:0; right:0; height:52px; z-index:4;
        display:flex; align-items:center; justify-content:space-between; padding:0 20px;
        background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0));
    }
    #top-bar .title { font-size:0.92rem; font-weight:800; color: var(--ink-dim); letter-spacing:2px; }
    #skip-btn {
        font-size:0.82rem; font-weight:800; color: var(--ink); background: rgba(255,255,255,0.08);
        border:1px solid var(--card-bdr); border-radius:10px; padding:6px 14px; cursor:pointer;
    }
    #skip-btn:hover { border-color: var(--gold); color: var(--gold); }
    /* ==== 表情/キャラ テストパネル（本番では不要。動作確認用に直接選べるようにする） ==== */
    #dev-panel {
        position:absolute; top:60px; right:16px; z-index:5;
        background: rgba(0,0,0,0.55); border:1px solid var(--card-bdr); border-radius:12px;
        padding:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-end;
    }
    #dev-panel .dev-row { display:flex; gap:6px; }
    #dev-panel button {
        font-family:inherit; font-size:0.72rem; font-weight:800; color: var(--ink);
        background:#1c140e; border:1px solid var(--card-bdr); border-radius:8px; padding:6px 10px; cursor:pointer;
    }
    #dev-panel button.active { border-color: var(--gold); color: var(--gold); }
    #dev-panel button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div id="stage">
    <div class="bg-note">背景CG（テスト表示のため未設定）</div>
    <div id="top-bar">
        <span class="title">魔王 vs 勇者たち・掛け合い試作</span>
        <span id="skip-btn" onclick="skipToEnd()">スキップ ▶▶</span>
    </div>

    <div id="dev-panel"></div>

    <div id="portrait-wrap">
        <img id="portrait" src="" alt="">
    </div>

    <div id="name-plate"><span class="crown" id="name-crown">👑</span><span class="txt" id="name-text">魔王</span></div>

    <div id="msg-box">
        <div id="msg-text"></div>
        <div id="next-arrow">▼</div>
    </div>
</div>

<script>
// ==== 登場キャラクター：images/kao/<ファイル接頭辞>_<表情>.png（normal/smile/angry/cry/surprise/shy/panic/grin の8表情） ====
const CHARACTERS = {
    maou:       { label:'魔王',           prefix:'maou1' },
    swordsman:  { label:'勇者（剣士・男）', prefix:'swordsman_m' },
    priest:     { label:'僧侶（女）',      prefix:'priest_f' },
    archer:     { label:'弓使い（男）',    prefix:'archer_m' },
    ice_mage:   { label:'氷の魔導士（女）', prefix:'ice_mage_f' },
};
const EXPR_LABEL = { normal:'通常', smile:'笑顔', angry:'怒り', cry:'涙', surprise:'驚き', shy:'照れ', panic:'あせり', grin:'悪い笑み' };
function exprFile(charKey, expr){ return `images/kao/${CHARACTERS[charKey].prefix}_${expr}.png`; }

// ==== テスト用の台詞データ（本編では別ファイル・JSONなどに切り出す想定） ====
// 5キャラ×8表情（通常・笑顔・怒り・涙・驚き・照れ・あせり・悪い笑み）の全40通りが最低1回ずつ出るように、玉座の間でのコメディな対決を組んである
// （難しい漢字はなるべく使わず、シリアスになりすぎないようにしてある）
const SCRIPT = [
    // ---- 第1幕：魔王のひとり練習 ----
    { char:'maou',      expr:'normal',   text:'よし、だれもいないな。今のうちに、かっこいい登場のれんしゅうをするぞ。' },
    { char:'maou',      expr:'smile',    text:'くくく……よく来たな、勇者どもよ！ ……うん、いい声が出た！' },
    { char:'maou',      expr:'grin',     text:'つぎはマントさばきだ。見よ、このワシの……バサァッ！' },
    { char:'swordsman', expr:'surprise', text:'うわっ！ 魔王がひとりでポーズしてる！' },
    { char:'maou',      expr:'surprise', text:'ひえっ！？ ゆ、勇者！？ いつからそこに！？' },
    { char:'swordsman', expr:'normal',   text:'「バサァッ！」のところからだ。' },
    { char:'maou',      expr:'shy',      text:'うう……見られてたのか……。はずかしい……。' },
    { char:'priest',    expr:'shy',      text:'い、いえ、とってもお上手でしたよ？ ぱちぱち……。' },
    { char:'maou',      expr:'angry',    text:'なぐさめるな！ ワシは、こわーい魔王なんだぞ！' },
    // ---- 第2幕：お菓子はありますか ----
    { char:'ice_mage',  expr:'normal',   text:'……ねえ。お菓子、ある？' },
    { char:'maou',      expr:'panic',    text:'お、お菓子！？ ない！ ないぞ！ 魔王城にお菓子なんて、ぜったいないぞ！' },
    { char:'ice_mage',  expr:'cry',      text:'……ない。……お菓子、たのしみに、来たのに……。' },
    { char:'maou',      expr:'surprise', text:'な、泣くな！ お菓子はないが、ほこりならたっぷりあるぞ！' },
    { char:'priest',    expr:'normal',   text:'魔王さん、それはじまんになりませんよ……。' },
    { char:'maou',      expr:'grin',     text:'ふっふっふ、これはほこりではない。魔王のオーラだ！' },
    { char:'archer',    expr:'normal',   text:'いや、どう見てもほこりだろ。' },
    { char:'swordsman', expr:'angry',    text:'おしゃべりはここまでだ！ 世界の平和のために、魔王をたおす！' },
    // ---- 第3幕：ゆるすぎる戦い ----
    { char:'archer',    expr:'smile',    text:'まかせろ！ 今日のオレは、ぜっこうちょうだぜ！' },
    { char:'archer',    expr:'grin',     text:'見てろよ。魔王のマントを、ズバッと矢でつらぬいてやる！' },
    { char:'archer',    expr:'panic',    text:'あれっ！？ 矢がない！ 家にわすれてきた！' },
    { char:'maou',      expr:'smile',    text:'あははは！ 矢がないとは、まぬけだなあ！ これはワシの勝ちだな！' },
    { char:'priest',    expr:'grin',     text:'あら、それなら……わたしが、ぽかぽかしてあげますね。' },
    { char:'swordsman', expr:'panic',    text:'ちょっ、僧侶さん！？ 回復役なのに、杖でなぐってる！？' },
    { char:'maou',      expr:'cry',      text:'いたっ！ いたい！ そ、そんなにたたかないでくれ……！' },
    { char:'priest',    expr:'surprise', text:'あら！？ 杖がぐにゃっとまがってしまいました！' },
    { char:'maou',      expr:'angry',    text:'もう怒ったぞ！ くらえ、必殺、魔王ビーム！' },
    { char:'maou',      expr:'panic',    text:'……あれ？ 出ない！ ま、まってくれ！ 今日は充電が足りないだけなんだ！' },
    { char:'ice_mage',  expr:'angry',    text:'……お菓子、ない。……ゆるさない。えいっ。' },
    { char:'maou',      expr:'surprise', text:'つ、つめたっ！ ワシの玉座が、カチコチだー！' },
    // ---- 第4幕：魔王ダウン、そして…… ----
    { char:'maou',      expr:'cry',      text:'うわあああん！ もう帰ってよー！ 勇者なんて、大きらいだー！' },
    { char:'swordsman', expr:'surprise', text:'えっ、泣いた！？ ぼ、ぼくたちが悪いのか！？' },
    { char:'priest',    expr:'angry',    text:'みなさん！ 泣いている子をいじめてはいけません！' },
    { char:'swordsman', expr:'normal',   text:'いや、いちばんなぐってたのは僧侶さんですよね？' },
    { char:'archer',    expr:'cry',      text:'ぐすっ……なんか、かわいそうになってきた……。' },
    { char:'ice_mage',  expr:'grin',     text:'……ふふ。でも、あやしい。あそこの箱から、あまいにおいがする。' },
    { char:'maou',      expr:'panic',    text:'あっ、そ、そこはだめだ！ あけたらだめだー！' },
    { char:'ice_mage',  expr:'surprise', text:'……あった。お菓子。こんなに、いっぱい。' },
    { char:'maou',      expr:'shy',      text:'じ、じつは……お客さん用に、買っておいたんだ。はずかしくて、言えなくて……。' },
    { char:'priest',    expr:'cry',      text:'まあ……ずっと、ひとりで待っていたんですね……ぐすっ。' },
    { char:'swordsman', expr:'cry',      text:'いい魔王じゃないか……。ぼく、なんだか感動して……。' },
    // ---- 第5幕：お茶会 ----
    { char:'priest',    expr:'smile',    text:'では、みなさんで、お茶にしましょう！' },
    { char:'ice_mage',  expr:'smile',    text:'……いただきます。……おいしい。' },
    { char:'ice_mage',  expr:'panic',    text:'……あ。まちがえて、お菓子まで、こおらせちゃった。' },
    { char:'maou',      expr:'smile',    text:'だいじょうぶだ！ かたいお菓子は、なめるとおいしいぞ！ ……たぶん！' },
    { char:'ice_mage',  expr:'shy',      text:'……ありがとう。また、来てもいい？' },
    { char:'maou',      expr:'smile',    text:'もちろんだ！ 毎日でも来ていいぞ！' },
    { char:'archer',    expr:'surprise', text:'あれ？ ポケットになにか……あっ、矢だ！ ここに入ってた！' },
    { char:'swordsman', expr:'smile',    text:'あははは！ 家じゃなくて、ずっとポケットの中か！' },
    { char:'archer',    expr:'angry',    text:'わ、笑うなよ！ だれだって、わすれることはあるだろ！' },
    { char:'maou',      expr:'normal',   text:'その矢、記念にワシにくれないか。かざりたい。' },
    { char:'archer',    expr:'shy',      text:'え、記念に？ ……へへ、てれるな。' },
    { char:'swordsman', expr:'grin',     text:'ところで魔王。あの壁のポスター、どう見てもぼくの顔なんだけど？' },
    { char:'maou',      expr:'angry',    text:'ち、ちがう！ あれは敵をけんきゅうするための、しりょうだ！' },
    { char:'priest',    expr:'panic',    text:'あわわ、そういえばあそこにも「勇者さまグッズ」がたくさん……！' },
    { char:'maou',      expr:'shy',      text:'……じつは、ずっと勇者のファンだったんだ。……サイン、ください。' },
    { char:'swordsman', expr:'shy',      text:'え、ぼくのファン！？ ……て、てれるなあ。' },
    { char:'swordsman', expr:'smile',    text:'しかたないな！ サイン、書いてあげるよ！' },
    { char:'ice_mage',  expr:'normal',   text:'……ねえ。おかわりは？' },
    { char:'maou',      expr:'grin',     text:'たっぷり食べるがいい！ 次までに、このオーラ……いや、ほこりをそうじしておくぞ！' },
];

let idx = 0;
const portraitEl = document.getElementById('portrait');
const nameEl = document.getElementById('name-text');
const textEl = document.getElementById('msg-text');

// タイプライター表示（1文字ずつ）。表示中にクリック/タップ/エンターで全文を即表示する
let typing = null;
function typeText(full){
    if (typing) clearInterval(typing);
    textEl.textContent = '';
    let i = 0;
    typing = setInterval(() => {
        i++;
        textEl.textContent = full.slice(0, i);
        if (i >= full.length){ clearInterval(typing); typing = null; }
    }, 55);
}
function showLine(line){
    nameEl.textContent = CHARACTERS[line.char].label;
    document.getElementById('name-crown').style.display = line.char==='maou' ? '' : 'none';
    const nextSrc = exprFile(line.char, line.expr);
    if (portraitEl.getAttribute('data-src') !== nextSrc){
        portraitEl.classList.remove('show');
        setTimeout(() => {
            portraitEl.src = nextSrc;
            portraitEl.setAttribute('data-src', nextSrc);
            portraitEl.classList.add('show');
        }, 120);
    }
    typeText(line.text);
    highlightDevPanel(line.char, line.expr);
}
function advance(){
    if (typing){ clearInterval(typing); typing = null; textEl.textContent = SCRIPT[idx].text; return; }
    idx++;
    if (idx >= SCRIPT.length) idx = 0; // テスト表示のためループする
    showLine(SCRIPT[idx]);
}
function skipToEnd(){ idx = SCRIPT.length - 1; showLine(SCRIPT[idx]); }

// ==== 開発用パネル：キャラ・表情を直接選んで見た目を確認できるようにする（本番の会話進行には使わない） ====
function highlightDevPanel(charKey, expr){
    document.querySelectorAll('#dev-panel [data-char]').forEach(b => b.classList.toggle('active', b.dataset.char===charKey));
    document.querySelectorAll('#dev-panel [data-expr]').forEach(b => b.classList.toggle('active', b.dataset.expr===expr));
}
function buildDevPanel(){
    const wrap = document.getElementById('dev-panel');
    const charRow = Object.keys(CHARACTERS).map(k =>
        `<button data-char="${k}" onclick="previewChar('${k}')">${CHARACTERS[k].label}</button>`
    ).join('');
    const exprRow = Object.keys(EXPR_LABEL).map(k =>
        `<button data-expr="${k}" onclick="previewExpr('${k}')">${EXPR_LABEL[k]}</button>`
    ).join('');
    wrap.innerHTML = `<div class="dev-row">${charRow}</div><div class="dev-row">${exprRow}</div>`;
}
function previewExpr(expr){
    const line = SCRIPT[idx];
    showLine({ char: line.char, expr, text: line.text });
}
function previewChar(charKey){
    const line = SCRIPT[idx];
    showLine({ char: charKey, expr: line.expr, text: line.text });
}

buildDevPanel();
showLine(SCRIPT[0]);

// ==== 送り方：画面のどこをクリック/タップしても、またはエンターキーでも進む ====
// （1回目＝全文をすぐ表示、表示済みなら2回目＝次のセリフへ）。開発用パネルとスキップボタンは邪魔しない
document.addEventListener('click', (ev) => {
    if (ev.target.closest('#dev-panel') || ev.target.closest('#skip-btn')) return;
    advance();
});
document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    advance();
});

// 画面サイズが変わっても縦横比(1280×720)を保ったまま拡大縮小する（本編index.htmlと同じ仕組み）
function scaleStage(){
    const el = document.getElementById('stage');
    const w = window.innerWidth, h = window.innerHeight;
    if (w <= 0 || h <= 0) return;
    el.style.transform = `scale(${Math.min(w / 1280, h / 720)})`;
}
window.addEventListener('resize', scaleStage);
window.addEventListener('load', scaleStage);
scaleStage();
requestAnimationFrame(scaleStage);
</script>
</body>
</html>
