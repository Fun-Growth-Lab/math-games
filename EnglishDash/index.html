.end-box.over .end-stat.s1 .vl { color:#4f4868; }

<body>
<div id="container">

  <!-- タイトル -->
  <div id="title-screen" class="screen">
    <div class="deco-tile" style="left:70px;top:90px;--r:-8deg;--d:0s;background:linear-gradient(160deg,#ff9a8b,#ff6b6b)">A</div>
    <div class="deco-tile" style="left:70px;top:440px;--r:6deg;--d:.7s;background:linear-gradient(160deg,#ffe066,#f4b400)">B</div>
    <div class="deco-tile" style="right:80px;top:100px;--r:7deg;--d:1.2s;background:linear-gradient(160deg,#6bdff2,#1fa8c9)">C</div>
    <div class="deco-tile" style="right:70px;top:450px;--r:-5deg;--d:.3s;background:linear-gradient(160deg,#c2a4ff,#9160f7)">Z</div>
    <div class="title-box">
      <div class="title-top">FUN &amp; GROWTH LAB</div>
      <div class="title-h1">ワードランナー</div>
      <div class="title-sub" data-i18n="title_sub"></div>
      <button id="btn-start" class="btn b-orange btn-xl" data-i18n="btn_play" onclick="openMode()"></button>
      <div class="title-grid">
        <button id="btn-rank" class="btn b-teal" data-i18n="btn_rank" onclick="openRanking('title-screen')"></button>
        <button id="btn-words" class="btn b-purple" data-i18n="btn_words" onclick="openWordList()"></button>
        <button id="btn-tut" class="btn b-green" data-i18n="btn_tut" onclick="startTutorial()"></button>
        <button id="btn-set" class="btn b-blue" data-i18n="btn_set" onclick="openSettings()"></button>
      </div>
      <button id="btn-stats" class="btn b-orange" style="min-width:230px;padding:9px 16px;font-size:1rem" data-i18n="btn_stats" onclick="openStats()"></button>
      <button id="btn-name" class="btn b-teal" style="min-width:230px;padding:9px 16px;font-size:1rem" data-i18n="name_btn" onclick="openNameScreen()"></button>
      <button id="btn-home" class="btn b-pink" style="min-width:230px;padding:9px 16px;font-size:1rem" data-i18n="btn_list" onclick="location.href='../index.html'"></button>
    </div>
  </div>

  <!-- ステージ選択 -->
  <!-- 遊びかたの分岐 -->
  <div id="mode-screen" class="screen hidden">
    <button class="btn back-btn b-pink" data-i18n="btn_back" onclick="showScreen('title-screen')"></button>
    <div class="h2" data-i18n="mode_title"></div>
    <div class="mrow">
      <button class="mcard" id="mc-grade" style="--gc:#ffa13d;--gd:#c4601a" onclick="openGradeSel()"><div class="mart" id="mart-grade"></div><div class="mbody"><div class="mname" data-i18n="mode_grade"></div><div class="msub" data-i18n="mode_grade_sub"></div></div></button>
      <button class="mcard" id="mc-theme" style="--gc:#8a5cf0;--gd:#5b32b0" onclick="openThemeSel()"><div class="mart" id="mart-theme"></div><div class="mbody"><div class="mname" data-i18n="mode_theme"></div><div class="msub" data-i18n="mode_theme_sub"></div></div></button>
    </div>

  <!-- テーマ選択 -->

  <div id="select-screen" class="screen hidden">

  <!-- プレイ -->

        <div class="pill"><b id="hud-no">1</b> / <span id="hud-total">20</span></div>

<script>
// ================= 設定・文言 =================
const MAX_MISS = 10;
const Q_COUNT = 20;
const SAVE_KEY = 'fgl_english_dash';
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// --- 単語ごとのバッジ(ミスなしで打てた単語に付く): 2=金(ヒントなしの「ちょうせん」) / 1=銀(「れんしゅう」またはヒントありの「ちょうせん」) ---
const MEDAL_KEY = 'fgl_english_dash_medals';
function loadMedals() { const o = lsGet(MEDAL_KEY, null); return (o && typeof o === 'object') ? o : {}; }
function giveMedal(en, level) { const m = loadMedals(); if ((m[en] | 0) >= level) return; m[en] = level; lsSet(MEDAL_KEY, m); }

// --- 個人の記録(この端末のブラウザだけに保存。1ブラウザに1セーブ) ---
const STATS_KEY = 'fgl_english_dash_stats';
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function loadStats() {
    const o = lsGet(STATS_KEY, null) || {};
    return { days: Array.isArray(o.days) ? o.days : [], runs: o.runs | 0, clears: o.clears | 0, words: o.words | 0, best: o.best | 0, gems: o.gems | 0 };
}
// いまの連続日数: 今日あそんでいれば今日から、まだなら昨日から、さかのぼって数える(昨日もあそんでいなければ0)
function calcStreak(days) {
    const set = new Set(days), d = new Date();
    if (!set.has(ymd(d))) { d.setDate(d.getDate() - 1); if (!set.has(ymd(d))) return 0; }
    let n = 0; while (set.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
}
function bestStreakOf(days) {
    const a = days.slice().sort(); let best = 0, run = 0, prev = null;
    a.forEach(x => { const dt = new Date(x + 'T00:00:00'); if (prev && Math.round((dt - prev) / 86400000) === 1) run++; else run = 1; if (run > best) best = run; prev = dt; });
    return best;
}
// 1回のチャレンジ(クリアでもゲームオーバーでも)が終わったときに記録する
function recordRun(cleared, words, gems) {
    const st = loadStats(), today = ymd();
    let newDay = false;
    if (st.days.indexOf(today) < 0) { st.days.push(today); st.days.sort(); if (st.days.length > 3000) st.days = st.days.slice(-3000); newDay = true; }
    st.runs++; if (cleared) st.clears++; st.words += Math.max(0, words | 0); st.gems += Math.max(0, gems | 0);
    const streak = calcStreak(st.days);
    st.best = Math.max(st.best, streak, bestStreakOf(st.days));
    lsSet(STATS_KEY, st);
    return { newDay, streak, gemTotal: st.gems };
}

// --- 効果音(WebAudioで合成。音声ファイルは使わない)。音量は 0〜10 の11段階(0 = OFF)。保存キーは fgl_english_dash_volume ---
const BGM = FGLBgm.create({ key: 'englishdash' });
FGLBgm.mountGameButton(BGM, { corner: 'br', sfx: { get volume() { return SFX.volume; }, get lastVolume() { return SFX.lastVolume; }, setVolume: n => SFX.setVolume(n), toggleMute() { SFX.setVolume(SFX.volume > 0 ? 0 : (SFX.lastVolume || 5)); }, onChange() {} }, sfxApply: false, getLang: () => settings.lang });   // ⚙ 設定(ゲーム中もBGM・効果音の音量を変えられる)
FGLBgm.settingsButton(BGM, { parent: '#set-bgm', getLang: () => settings.lang });   // BGM設定(🎵ボタン→パネル)。効果音は自前なのでパネルには出さない
const SFX = (() => {
    let ac = null, count = 0, vol = 5, lastVol = 5;
    try { const v = localStorage.getItem('fgl_english_dash_volume'); if (v !== null) vol = Math.max(0, Math.min(10, parseInt(v, 10) || 0)); } catch (e) {}
    function audio() {
        if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
        if (ac.state === 'suspended') ac.resume();
        return ac;
    }
    function tone(freq, t0, dur, type, v0, slideTo) {
        const a = audio(); if (!a) return;
        const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, (v0 || 0.12) * Math.pow(vol / 5, 1.4)), t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + dur + 0.05);
    }
    const seq = (notes, step, type, v, len) => notes.forEach((f, i) => tone(f, i * step, len || step * 1.7, type, v));
    const C5 = 523, E5 = 659, G5 = 784, C6 = 1047, E6 = 1319, G6 = 1568;
    const sounds = {
        click: () => tone(720, 0, 0.05, 'triangle', 0.07),
        type: () => tone(1100, 0, 0.035, 'triangle', 0.06),                       // 正しいキー
        ok: () => { tone(880, 0, 0.07, 'triangle', 0.1); tone(1319, 0.06, 0.14, 'triangle', 0.1); },   // 1語打てた
        miss: () => tone(260, 0, 0.16, 'square', 0.07, 150),                      // まちがい
        hint: () => seq([G5, E5, C5], 0.07, 'sine', 0.1, 0.12),                   // ヒント(HPがへる)
        error: () => { tone(220, 0, 0.1, 'square', 0.06); tone(165, 0.09, 0.14, 'square', 0.06); },
        beep: () => tone(660, 0, 0.12, 'square', 0.07),                           // カウントダウン
        go: () => { tone(988, 0, 0.1, 'square', 0.08); tone(1319, 0.09, 0.28, 'square', 0.08); },
        star: () => tone(1175, 0, 0.18, 'triangle', 0.1),
        get: () => seq([784, 988, 1175], 0.06, 'sine', 0.12),
        coin: () => { tone(988, 0, 0.08, 'square', 0.06); tone(1319, 0.07, 0.18, 'square', 0.06); },
        fail: () => { tone(400, 0, 0.5, 'sawtooth', 0.07, 90); tone(196, 0.45, 0.45, 'triangle', 0.08, 110); },
        fanfare: () => { seq([C5, C5, C5, G5, E5, G5, C6], 0.12, 'square', 0.07, 0.19); tone(C6, 0.9, 0.6, 'triangle', 0.1); tone(E6, 0.9, 0.6, 'triangle', 0.08); },
        perfect: () => { seq([C5, E5, G5, C6], 0.09, 'square', 0.07); tone(G6, 0.4, 0.5, 'triangle', 0.1); seq([C6, E6, G6, C6 * 2], 0.1, 'triangle', 0.08); }
    };
    return {
        play(name) { if (vol <= 0) return; count++; try { if (sounds[name]) sounds[name](); } catch (e) {} },
        get count() { return count; },
        get volume() { return vol; },
        get lastVolume() { return lastVol; },
        setVolume(n) {   // 聞いて確かめられるよう、0より大きいときは短い音を鳴らす
            n = Math.max(0, Math.min(10, Math.round(n)));
            if (vol > 0) lastVol = vol;
            vol = n;
            try { localStorage.setItem('fgl_english_dash_volume', String(vol)); } catch (e) {}
            if (vol > 0) this.play('coin');
        },
        unlock() { if (vol > 0) audio(); }
    };
})();
// ボタンをおしたときの音(キーボードの絵のキーは、打つ音が別にあるので除く)。ブラウザの決まりで、最初のタッチ/キーで音を使えるようにする
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button, .gcard, .mcard'); if (b && !b.classList.contains('key')) SFX.play('click'); }, true);
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => SFX.unlock(), { capture: true }));

        if (i < 3) tr.className = 'top' + (i + 1);
        const cs = (d.turns || 0) * 100 + (d.stage_score || 0);
        [i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1, FGLName.display(d.player_name), d.point_score + ' / ' + rankTotal(), fmtTime(cs)].forEach((x, j) => {
            const td = document.createElement('td'); td.textContent = x; if (j === 1) td.className = 'nm'; tr.appendChild(td);
        });
        body.appendChild(tr);
    });
}

// ================= 単語一覧 =================
let wlGrade = 'e3', wlFrom = 'title-screen';
function openWordList(g, from) { wlGrade = (g && (GRADE_META[g] || g === 'all' || isTheme(g))) ? g : (selKind === 'theme' && !from ? selT.grade : sel.grade); wlFrom = from || 'title-screen'; showScreen('words-screen'); }
function renderWordList() {
    const th = isTheme(wlGrade);
    $('wl-kind').innerHTML = rbtn('gcb', 'grade', !th, '<span class="nm">📖 ' + t('wl_grade') + '</span>', '--c1:#5cbf2a;--c2:#3a8a14;--c3:#2a6a0e') + rbtn('gcb', 'theme', th, '<span class="nm">📖 ' + t('wl_theme') + '</span>', '--c1:#ee5b9d;--c2:#a82d68;--c3:#7a1f4c');
    $('wl-kind').querySelectorAll('.cbtn').forEach(el => { el.onclick = () => { wlGrade = el.dataset.id === 'theme' ? (isTheme(selT.grade) ? selT.grade : THEME_IDS[0]) : (GRADE_META[sel.grade] || sel.grade === 'all' ? sel.grade : 'e3'); renderWordList(); }; });
    chipRow($('wl-tabs'), (th ? THEME_IDS : SEL_IDS).map(id => ({ id, label: gshort(id) + '<small>' + t('words_n', { n: wcount(id) }) + '</small>', color: [gmeta(id).c, gmeta(id).d] })), wlGrade, v => { wlGrade = v; renderWordList(); });
    $('wl-grid').style.maxHeight = th ? '296px' : '372px';
    const m = gmeta(wlGrade);
    const grid = $('wl-grid'); grid.style.setProperty('--gc', m.c); grid.style.setProperty('--gd', m.d);
    grid.innerHTML = '';
    const medals = loadMedals();
    wlist(wlGrade).forEach(w => {
        const lv = medals[w.en] | 0, d = document.createElement('div'); d.className = 'wl-item';
        d.innerHTML = '<div class="e"></div><div class="j"></div>' + (lv ? '<span class="md">' + (lv >= 2 ? '🏆' : '') + '⭐</span>' : '');
        d.querySelector('.e').textContent = enOf(w.en); d.querySelector('.j').textContent = jaOf(w);
        grid.appendChild(d);
    });
    grid.scrollTop = 0;
    $('wl-legend').innerHTML = '<span>⭐ ' + t('wl_silver') + '</span><span>🏆 ' + t('wl_gold') + '</span><button id="wl-md-reset">' + t('md_reset') + '</button>';
    $('wl-md-reset').onclick = () => askConfirm(() => { try { localStorage.removeItem(MEDAL_KEY); } catch (e) {} renderWordList(); }, { title: t('md_cf_title'), msg: t('md_cf_msg') });
    $('wl-note').textContent = th ? t('wl_note_theme') : t('wl_note');
}

// ================= せってい =================
function renderSound() {
    const v = SFX.volume;
    $('set-sound-lab').textContent = t('set_sound') + '　' + v + ' / 10';
    let h = '<button class="mute ' + (v > 0 ? 'on' : 'off') + '" data-v="mute">' + (v > 0 ? '🔊' : '🔇') + '</button>';
    for (let i = 0; i < 10; i++) h += '<button class="bar ' + (i < v ? (i < 4 ? 'g' : i < 7 ? 'y' : 'o') : '') + '" data-v="' + (i + 1) + '"></button>';
    const box = $('set-vol'); box.innerHTML = h;
    box.querySelectorAll('button').forEach(b => { b.onclick = () => { if (b.dataset.v === 'mute') SFX.setVolume(SFX.volume > 0 ? 0 : (SFX.lastVolume || 5)); else SFX.setVolume(parseInt(b.dataset.v, 10)); renderSound(); }; });
}
function renderSettings() {
    renderSound();
    chipRow($('set-lang'), [{ id: 'ja', label: t('lang_ja') }, { id: 'easy', label: t('lang_easy') }], settings.lang, v => { settings.lang = v; saveSettings(); refreshAll(); }, ['#ff7a45', '#c8470f']);
    chipRow($('set-time'), [{ id: '1', label: t('time_on') }, { id: '0', label: t('time_off') }], settings.showTime ? '1' : '0', v => { settings.showTime = v === '1'; saveSettings(); refreshAll(); }, ['#17b8a6', '#0f8f81']);
    chipRow($('set-case'), [{ id: 'upper', label: t('case_upper') }, { id: 'lower', label: t('case_lower') }], settings.caseMode, v => { settings.caseMode = v; saveSettings(); refreshAll(); }, ['#8a5cf0', '#5b32b0']);
}

// ================= チュートリアル =================
function setGuide(n) { G.course.guide = n; renderEn(); updateKbMode(); }
function startTutorial() {
    if (!window.FGLTutorial) return;
    const ws = [{ en: 'dog', ja: '犬' }, { en: 'cat', ja: 'ねこ' }, { en: 'sun', ja: '太陽' }];
    G = { words: ws, total: 3, idx: 0, pos: 0, miss: 0, typos: 0, hints: 0, res: [], wordMiss: false, correct: 0, t0: performance.now(), running: true, allow: false, tutorial: true, course: { mode: 'random', guide: 2, grade: 'e3' } };
    applyTheme('e3');
    showScreen('play-screen');
    setupPlay();
    showWord();
    tick();
    document.querySelector('#hud .quit').style.display = 'none';
    FGLTutorial.begin({ root: '#container', getLang: () => settings.lang, exitPos: 'left' });
    const T = (ja, easy) => ({ ja, easy });
    FGLTutorial.run([
        { type: 'say', target: null, pos: 'middle', overview: true, text: T('これがゲーム画面だよ。上に「HP」と「進み具合」と「タイム」、まん中に「日本語」、下に「キーボード」があるよ。順番に説明するね。', 'これがゲームがめんだよ。うえに「HP」と「すすみぐあい」と「タイム」、まんなかに「にほんご」、したに「キーボード」があるよ。じゅんばんに せつめいするね。') },
        { type: 'say', target: '#hp', text: T('まちがえたキーを押すと、HPが1つ減るよ。10回まちがえてHPが0になるとゲームオーバー！てきとうに押さず、ていねいに打とう。', 'まちがえたキーを おすと、HPが 1つ へるよ。10かい まちがえて HPが 0に なると ゲームオーバー！てきとうに おさず、ていねいに うとう。') },
        { type: 'say', target: '#q-card', text: T('真ん中に出る日本語の意味の英単語を、キーボードで打つよ。', 'まんなかに でる にほんごの いみの えいたんごを、キーボードで うつよ。') },
        { type: 'run', fn: () => { setGuide(2); G.allow = true; } },
        { type: 'do', target: ['#q-card', '#kb'], until: () => G.idx >= 1, text: T('「キーも見える」のヒントだよ。オレンジに光るキーを押して「dog」と打ってみよう！', '「キーも みえる」の ヒントだよ。オレンジに ひかる キーを おして「dog」と うってみよう！') },
        { type: 'run', fn: () => { G.allow = false; setGuide(1); } },
        { type: 'say', target: '#q-en', text: T('次は「英語が見える」のヒント。英単語は出るけど、キーの場所は光らないよ。', 'つぎは「えいごが みえる」の ヒント。えいたんごは でるけど、キーの ばしょは ひからないよ。') },
        { type: 'run', fn: () => { G.allow = true; } },
        { type: 'do', target: ['#q-card', '#kb'], until: () => G.idx >= 2, text: T('灰色の文字を見ながら「cat」と打ってみよう。打った文字は黒くなるよ。', 'はいいろの もじを みながら「cat」と うってみよう。うった もじは くろくなるよ。') },
        { type: 'run', fn: () => { G.allow = false; setGuide(0); } },
        { type: 'say', target: '#q-card', text: T('最後はヒントなし。英単語は出ないよ。おぼえている英単語を打ってね。打った文字だけが表示されるよ。', 'さいごは ヒントなし。えいたんごは でないよ。おぼえている えいたんごを うってね。うった もじだけが ひょうじされるよ。') },
        { type: 'say', target: '#space-key', text: T('ヒントなしで英語を思い出せないときは、このボタン（スペースキーでもOK）で英単語を見られるよ。でも、HPが3つ減るよ。', 'ヒントなしで えいごを おもいだせないときは、この ボタン（スペースキーでも OK）で えいたんごを みられるよ。でも、HPが 3つ へるよ。') },
        { type: 'run', fn: () => { G.allow = true; } },
        { type: 'do', target: ['#space-key', '#q-card', '#kb'], until: () => G.idx >= 3, text: T('「太陽」は「sun」だよ。打ってみよう！思い出せないふりをして、表示ボタンを押してみてもいいよ。', '「たいよう」は「sun」だよ。うってみよう！おもいだせない ふりをして、ひょうじボタンを おしてみても いいよ。') },
        { type: 'run', fn: () => { G.allow = false; } },
        { type: 'say', target: null, pos: 'middle', text: T('「れんしゅう」は、先に5語か10語を見ておぼえてからスタートするコースだよ。最後は「ちょうせん」で しあげに挑戦！ランキングは、コースとヒントのモードごとにあるよ。', '「れんしゅう」は、さきに 5ごか 10ごを みて おぼえてから スタートする コースだよ。さいごは「ちょうせん」で しあげに ちょうせん！ランキングは、コースと ヒントの モードごとに あるよ。') }
    ]);
}

// ================= 起動 =================
(function init() {
    const s = lsGet(SAVE_KEY + '_sel2', null);
    if (s && (GRADE_META[s.grade] || s.grade === 'all') && MODE_IDS.includes(s.mode) && GUIDE_IDS.includes(s.guide)) sel = s;
    const st = lsGet(SAVE_KEY + '_selT2', null);
    if (st && THEME_IDS.includes(st.grade) && GUIDE_IDS.includes(st.guide)) selT = Object.assign({ mode: 'random' }, st);
    applyStatic();
})();
</script>
