<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジュークボックス | Fun & Growth Lab</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        min-height: 100vh;
        font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
        background: radial-gradient(circle at 50% -10%, #4a3a9e 0%, #231c58 55%, #14103a 100%) fixed;
        color: #fff;
        padding: 16px 12px 40px;
    }
    .wrap { max-width: 780px; margin: 0 auto; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .back {
        display: inline-block; text-decoration: none; color: #241c4e; font-weight: 900; font-size: .95rem;
        background: linear-gradient(#fff, #e2dbff); border: 3px solid #0a0826; border-radius: 12px;
        padding: 5px 14px; box-shadow: 0 3px 0 #0a0826;
    }
    .back:active { transform: translateY(3px); box-shadow: none; }
    .hero { text-align: center; margin: 6px 0 18px; }
    .hero .jb { font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
    .hero h1 { margin: 6px 0 2px; font-size: 1.9rem; color: #ffc93d; text-shadow: 0 3px 0 #0a0826; letter-spacing: .04em; }
    .hero p { margin: 0; font-weight: 800; font-size: .95rem; opacity: .85; }
    .note { text-align: center; font-size: .8rem; opacity: .65; font-weight: 700; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
    <div class="top"><a class="back" href="../index.html" id="back">◀ もどる</a></div>
    <div class="hero">
        <div class="jb">🎶</div>
        <h1 id="jb-h1">ジュークボックス</h1>
        <p id="jb-sub">ゲームのBGMを きょくだけ きけるよ</p>
    </div>
    <div id="bgm-host"></div>
    <div class="note" id="jb-note">「🌐 BGMを全ゲームに適用」をおすと、いま えらんでいる音量と曲が すべてのゲームで つかわれます</div>
</div>
<script src="../fgl-sfx.js?v=5"></script>
<script src="../fgl-bgm.js?v=8"></script>
<script>
(function () {
    var lang = 'ja';
    try { lang = localStorage.getItem('fgl_top_lang') || 'ja'; } catch (e) {}
    if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.title = 'Jukebox | Fun & Growth Lab';
        document.getElementById('back').textContent = '◀ Back';
        document.getElementById('jb-h1').textContent = 'Jukebox';
        document.getElementById('jb-sub').textContent = 'Listen to the music from our games';
        document.getElementById('jb-note').textContent = 'Press "Apply BGM to all games" to use the volume and tracks you chose in every game.';
    }
    var BGM = FGLBgm.create({ key: 'jukebox' });
    FGLBgm.settingsUI('#bgm-host', { bgm: BGM, getLang: function () { return lang; } });
})();
</script>
</body>
</html>
