    <style>

        .tsv { background:linear-gradient(135deg,#f7f9ff,#b2bcdc 55%,#7787b0); box-shadow:inset 0 -6px 0 rgba(0,0,0,.14); }

        .dc.unk::before { content:''; position:absolute; inset:15px 14px; border-radius:8px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 3px, transparent 3px 9px); }

        #confirm-dialog { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:60; width:400px; box-sizing:border-box; padding:22px 24px 20px; text-align:center; border-radius:24px;
            background:linear-gradient(180deg,#fffef4,#fff2c6); border:6px solid #ffd24a; box-shadow:0 0 0 5px #fff, 0 18px 40px rgba(0,0,0,.5); animation: endPop .35s cubic-bezier(.2,1.4,.4,1); }

<script>
// ---- このゲーム(固有)の設定 ----
const RUN_LIST = [
    { id: 'normal', color: '#2fa86a' },
    { id: 'locked', color: '#7d7f92', locked: true },
];
const GAME = {
    sbGame: 'math_braves_multiplication_v2',
    keys: { lang: 'mb_mul_lang', lastStar: 'mb_mul_last_star', ranking: d => `math_braves_multi_ranking_v2_${d}`, clearCount: d => `math_braves_multi_clears_v2_${d}` },
    stageCount: MAX_FLOOR,
    stageThemes: [{ c: '#9acd4a' }, { c: '#2fbf71' }, { c: '#e8a317' }, { c: '#4aa0f0' }, { c: '#ef6a4a' }],
    // タイトルのシルエットは、ビルではなくお城の城壁(ぎざぎざ)にする
    titleSkyline: (seed, lo, hi, step) => {
        const pts = ['0% 100%']; let x = 0, r = seed;
        while (x < 100) {
            r = (r * 9301 + 49297) % 233280;
            const h = lo + (r / 233280) * (hi - lo), w = step * (1.2 + (r % 5) / 10), m = w / 5, top = 100 - h;
            pts.push(`${x}% ${top}%`);
            for (let k = 0; k < 3; k++) pts.push(`${x + m * 2 * k}% ${top - 7}%`, `${x + m * (2 * k + 1)}% ${top - 7}%`, `${x + m * (2 * k + 1)}% ${top}%`, `${x + m * (2 * k + 2)}% ${top}%`);
            x += w;
        }
        pts.push('100% 100%');
        return 'polygon(' + pts.join(',') + ')';
    },
    titleBots: [[4, 24, 545, 1.0, '#ef6a4a'], [0, 1130, 545, 1.0, '#4aa0f0']],
    // タイトルの主役: 大きな数字カードの扇(まん中の金のカードが答え)と演算のバッジ
    // タイトルの主役: ダンジョンの盤(パネル)。かけざんのカードで作った四角(3×2＝6マス)が光り、ロボのパネル・カギ・ドアがある
    titleHero: () => {
        const X = 190, Y = 214, P = 98, W = 88;
        const key = '<svg viewBox="0 0 40 40" width="54" height="54"><circle cx="13" cy="13" r="8" fill="none" stroke="#ffd24a" stroke-width="5"/><path d="M19 19 L35 35 M29 29 L34 24 M24 24 L28 20" stroke="#ffd24a" stroke-width="5" stroke-linecap="round" fill="none"/></svg>';
        const door = '<svg viewBox="0 0 40 48" width="56" height="64"><path d="M5 46V20a15 15 0 0 1 30 0v26z" fill="#a8703a" stroke="#4a2c10" stroke-width="3"/><path d="M20 6v40M5 28h30" stroke="#6a4020" stroke-width="2"/><circle cx="29" cy="31" r="2.6" fill="#ffd24a"/></svg>';
        const map = [[0, 1, 0, 3, 4], [2, 2, 2, 0, 1], [2, 2, 2, 5, 0]];
        let h = FH.glow(60, 190, 640, 'rgba(60,220,140,0.35)'), mons = '';
        map.forEach((row, r) => row.forEach((k, c) => {
            const l = X + c * P, t = Y + r * P;
            if (k === 2) h += FH.cell('', l, t, W, W, 'linear-gradient(160deg,#fff7b8,#ffc93d 60%,#e8a317)', { style: 'border:3px solid #fff3b0;box-shadow:0 0 22px 4px rgba(255,216,77,.8), 0 6px 0 #a35c00;' });
            else if (k === 1) { h += FH.cell('', l, t, W, W, 'linear-gradient(160deg,#86a094,#557065 55%,#3d554a)', { style: 'border:2px solid #b4cbc0;box-shadow:0 6px 0 #26382f;' }); mons += FH.mon(monHTML(r % 2 ? 0 : 1), l + 6, t + 2, 0.5, r % 2 ? '#2fbf71' : '#4aa0f0', { bob: false }); }
            else h += FH.cell(k === 3 ? key : k === 4 ? door : k === 5 ? '＋' : '', l, t, W, W, 'linear-gradient(180deg,#27463c,#1b3029)', { fs: 40, style: 'border:2px solid rgba(255,255,255,.18);box-shadow:0 6px 0 rgba(0,0,0,.35);color:rgba(255,255,255,.35);' });
        }));
        return h + mons
            + FH.hp(830, 206, 250, 100, '') + FH.mon(monHTML(2), 820, 240, 1.75, '#2fbf71')
            + FH.star('✦', 90, 250, 28, 0) + FH.star('✧', 1180, 240, 26, 0.8);
    },
    runArt: { shape: 2, color: '#2fbf71' },
    // ゲーム画面(左右パネル+盤面)
    gameLayerHTML: `
    <div id="game-layer">
        <div id="left-panel">
            <div class="sp-brand"><i class="ico" data-ico="robot"></i><span data-i18n="subject_badge">かけざん</span><i class="ico" data-ico="robot"></i></div>
            <div class="sp-mode"><span class="rn" id="sp-run"></span><span class="df" id="sp-diff"></span></div>
            <div class="sp-card sp-player">
                <div class="av" id="sp-av">な</div>
                <div class="who"><div class="sp-lb" data-i18n="label_player" data-noemo>プレーヤー</div><span id="disp-player-name">ななしさん</span></div>
            </div>
            <div class="sp-card">
                <div class="sp-lb"><i class="ico" data-ico="flag"></i><span data-i18n="label_stage" data-noemo>フロア</span><b class="rt-num" id="disp-difficulty-label"></b></div>
                <div class="rt-list" id="sp-route"></div>
            </div>
            <div class="sp-card dg-st">
                <div class="dg-row"><span class="ic" data-itemimg="14"></span><span class="lb" data-i18n="label_ap" data-noemo>のこりAP</span><b id="disp-time">20</b></div>
                <div class="dg-row"><span class="ic" data-itemimg="11"></span><span class="lb" data-i18n="label_key" data-noemo>カギ</span><b id="disp-key">0/1</b></div>
                <div class="dg-row"><span class="ic"><i class="ico" data-ico="medal"></i></span><span class="lb" data-i18n="label_level" data-noemo>レベル</span><b id="disp-level">1</b></div>
                <div class="dg-exp"><div class="bar"><i id="exp-bar-fill"></i></div><span id="disp-exp-text">0 / 200</span></div>
            </div>

<script src="../braves-run.js?v=20261200"></script>
<script>
function startTutorial() {
    FGLTutorial.begin({ root: '#container', getLang: () => currentLang });
    state.difficulty = 'EASY';
    CONFIG = Object.assign({}, PRESET_EASY);
    initGame();
    // 手順どおりに進むよう、手札とパネルを決めた値にする(最初に見えている十字の5マス)
    [3, 4, 2, 2, 5].forEach((v, i) => { const c = state.cards[i]; c.value = v; c.isJoker = false; c.jokerChosen = false; c.stackCount = 1; c.multiplier = 1; });
    state.grid.forEach(c => { c.item = null; });
    const setPanel = (idx, value, gems) => { const c = state.grid[idx]; c.value = value; c.gemCount = gems; c.isEnemy = true; };
    setPanel(12, 12, 3); state.grid[12].item = 'KEY';
    setPanel(7, 6, 2); setPanel(11, 8, 2); setPanel(13, 9, 1); setPanel(17, 4, 2);
    updateUI();
    const CV = '#gameCanvas';
    const cv = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [canvas.width, canvas.height], pad: 6 });
    const cellR = (r, c) => { const g = getGridPos(r, c); return cv(g.x, g.y, g.w, g.h); };
    const gridR = () => { const cw = state.boardW / GRID_COLS; return cv(state.boardX, state.gridAreaY, state.boardW, cw * 0.95 * GRID_ROWS); };
    const handR = () => { const a = state.cards[0], b = state.cards[4]; return cv(a.baseX, a.baseY, b.baseX + b.width - a.baseX, a.height); };
    const twoR = () => { const a = state.cards[0], b = state.cards[1]; return cv(a.baseX, a.baseY, b.baseX + b.width - a.baseX, a.height); };
    const playR = () => { const g = getGridPos(2, 2), c = state.cards[1]; return cv(Math.min(g.x, c.baseX) - 10, g.y, Math.max(g.w, c.width) + 60, c.baseY + c.height - g.y); };
    const trashR = () => { const t = state.trashRect; return cv(t.x, t.y, t.w, t.h); };
    // 手順どおりの操作だけ許すための、ぴったりの範囲(余白なし)
    const cardP = (c) => ({ sel: CV, rect: [c.baseX, c.baseY, c.width, c.height], of: [canvas.width, canvas.height], pad: 0 });
    const cellP = (r, c) => () => { const g = getGridPos(r, c); return { sel: CV, rect: [g.x, g.y, g.w, g.h], of: [canvas.width, canvas.height], pad: 0 }; };
    const settle = () => FGLTutorial.wait(() => !state.dragInfo && !state.inputLocked, 6000);
    FGLTutorial.run([
        { type: 'say', target: gridR, pos: 'bottom', text: {
            ja: 'ここがダンジョン。5×5マスのパネルが並んでいるよ。パネルには「数字」と「⭐」があって、まだ見えていないマスはとなりのパネルを壊すと見えてくるよ。',
            easy: 'ここがダンジョン。5×5マスのパネルがならんでいるよ。パネルには「すうじ」と「⭐」があって、まだみえていないマスはとなりのパネルをこわすとみえてくるよ。',
            en: 'This is the dungeon: a 5×5 grid of panels. Each panel has a number and ⭐ stars. Hidden squares are revealed when you break a panel next to them.' } },
        { type: 'say', target: () => cellR(2, 2), pos: 'bottom', text: {
            ja: 'まん中のパネルは「12」。手札で「12」をぴったり作ってぶつけると、このパネルを壊せるよ！ 得点は「数字 × ⭐の数」。',
            easy: 'まんなかのパネルは「12」。てふだで「12」をぴったりつくってぶつけると、このパネルをこわせるよ！ とくてんは「すうじ × ⭐のかず」。',
            en: 'The center panel is "12". Make exactly 12 with your hand and hit it to break it! Score = number × ⭐ count.' } },
        { type: 'say', target: handR, pos: 'top', text: {
            ja: 'これが手札。カードをドラッグして、ほかのカードに重ねると「かけざん」になるよ。',
            easy: 'これがてふだ。カードをドラッグして、ほかのカードにかさねると「かけざん」になるよ。',
            en: 'These are your cards. Drag one onto another card and their numbers are multiplied.' } },
        { type: 'do', target: twoR, pos: 'top', until: () => state.cards.some(c => c && c.value === 12 && c.stackCount === 2),
          only: { from: () => cardP(state.cards[0]), to: () => cardP(state.cards[1]), hint: {
            ja: '左の「3」のカードを、となりの「4」のカードに重ねてみよう！',
            easy: 'ひだりの「3」のカードを、となりの「4」のカードにかさねてみよう！',
            en: 'Drag the "3" card on the left onto the "4" card next to it!' } }, text: {
            ja: '12 を作ろう！ 左の 3 のカードを、となりの 4 のカードに重ねてみて。3 × 4 = 12 になるよ。',
            easy: '12 をつくろう！ ひだりの 3 のカードを、となりの 4 のカードにかさねてみて。3 × 4 = 12 になるよ。',
            en: 'Let\'s make 12! Drag the 3 card onto the 4 card next to it. 3 × 4 = 12.' } },
        { type: 'run', fn: settle },
        { type: 'say', target: () => { const c = state.cards.find(k => k && k.value === 12); return c ? cv(c.baseX, c.baseY, c.width, c.height) : handR(); }, pos: 'top', text: {
            ja: '12 のカードができた！ カードを重ねると「のこりAP」が1へるよ。大きな数を作るには、少ない回数で重ねるのがコツ。',
            easy: '12 のカードができた！ カードをかさねると「のこりAP」が1へるよ。おおきなかずをつくるには、すくないかいすうでかさねるのがコツ。',
            en: 'You made 12! Stacking cards costs 1 AP, so build big numbers with as few stacks as you can.' } },
        { type: 'do', target: playR, pos: 'top', until: () => state.panelsDestroyed > 0,
          only: { from: () => cardP(state.cards.find(c => c && c.value === 12 && c.stackCount === 2)), to: cellP(2, 2), hint: {
            ja: '「12」のカードを、まん中の「12」のパネルにドラッグしてぶつけよう！',
            easy: '「12」のカードを、まんなかの「12」のパネルにドラッグしてぶつけよう！',
            en: 'Drag your "12" card onto the "12" panel in the middle!' } }, text: {
            ja: '12 のカードを、まん中の「12」のパネルにドラッグしてぶつけよう！',
            easy: '12 のカードを、まんなかの「12」のパネルにドラッグしてぶつけよう！',
            en: 'Drag your 12 card onto the "12" panel in the middle!' } },
        { type: 'run', fn: () => FGLTutorial.wait(() => state.particles.length < 3, 3000) },
        { type: 'say', target: '#left-panel', pos: 'top', text: {
            ja: 'パネルが壊れて、得点が入ったよ！ 中にあった「カギ🗝️」もゲット。カギを集めてドアを開けると、次のフロアへ進めるよ（全部で5フロア、最後のフロアにはボスがいる）。',
            easy: 'パネルがこわれて、とくてんがはいったよ！ なかにあった「カギ🗝️」もゲット。カギをあつめてドアをあけると、つぎのフロアへすすめるよ（ぜんぶで5フロア、さいごのフロアにはボスがいる）。',
            en: 'The panel broke and you scored! You also got the key 🗝️ inside. Collect keys and open the door to reach the next floor (5 floors in all, with a boss on the last one).' } },
        { type: 'say', target: '#disp-time', pos: 'top', text: {
            ja: 'ここが「のこりAP」。カードを重ねたり捨てたりすると1へって、0になるとゲームオーバー。敵を倒したり、⏰アイテムを取ると回復するよ。',
            easy: 'ここが「のこりAP」。カードをかさねたりすてたりすると1へって、0になるとゲームオーバー。てきをたおしたり、⏰アイテムをとるとかいふくするよ。',
            en: 'This is your remaining AP. Stacking or discarding cards costs 1, and at 0 it\'s game over. Defeating enemies or picking up ⏰ items restores it.' } },
        { type: 'say', target: trashR, pos: 'top', text: {
            ja: 'いらないカードは、この「すてば」にドラッグして捨てられるよ（AP -1）。使えない数のカードを入れかえたいときに使おう。',
            easy: 'いらないカードは、この「すてば」にドラッグしてすてられるよ（AP -1）。つかえないかずのカードをいれかえたいときにつかおう。',
            en: 'Drag unwanted cards to this discard area (−1 AP) to swap out numbers you can\'t use.' } }]);
}
</script>
