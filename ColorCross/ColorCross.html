<style>
:root{
  --text-hi:#3a3a44;
  --text-main:#6a6a76;
  --text-dim:#9a9aa6;
  --bdr:#e4e0da;
}
html{overflow:hidden;width:100%;height:100%;}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  overflow:hidden;background:#d8d4d0;
  font-family:'Nunito','M PLUS Rounded 1c',sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;
  display:flex;justify-content:center;align-items:center;
  height:100%;width:100%;
}
#container{
  width:1280px;height:720px;position:relative;
  flex-shrink:0;
  background:#fafaf7;
  box-shadow:0 0 80px rgba(0,0,0,0.4);
  border-radius:16px;overflow:hidden;
  transform-origin:center center;
}
canvas{position:absolute;top:0;left:0;touch-action:none;}
.hidden{display:none!important;}
.cc-overlay{
  position:absolute;top:0;left:0;width:1280px;height:720px;
  display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:20;
}
#title-screen{background:linear-gradient(135deg,#fffaf0,#f4f0ff 50%,#fff0f8);}
.title-box{
  background:rgba(255,255,255,0.6);border:1.5px solid #eee;
  padding:40px 64px;border-radius:22px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 10px 40px rgba(0,0,0,0.08);
}
.title-h1{font-size:4.6rem;font-weight:800;letter-spacing:2px;margin-bottom:4px;
  background:linear-gradient(135deg,#ff6b6b,#4dabf7 45%,#4ade80 75%,#ffca3a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;}
.title-sub{color:var(--text-main);font-size:1.3rem;letter-spacing:8px;margin-bottom:30px;opacity:0.8;}
.btn3d{
  min-width:270px;font-size:1.15rem;padding:14px 32px;margin-top:12px;border:none;border-radius:14px;
  font-family:inherit;font-weight:800;cursor:pointer;color:#fff;
  transition:transform .08s,box-shadow .08s;
}
.btn3d:first-child{margin-top:0;}
.btn3d:active{transform:translateY(3px);box-shadow:none!important;}
.btn3d-green {background:linear-gradient(180deg,#5ddb6e,#28a040);box-shadow:0 5px 0 #1a7030;}
.btn3d-gold  {background:linear-gradient(180deg,#f5c842,#d4900a);box-shadow:0 5px 0 #9a6000;}
.btn3d-purple{background:linear-gradient(180deg,#b47de8,#7a40c0);box-shadow:0 5px 0 #4a2080;}
.btn3d-blue  {background:linear-gradient(180deg,#7ab8e8,#3a78c0);box-shadow:0 5px 0 #1a4880;}
.btn3d-gray  {background:linear-gradient(180deg,#aaa,#787878);box-shadow:0 5px 0 #505050;text-decoration:none;display:block;text-align:center;}
.lang-btn{opacity:0.55;}
.lang-btn.active{opacity:1;outline:3px solid #ffe040;}
.cc-modal-bg{
  position:absolute;top:0;left:0;width:1280px;height:720px;
  background:rgba(30,20,10,0.35);z-index:30;display:flex;justify-content:center;align-items:center;
}
.cc-modal-box{
  background:#ffffff;color:var(--text-hi);padding:28px 32px;border-radius:24px;
  width:88%;max-width:820px;max-height:85vh;overflow-y:auto;
  border:1.5px solid var(--bdr);box-shadow:0 12px 48px rgba(0,0,0,0.18);
  font-family:'M PLUS Rounded 1c',sans-serif;
}
.cc-modal-box h2{font-size:1.4rem;color:#d4900a;margin-bottom:16px;text-align:center;border-bottom:2px dotted var(--bdr);padding-bottom:10px;}
.add-player-form{display:flex;gap:10px;justify-content:center;margin-bottom:16px;}
.input-name{padding:10px;font-size:1rem;border-radius:10px;border:2px solid var(--bdr);background:#fff;color:var(--text-hi);width:200px;font-family:'M PLUS Rounded 1c',sans-serif;}
.player-list{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
.player-item{background:#f6f4f0;padding:10px 18px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent;cursor:pointer;transition:all 0.15s;}
.player-item:hover{border-color:var(--bdr);transform:translateY(-2px);}
.player-item.selected{border-color:#28a040;background:#eafaef;}
.player-name{font-size:1.15rem;font-weight:800;flex:1;text-align:left;color:var(--text-hi);}
.delete-btn{background:#e05656;color:#fff;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:bold;line-height:30px;padding:0;font-size:1rem;}
/* #containerは1280x720固定でtransform:scale()により画面に合わせて縮小されるため、vh（実ビューポート基準）ではなく1280x720の論理座標系に対するpx指定で高さを決める */
.rank-box{background:#ffffff;padding:24px 28px;border-radius:24px;width:90%;max-width:900px;max-height:662px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;border:1.5px solid var(--bdr);box-shadow:0 12px 48px rgba(0,0,0,0.18);display:flex;flex-direction:column;}
.rank-title{font-size:1.4rem;color:#d4900a;margin-bottom:14px;text-align:center;border-bottom:2px dotted var(--bdr);padding-bottom:10px;font-weight:800;}
.rank-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
.rank-toggle-btn{padding:6px 20px;border-radius:50px;border:2px solid var(--bdr);background:#f6f4f0;color:var(--text-dim);font-size:0.95rem;font-weight:800;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.rank-toggle-btn.active{background:#3a78c0;color:#fff;border-color:#3a78c0;}
.rank-list{list-style:none;margin:0 0 14px;padding:0;}
.rank-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--bdr);color:var(--text-main);font-size:0.98rem;}
.rank-list li:first-child{border-top:1px solid var(--bdr);}
.rank-num{color:var(--text-dim);font-weight:800;width:28px;flex-shrink:0;font-size:0.88rem;}
.rank-num.top3{color:#d4900a;font-size:1.05rem;}
.rank-pname{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-pname.me{color:#3a78c0;}
.rank-score{font-weight:800;font-size:1.05rem;color:#d4900a;white-space:nowrap;}
.rank-sub{color:var(--text-dim);font-size:0.82rem;white-space:nowrap;}
.rank-date{color:var(--text-dim);font-size:0.78rem;white-space:nowrap;}

<!-- Supabase (direct REST fetch — no library dependency) -->
<script>
(function(){
  const _base = 'https://rpxassndgiunoqkxqcco.supabase.co/rest/v1';
  const _key  = 'sb_publishable_Wnge6OPvSf5l2YEgaPg4rw_nj4CyYAH';
  const _hdr  = { 'apikey': _key, 'Authorization': 'Bearer ' + _key,
                  'Content-Type': 'application/json', 'Prefer': 'return=minimal' };

  window.ccSaveOnlineScore = async (name, pointScore, turns, difficulty) => {
    if ((pointScore||0) <= 0) return;
    const res = await fetch(`${_base}/rankings`, {
      method: 'POST',
      headers: _hdr,
      keepalive: true,
      body: JSON.stringify({
        game:        'colorcross',
        difficulty:  difficulty  || 'normal',
        player_name: name        || 'ゲスト',
        point_score: pointScore  || 0,
        stage_score: turns       || 0,
        turns:       turns       || 0,
        class_name:  ''
      })
    });
    if (!res.ok) { const t=await res.text(); throw new Error(`HTTP ${res.status}: ${t}`); }
    console.log('Ranking: 登録成功', { name, pointScore });
  };

  window.ccLoadWorldRanking = async (difficulty) => {
    try {
      const q = new URLSearchParams({
        select:      'player_name,point_score,stage_score,created_at',
        game:        'eq.colorcross',
        difficulty:  `eq.${difficulty || 'normal'}`,
        point_score: 'gt.0',
        order:       'point_score.desc',
        limit:       '10'
      });
      const res = await fetch(`${_base}/rankings?${q}`, {
        headers: { 'apikey': _key, 'Authorization': 'Bearer ' + _key }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.map(r => ({
        name:   r.player_name,
        score:  r.point_score,
        turns:  r.stage_score,
        date:   r.created_at ? new Date(r.created_at).toLocaleDateString('ja-JP') : ''
      }));
    } catch(e) {
      console.error('ccLoadWorldRanking error:', e);
      return null;
    }
  };
})();
</script>

function randInt(n){return Math.floor(Math.random()*n);}
function weightedIndex(weights){
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<weights.length;i++){ r-=weights[i]; if(r<=0) return i; }
  return weights.length-1;
}
function makeMark(color){ return {kind:'mark', color: color===undefined?randInt(G.colorCount):color, type:weightedIndex(MARK_WEIGHT)}; }
function makeCard(){ return {kind:'card', color:randInt(G.colorCount), num:1+weightedIndex(CARD_NUM_WEIGHT)}; }

// 盤面にある☆マークの数（スコア倍率のもとになる）
function countStars(){
  let n=0;
  for(let i=0;i<GN*GN;i++){
    const c=G.board[i];
    if(c&&c.kind==='mark'&&c.type===MARK_MULT.length-1) n++;
  }
  return n;
}
// 盤面にある👑の数
function countCrowns(){
  let n=0;
  for(let i=0;i<GN*GN;i++){ if(G.board[i]&&G.board[i].kind==='crown') n++; }
  return n;
}
// 所持している⭐アイテムの数（場に☆があるのと同じ効果）
function countItemStars(){
  let n=0;
  for(const it of G.items){ if(it==='star') n++; }
  return n;
}
// スコア倍率＝1＋(場の☆＋アイテムの⭐)×0.1＋👑×5×0.1
function currentMultiplier(){
  return 1 + (countStars()+countItemStars())*0.1 + countCrowns()*0.5;
}

function rr(x,y,w,h,r,fill,stroke,lw=1){
  if(w<=0||h<=0) return;
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}
function tx(s,x,y,sz,col,align='left',bold=false){
  ctx.font=`${bold?'800':'400'} ${sz}px 'Nunito','M PLUS Rounded 1c',sans-serif`;
  ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.fillText(s,x,y);
}
function buildShapePath(cx,cy,r,type){
  ctx.beginPath();
  switch(type){
    case 0: // △
      ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.95,cy+r*0.72); ctx.lineTo(cx-r*0.95,cy+r*0.72); ctx.closePath();
      break;
    case 1: // □
      ctx.rect(cx-r*0.82,cy-r*0.82,r*1.64,r*1.64);
      break;
    case 2: // ⬠（五角形）
      for(let i=0;i<5;i++){
        const a=-Math.PI/2+i*2*Math.PI/5;
        const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      break;
    case 3: // 六角形
      for(let i=0;i<6;i++){
        const a=-Math.PI/2+i*2*Math.PI/6;
        const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      break;
    case 4: // ☆
      for(let i=0;i<10;i++){
        const rr2=i%2===0?r:r*0.42;
        const a=-Math.PI/2+i*Math.PI/5;
        const x=cx+rr2*Math.cos(a), y=cy+rr2*Math.sin(a);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      break;
  }
}
// 小さな図形アイコン（⬠⬡は文字だと小サイズで丸つぶれして見えるため、テキストの代わりに使う）
function drawShapeIcon(cx,cy,r,type,color){
  ctx.save();
  ctx.lineJoin='round';
  buildShapePath(cx,cy,r,type);
  ctx.fillStyle=color; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.stroke();
  ctx.restore();
}
// マークをはっきり見せるため：白ふち→塗り→濃い輪郭 の順に重ねて描く（ステッカー風）
function drawMarkShape(cx,cy,r,type,color,alpha=1){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.lineJoin='round';
  buildShapePath(cx,cy,r,type);
  ctx.lineWidth=7; ctx.strokeStyle='#ffffff'; ctx.stroke();
  ctx.fillStyle=color; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(0,0,0,0.30)'; ctx.stroke();
  ctx.restore();
}
// おじゃまブロック：岩っぽい塊の見た目
function drawGarbageBlock(x,y){
  const cx=x+CELL/2, cy=y+CELL/2, rad=CELL*0.36;
  ctx.save();
  const grad=ctx.createRadialGradient(cx-rad*0.35,cy-rad*0.4,rad*0.2,cx,cy,rad*1.15);
  grad.addColorStop(0,'#9a9098');
  grad.addColorStop(1,'#5c5560');
  ctx.beginPath();
  const pts=9;
  for(let i=0;i<pts;i++){
    const a=i*2*Math.PI/pts - Math.PI/2;
    const rr3=rad*(i%2===0?1:0.86);
    const px=cx+rr3*Math.cos(a), py=cy+rr3*Math.sin(a);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='#413c46'; ctx.stroke();
  ctx.restore();
}
// 🎁宝箱：隣接マスが消えると100%アイテムを落とす
function drawChest(x,y){
  const cx=x+CELL/2, cy=y+CELL/2, size=CELL*0.56;
  ctx.save();
  ctx.font=`${size}px 'Nunito','M PLUS Rounded 1c',sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🎁',cx,cy+2);
  ctx.restore();
}
// 👑クラウン：消すことはできないが動かせる特別なコマ
function drawCrown(cx,cy,size){
  ctx.save();
  ctx.font=`${size}px 'Nunito','M PLUS Rounded 1c',sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('👑',cx,cy+2);
  ctx.restore();
}

function fillNextQueue(){
  while(G.nextQueue.length<2) G.nextQueue.push(makeMark());
}
function emptyCells(){
  const out=[];
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++) if(!G.board[idx(r,c)]) out.push({r,c});
  return out;
}
function initGame(){
  G.colorCount=COLOR_COUNT;
  G.board=new Array(GN*GN).fill(null);
  const cells=[]; for(let r=0;r<GN;r++)for(let c=0;c<GN;c++) cells.push({r,c});
  for(let i=cells.length-1;i>0;i--){const j=randInt(i+1);[cells[i],cells[j]]=[cells[j],cells[i]];}
  for(let n=0;n<INITIAL_MARK_COUNT;n++){
    const {r,c}=cells[n]; G.board[idx(r,c)]=makeMark();
  }
  G.hand=[makeCard(),makeCard(),makeCard()];
  G.selHand=-1; G.selMark=null; G.selBoardCard=null; G.hoverCell=null; G.pendingChoice=null;
  G.totalScore=0; G.displayScore=0; G.bestSingleScore=0; G.turns=0; G.actionLogCount=0;
  G.items=[]; G.pendingItemDiscard=false; G.starsClearedTotal=0; G.jokerPicker=null; G.itemConfirm=null;
  G.starCounterDisplay=0; G.starCounterNextStepAt=null;
  G.turnScoreAccum=0; G.bestTurnScore=0;
  G.flow=null;
  G.flash=[]; G.log=[];
  G.nextQueue=[]; fillNextQueue();
  G.phase='game';
  document.getElementById('title-screen').classList.add('hidden');
}
// カードは置いた瞬間から盤面に残り続ける（マークが消せなくても消えない）
function placeCard(handIdx,r,c){
  if(G.pendingChoice) return;
  const card=G.hand[handIdx];
  if(!card) return;
  if(card.joker) return; // 色と数字を選ぶまでジョーカーは置けない
  if(G.board[idx(r,c)]) return; // カード／マークがあるマスには置けない
  G.board[idx(r,c)]={kind:'card', color:card.color, num:card.num};
  G.hand[handIdx]=makeCard();
  G.selHand=-1;
  G.actionLogCount=0; G.turnScoreAccum=0;
  G.flow={stage:'placeEval'};
  runFlow();
}
// マークの移動／入れ替え／合体。合体なら盤面に2個、それ以外は1個マークが増える
// 👑（クラウン）もマークと同じ手順で動かせるが、合体はしない
function moveMark(fr,fc,tr_,tc_){
  if(G.pendingChoice) return;
  if(fr===tr_&&fc===tc_) return; // 元の場所に戻しただけなら何もしない（自己合体の防止）
  const src=G.board[idx(fr,fc)];
  if(!src||(src.kind!=='mark'&&src.kind!=='crown')) return;
  const dst=G.board[idx(tr_,tc_)];
  let merged=false;
  G.actionLogCount=0; G.turnScoreAccum=0;
  if(dst){
    if(dst.kind==='garbage'||dst.kind==='chest') return; // おじゃまブロック・宝箱の上には置けない
    if(dst.kind==='card'){ swapMarkAndCard(fr,fc,tr_,tc_); return; } // カードとマークを入れ替え
    if(src.kind==='mark'&&dst.kind==='mark'&&dst.color===src.color&&dst.type===src.type){
      if(dst.type>=MARK_MULT.length-1) return; // ☆同士はこれ以上合体できない（最大ランクのため）
      // 合体
      merged=true;
      G.board[idx(fr,fc)]=null;
      G.board[idx(tr_,tc_)]={kind:'mark', color:dst.color,type:dst.type+1};
      G.flash.push({r:tr_,c:tc_,text:T('flash.merge'),ttl:50,rise:14,col:COLORS[dst.color]});
    } else {
      // 入れ替え
      G.board[idx(fr,fc)]=dst;
      G.board[idx(tr_,tc_)]=src;
    }
  } else {
    G.board[idx(tr_,tc_)]=src;
    G.board[idx(fr,fc)]=null;
  }
  G.selMark=null;
  G.flow={stage:'preSpawnEval', spawnCount:merged?2:1};
  runFlow();
}
// 不要なカードを捨てる：1ターン経過してマークが1つ増える
function discardCard(handIdx){
  if(G.pendingChoice) return;
  if(!G.hand[handIdx]) return;
  G.hand[handIdx]=makeCard();
  G.selHand=-1;
  G.actionLogCount=0; G.turnScoreAccum=0;
  G.flow={stage:'preSpawnEval', spawnCount:1};
  runFlow();
}
// 盤面に置いたカードを動かす：マークの移動と同じく1ターン経過してマークが1つ増える
function moveBoardCard(fr,fc,tr_,tc_){
  if(G.pendingChoice) return;
  const src=G.board[idx(fr,fc)];
  if(!src||src.kind!=='card') return;
  const dst=G.board[idx(tr_,tc_)];
  if(dst){
    if(dst.kind==='mark'||dst.kind==='crown'){ swapMarkAndCard(tr_,tc_,fr,fc); return; } // マーク／クラウンとカードを入れ替え
    return; // カード同士／おじゃまブロックの上には動かせない
  }
  G.board[idx(tr_,tc_)]=src;
  G.board[idx(fr,fc)]=null;
  G.selBoardCard=null;
  G.actionLogCount=0; G.turnScoreAccum=0;
  G.flow={stage:'preSpawnEval', spawnCount:1};
  runFlow();
}
// マークとカードの位置を入れ替える：1ターン経過してマークが1つ増える
function swapMarkAndCard(mr,mc,cr,cc){
  if(G.pendingChoice) return;
  const markCell=G.board[idx(mr,mc)];
  const cardCell=G.board[idx(cr,cc)];
  if(!markCell||(markCell.kind!=='mark'&&markCell.kind!=='crown')) return;
  if(!cardCell||cardCell.kind!=='card') return;
  G.board[idx(mr,mc)]=cardCell;
  G.board[idx(cr,cc)]=markCell;
  G.selMark=null; G.selBoardCard=null;
  G.actionLogCount=0; G.turnScoreAccum=0;
  G.flow={stage:'preSpawnEval', spawnCount:1};
  runFlow();
}
// 盤面に置いたカードを捨てる：同じく1ターン経過してマークが1つ増える
function discardBoardCard(r,c){
  if(G.pendingChoice) return;
  const cell=G.board[idx(r,c)];
  if(!cell||cell.kind!=='card') return;
  G.board[idx(r,c)]=null;
  G.selBoardCard=null;
  G.actionLogCount=0; G.turnScoreAccum=0;
  G.flow={stage:'preSpawnEval', spawnCount:1};
  runFlow();
}
// おじゃまブロックの代わりに10%の確率で宝箱を出現させる。宝箱は隣接マスが消えると100%アイテムを落とす
function spawnObstacle(){
  const spawnable=emptyCells();
  if(!spawnable.length) return;
  const {r,c}=spawnable[randInt(spawnable.length)];
  if(Math.random()<CHEST_CHANCE){
    G.board[idx(r,c)]={kind:'chest'};
    G.flash.push({r,c,text:T('flash.chestspawn'),ttl:60,rise:16,col:'#d4900a'});
  } else {
    G.board[idx(r,c)]={kind:'garbage'};
    G.flash.push({r,c,text:T('flash.garbage'),ttl:60,rise:16,col:'#7a7a86'});
  }
}
// 出たばかりのマークが、置いた瞬間にすぐ消えてしまわないか判定する
function wouldInstantlyResolve(mark,r,c){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const [dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(!inB(nr,nc)) continue;
    const cardCell=G.board[idx(nr,nc)];
    if(!cardCell||cardCell.kind!=='card'||cardCell.color!==mark.color) continue;
    let count=0;
    for(const [dr2,dc2] of dirs){
      const nr2=nr+dr2,nc2=nc+dc2;
      if(!inB(nr2,nc2)) continue;
      if(nr2===r&&nc2===c){ count++; continue; }
      const m2=G.board[idx(nr2,nc2)];
      if(m2&&m2.kind==='mark'&&m2.color===mark.color&&m2.type===mark.type) count++;
    }
    if(count===cardCell.num) return true;
  }
  return false;
}
// マークが消えた位置の上下左右にあるおじゃまブロック・宝箱も一緒に消す
// おじゃまブロックからはアイテムは出ない。宝箱は100%の確率でアイテムを落とす
function clearAdjacentObstacles(r,c){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const [dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(!inB(nr,nc)) continue;
    const cell=G.board[idx(nr,nc)];
    if(cell&&cell.kind==='garbage'){
      G.board[idx(nr,nc)]=null;
      G.flash.push({r:nr,c:nc,text:T('flash.garbagebreak'),ttl:50,rise:12,col:'#7a7a86'});
    } else if(cell&&cell.kind==='chest'){
      G.board[idx(nr,nc)]=null;
      addItem(ITEM_TYPES[randInt(ITEM_TYPES.length)]);
      G.flash.push({r:nr,c:nc,text:T('flash.itemdrop'),ttl:55,rise:14,col:'#a76bea'});
    }
  }
}
// ============================================================
//  ITEMS（🎁宝箱を壊すと100%でドロップ。おじゃまブロックからは出ない。個数上限8個）
// ============================================================
// アイテムを1つ入手する。8個持っている時はどれかを選んで捨てるまで操作できなくする
function addItem(type){
  if(G.items.length<MAX_ITEMS){ G.items.push(type); return; }
  G.items.push(type); // 一旦9個目として加え、プレイヤーに1つ選んで捨ててもらう
  G.pendingItemDiscard=true;
}
// アイテムを使う（捨てる選択中の場合はそのアイテムを捨てるだけになる）
// ⭐は使用できないアイテムのため、タップすると捨てるだけになる
// それ以外は、はい/いいえの確認ポップアップを開いてから効果を発動する
function useItem(index){
  if(G.pendingChoice) return;
  const type=G.items[index];
  if(!type) return;
  if(G.pendingItemDiscard){
    G.items.splice(index,1);
    G.pendingItemDiscard=false;
    return;
  }
  if(type==='star') return; // ⭐は使用不可。タップしても何も起きず、持っている間ずっと効果が続く
  G.itemConfirm={index,type};
}
// 確認ポップアップで「はい」が押された時だけ実際にアイテムを消費して効果を発動する
function confirmItemUse(yes){
  const ic=G.itemConfirm;
  if(!ic) return;
  G.itemConfirm=null;
  if(!yes) return;
  if(G.items[ic.index]!==ic.type) return; // 念のため（発動時点で状態が変わっていないか確認）
  G.items.splice(ic.index,1);
  applyItemEffect(ic.type);
}
function removeMarksByType(type){
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const cell=G.board[idx(r,c)];
    if(cell&&cell.kind==='mark'&&cell.type===type){
      G.board[idx(r,c)]=null;
      clearAdjacentObstacles(r,c);
    }
  }
}
// 盤面にある「指定の形」のマークを色を問わずすべて1ランク上げる（△→□→⬠→⬡→☆）
function rankUpByType(type){
  if(type>=MARK_MULT.length-1) return; // ☆はこれ以上ランクアップできない
  const targets=[];
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const cell=G.board[idx(r,c)];
    if(cell&&cell.kind==='mark'&&cell.type===type) targets.push({r,c});
  }
  targets.forEach(({r,c})=>{ G.board[idx(r,c)].type=type+1; });
}
// 盤面にある「指定の色」のマークを、形を問わずすべて1ランク上げる（☆はこれ以上ランクアップできないので対象外）
function rankUpByColor(color){
  const targets=[];
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const cell=G.board[idx(r,c)];
    if(cell&&cell.kind==='mark'&&cell.color===color&&cell.type<MARK_MULT.length-1) targets.push({r,c});
  }
  targets.forEach(({r,c})=>{ G.board[idx(r,c)].type+=1; });
}
function removeAllGarbage(){
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const cell=G.board[idx(r,c)];
    if(cell&&cell.kind==='garbage') G.board[idx(r,c)]=null;
  }
}
function applyItemEffect(type){
  switch(type){
    case 'cardChange': G.hand=[makeCard(),makeCard(),makeCard()]; break;
    case 'removeTri':    removeMarksByType(0); break; // △
    case 'removeSquare': removeMarksByType(1); break; // □
    case 'removeGarbage': removeAllGarbage(); break;
    case 'triUp':    rankUpByType(0); break; // △→□
    case 'squareUp': rankUpByType(1); break; // □→⬠
    case 'pentaUp':  rankUpByType(2); break; // ⬠→⬡
    case 'hexUp':    rankUpByType(3); break; // ⬡→☆
    case 'redUp':   rankUpByColor(0); break;
    case 'blueUp':  rankUpByColor(1); break;
    case 'greenUp': rankUpByColor(2); break;
    case 'joker': {
      const idxs=[0,1,2].filter(i=>G.hand[i]&&!G.hand[i].joker);
      if(idxs.length){
        const target=idxs[randInt(idxs.length)];
        G.hand[target]={kind:'card', joker:true, color:null, num:null};
      }
      break;
    }
    case 'all1': G.hand=[{kind:'card',color:0,num:1},{kind:'card',color:1,num:1},{kind:'card',color:2,num:1}]; break;
    case 'all4': G.hand=[{kind:'card',color:0,num:4},{kind:'card',color:1,num:4},{kind:'card',color:2,num:4}]; break;
  }
}
// 1グループ分の消去処理（スコア加算・盤面反映・ログ）
// スコア倍率は、消す前の盤面にある☆・アイテムの⭐・👑の数で決まる（消される☆自身も数に含む）
function resolveGroup(r,c,color,num,type,grp){
  const comboMult=currentMultiplier();
  let mult=1; for(let i=0;i<grp.length;i++) mult*=MARK_MULT[type];
  const base=num*mult;
  const gained=Math.round(base*comboMult);
  G.totalScore+=gained;
  G.turnScoreAccum+=gained;
  if(gained>G.bestSingleScore) G.bestSingleScore=gained;
  G.flash.push({r,c,text:'+'+gained.toLocaleString(),ttl:60,rise:16,col:'#d4900a'});
  const isStarGroup=type===MARK_MULT.length-1;
  for(const g of grp){ G.board[idx(g.r,g.c)]=null; clearAdjacentObstacles(g.r,g.c); }
  G.board[idx(r,c)]=null;
  clearAdjacentObstacles(r,c); // カード自身が消えたことで隣接するおじゃまブロックも消える
  if(isStarGroup) addStarsCleared(grp.length);
  const factors=[num, ...grp.map(()=>MARK_MULT[type])];
  if(comboMult!==1) factors.push(comboMult.toFixed(1));
  G.log.unshift(`${factors.join('×')}＝${gained.toLocaleString()}`);
  G.actionLogCount++;
}
// 消した⭐の累計をカウントし、4の倍数に達する（超える）たびに👑を1つ盤面に出現させる
function addStarsCleared(n){
  const before=G.starsClearedTotal;
  G.starsClearedTotal+=n;
  const crownsToSpawn=Math.floor(G.starsClearedTotal/4)-Math.floor(before/4);
  for(let i=0;i<crownsToSpawn;i++) spawnCrown();
}
function spawnCrown(){
  const spawnable=emptyCells();
  if(!spawnable.length) return;
  const {r,c}=spawnable[randInt(spawnable.length)];
  G.board[idx(r,c)]={kind:'crown'};
  G.flash.push({r,c,text:T('flash.crownspawn'),ttl:60,rise:16,col:'#d4900a'});
}
// プレイヤーが選んだグループを消す（1つのカードで複数の消し方が選べる場合）
function resolveChoice(type){
  const pc=G.pendingChoice; if(!pc) return;
  const grp=pc.groups[type]; if(!grp) return;
  resolveGroup(pc.r,pc.c,pc.color,pc.num,type,grp);
  G.pendingChoice=null;
  runFlow();
}
// 盤面上の全カードを走査し、上下左右「同色・同種」のマークが数字ぴったりなら消す
// 1枚のカードに消し方が複数ある時だけ選択待ちにする。複数のカードが同時に消える場合は
// 左上から順番に自動で処理する（曖昧さがなく、選ばせるロジックより単純で安全なため）
function evaluateAllCards(){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    if(G.pendingChoice) return;
    const cell=G.board[idx(r,c)];
    if(!cell||cell.kind!=='card') continue;
    const {color,num}=cell;
    const groups={};
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(!inB(nr,nc)) continue;
      const m=G.board[idx(nr,nc)];
      if(m&&m.kind==='mark'&&m.color===color) (groups[m.type]=groups[m.type]||[]).push({r:nr,c:nc});
    }
    const validTypes=Object.keys(groups).filter(t=>groups[t].length===num);
    if(validTypes.length===0) continue;
    if(validTypes.length===1){
      resolveGroup(r,c,color,num,+validTypes[0],groups[validTypes[0]]);
    } else {
      const pendGroups={};
      validTypes.forEach(t=>{ pendGroups[t]=groups[t]; });
      G.pendingChoice={r,c,color,num,groups:pendGroups};
    }
  }
  if(G.log.length>30) G.log.length=30;
}
// ============================================================
//  ACTION FLOW（1回の行動＝カード配置／マーク移動／合体・捨てる を最後まで処理する）
// ============================================================
// カード判定 → （移動・捨てるの場合のみ）マーク補充 → 再判定 → おじゃまブロック、の順で進める。
// 途中でpendingChoiceが発生したら一時停止し、resolveChoice()でここに戻ってくる。
// スポーン系の処理を必ずカード判定の「あと」に行うことで、盤面が埋まっていても
// 既に置いてあったカードでマークが消えて空きができるケースを正しく拾えるようにしている。
function runFlow(){
  while(G.flow){
    if(G.pendingChoice) return;
    const f=G.flow;
    if(f.stage==='placeEval'){
      evaluateAllCards();
      if(G.pendingChoice) return;
      finishAction();
      return;
    }
    if(f.stage==='preSpawnEval'){
      evaluateAllCards();
      if(G.pendingChoice) return;
      f.stage='spawn';
      continue;
    }
    if(f.stage==='spawn'){
      // 必要な数だけ新しいマークを置けなければゲームオーバー（合体は2個・それ以外は1個が必要）
      if(emptyCells().length<f.spawnCount){ triggerGameOver(); return; }
      for(let i=0;i<f.spawnCount && G.nextQueue.length;i++){
        const sp=emptyCells();
        if(!sp.length) break;
        let nm=G.nextQueue.shift();
        const {r,c}=sp[randInt(sp.length)];
        let attempts=0;
        while(wouldInstantlyResolve(nm,r,c)&&attempts<20){ nm=makeMark(); attempts++; }
        G.board[idx(r,c)]=nm;
      }
      fillNextQueue();
      f.stage='postSpawnEval';
      continue;
    }
    if(f.stage==='postSpawnEval'){
      evaluateAllCards();
      if(G.pendingChoice) return;
      f.stage='garbage';
      continue;
    }
    if(f.stage==='garbage'){
      G.turns++;
      // おじゃまブロックの出現確率＝初期値＋20ターンごとに+1%（MAX100%）を毎ターン抽選
      const chance=Math.min(100, GARBAGE_BASE+Math.floor(G.turns/20));
      if(Math.random()*100<chance){
        if(emptyCells().length===0){ triggerGameOver(); return; }
        spawnObstacle();
      }
      finishAction();
      return;
    }
  }
}
// 1ターン中に得たスコアの合計を、今回のゲームでの「ターンMAX」記録と比較する
function commitTurnScore(){
  if(G.turnScoreAccum>G.bestTurnScore) G.bestTurnScore=G.turnScoreAccum;
}
function finishAction(){
  commitTurnScore();
  G.flow=null;
}
function triggerGameOver(){
  commitTurnScore();
  G.flow=null;
  G.phase='game_over';
  finalizeScore();
}
function finalizeScore(){
  G.finalScore = G.totalScore;
  if(G.finalScore>0){
    saveLocalScore(G.playerName,G.finalScore,G.turns,'sum');
    if(window.ccSaveOnlineScore){
      window.ccSaveOnlineScore(G.playerName,G.finalScore,G.turns,RANK_WORLD_DIFF.sum).catch(e=>console.warn('Online ranking error:',e));
    }
  }
  if(G.bestTurnScore>0){
    saveLocalScore(G.playerName,G.bestTurnScore,G.turns,'turnMax');
    if(window.ccSaveOnlineScore){
      window.ccSaveOnlineScore(G.playerName,G.bestTurnScore,G.turns,RANK_WORLD_DIFF.turnMax).catch(e=>console.warn('Online ranking error:',e));
    }
  }
}

// ============================================================
//  LAYOUT: 3 columns — ① 盤面+手札  ② NEXT/アイテム  ③ スコア等+ログ
// ============================================================
const HAND_Y=GY+GN*CELL+16;      // 564
const SLOT_SIZE=118;
const SLOT_GAP=14;
const SLOT_ROW_W=SLOT_SIZE*4+SLOT_GAP*3;   // 捨てエリア + カード3枚
const HAND_X=GX+(GN*CELL-SLOT_ROW_W)/2;
const DISCARD_X=HAND_X;                    // 捨てエリアはいちばん左
const CARDS_X=HAND_X+SLOT_SIZE+SLOT_GAP;   // カード3枚はその右

const MID_X=GX+GN*CELL+34;       // 614
const MID_W=320;
const RIGHT_X=MID_X+MID_W+30;    // 964
const RIGHT_W=W-RIGHT_X-26;      // 290

// ============================================================
//  DRAW
// ============================================================
function cellXY(r,c){ return {x:GX+c*CELL, y:GY+r*CELL}; }
function drawBoard(){
  rr(GX-6,GY-6,GN*CELL+12,GN*CELL+12,12,'#f2efe9','#e4e0da',2);
  for(let r=0;r<GN;r++) for(let c=0;c<GN;c++){
    const {x,y}=cellXY(r,c);
    const selectedMark = G.selMark && G.selMark.r===r && G.selMark.c===c;
    const selectedCard = G.selBoardCard && G.selBoardCard.r===r && G.selBoardCard.c===c;
    const selected = selectedMark||selectedCard;
    rr(x+3,y+3,CELL-6,CELL-6,8, selected?'#f5edfc':C_CELL, selected?SEL_COL:C_CELL_BDR, selected?3:1.5);

    const cell=G.board[idx(r,c)];
    if(cell&&cell.kind==='mark'){
      drawMarkShape(x+CELL/2,y+CELL/2,CELL*0.33,cell.type,COLORS[cell.color]);
    } else if(cell&&cell.kind==='card'){
      rr(x+10,y+10,CELL-20,CELL-20,10,'#ffffff', selectedCard?SEL_COL:COLORS[cell.color], selectedCard?4:3.5);
      tx(cell.num,x+CELL/2,y+CELL/2,42,COLORS[cell.color],'center',true);
    } else if(cell&&cell.kind==='garbage'){
      drawGarbageBlock(x,y);
    } else if(cell&&cell.kind==='chest'){
      drawChest(x,y);
    } else if(cell&&cell.kind==='crown'){
      drawCrown(x+CELL/2,y+CELL/2,CELL*0.62);
    }
  }
  // ゴースト表示：カード配置中のホバー（空きマスのみ置ける／いつでも配置可）
  if(G.phase==='game'&&G.selHand>=0&&G.hoverCell){
    const {r,c}=G.hoverCell;
    const ok=!G.board[idx(r,c)];
    const {x,y}=cellXY(r,c);
    rr(x+3,y+3,CELL-6,CELL-6,8, ok?C_OK:C_BAD, ok?'#34c759':'#ff5c5c',2.5);
    const card=G.hand[G.selHand];
    if(card) tx(card.num,x+CELL/2,y+CELL/2,42,COLORS[card.color],'center',true);
  }
  // 移動先ゴースト（空きマス／合体／入れ替え〈マーク・カードどちらも〉のプレビュー）
  if(G.phase==='game'&&G.selMark&&G.hoverCell){
    const {r,c}=G.hoverCell;
    const src=G.board[idx(G.selMark.r,G.selMark.c)];
    const dst=G.board[idx(r,c)];
    const isMergeable = dst&&src&&src.kind==='mark'&&dst.kind==='mark'&&dst.color===src.color && dst.type===src.type;
    const blocked = dst&&(dst.kind==='garbage'||dst.kind==='chest');
    if(!blocked){
      const {x,y}=cellXY(r,c);
      if(src&&src.kind==='mark'){ ctx.save();ctx.globalAlpha=0.5; drawMarkShape(x+CELL/2,y+CELL/2,CELL*0.33,src.type,COLORS[src.color]); ctx.restore(); }
      else if(src&&src.kind==='crown'){ ctx.save();ctx.globalAlpha=0.5; drawCrown(x+CELL/2,y+CELL/2,CELL*0.62); ctx.restore(); }
      rr(x+3,y+3,CELL-6,CELL-6,8,null, isMergeable?'#ff8a3a':SEL_COL,2.5);
    }
  }
  // 移動先ゴースト：盤面カードを動かす場合（空きマス／マークとの入れ替え）
  if(G.phase==='game'&&G.selBoardCard&&G.hoverCell){
    const {r,c}=G.hoverCell;
    const dst=G.board[idx(r,c)];
    const ok=!dst||dst.kind==='mark'||dst.kind==='crown';
    if(ok){
      const {x,y}=cellXY(r,c);
      const src=G.board[idx(G.selBoardCard.r,G.selBoardCard.c)];
      ctx.save(); ctx.globalAlpha=0.5;
      rr(x+10,y+10,CELL-20,CELL-20,10,'#ffffff',COLORS[src.color],3.5);
      tx(src.num,x+CELL/2,y+CELL/2,42,COLORS[src.color],'center',true);
      ctx.restore();
      rr(x+3,y+3,CELL-6,CELL-6,8,null,SEL_COL,2.5);
    }
  }
  // 複数の消し方が選べる時：カードと候補グループをハイライトして選択を促す
  if(G.pendingChoice){
    const pc=G.pendingChoice;
    const pulse=0.6+0.4*Math.sin(Date.now()/160);
    const {x:ccx,y:ccy}=cellXY(pc.r,pc.c);
    ctx.save(); ctx.globalAlpha=pulse;
    rr(ccx+6,ccy+6,CELL-12,CELL-12,10,null,'#ff8a3a',3.5);
    ctx.restore();
    const palette=['#ff8a3a','#a76bea','#3a78c0','#28a040'];
    let gi=0;
    for(const t in pc.groups){
      const col=palette[gi%palette.length]; gi++;
      for(const g of pc.groups[t]){
        const {x,y}=cellXY(g.r,g.c);
        rr(x+3,y+3,CELL-6,CELL-6,8,null,col,3);
      }
    }
    tx(T('choice.prompt'), ccx+CELL/2, ccy-14, 13,'#ff8a3a','center',true);
  }
  // フロートテキスト（得点がふわっと上に浮きながらフェードアウト／約1秒）
  ctx.save();
  G.flash.forEach(f=>{
    const {x,y}=cellXY(f.r,f.c);
    ctx.globalAlpha=Math.max(0,f.ttl/60);
    tx(f.text,x+CELL/2,y+CELL/2-f.rise,24,f.col,'center',true);
  });
  ctx.restore();
  // マークをドラッグ中：指先に追従する半透明のマーク（下のマスが見えるよう透過を強めに）
  if(drag.active&&drag.mode==='mark'&&drag.markCell){
    const m=G.board[idx(drag.markCell.r,drag.markCell.c)];
    if(m&&m.kind==='mark'){ ctx.save(); ctx.globalAlpha=0.45; drawMarkShape(drag.curX,drag.curY,CELL*0.33,m.type,COLORS[m.color]); ctx.restore(); }
    else if(m&&m.kind==='crown'){ ctx.save(); ctx.globalAlpha=0.45; drawCrown(drag.curX,drag.curY,CELL*0.62); ctx.restore(); }
  }
  // 盤面のカードをドラッグ中：指先に追従する半透明のカード
  if(drag.active&&drag.mode==='boardCard'&&drag.boardCardCell){
    const c=G.board[idx(drag.boardCardCell.r,drag.boardCardCell.c)];
    if(c){
      ctx.save(); ctx.globalAlpha=0.5;
      const s=CELL-20;
      rr(drag.curX-s/2,drag.curY-s/2,s,s,10,'#ffffff',COLORS[c.color],3.5);
      tx(c.num,drag.curX,drag.curY,42,COLORS[c.color],'center',true);
      ctx.restore();
    }
  }
}

// 捨てるエリアのゴミ箱アイコン（絵文字を使わず自前で描く）
function drawTrashIcon(cx,cy,size,color){
  const w=size*0.72, h=size*0.66;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=size*0.07; ctx.lineJoin='round'; ctx.lineCap='round';
  // ふた
  ctx.beginPath(); ctx.moveTo(cx-w/2-4,cy-h/2); ctx.lineTo(cx+w/2+4,cy-h/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-size*0.14,cy-h/2); ctx.lineTo(cx-size*0.10,cy-h/2-size*0.12); ctx.lineTo(cx+size*0.10,cy-h/2-size*0.12); ctx.lineTo(cx+size*0.14,cy-h/2); ctx.stroke();
  // 本体（台形）
  ctx.beginPath();
  ctx.moveTo(cx-w/2,cy-h/2+2);
  ctx.lineTo(cx-w/2+4,cy+h/2);
  ctx.lineTo(cx+w/2-4,cy+h/2);
  ctx.lineTo(cx+w/2,cy-h/2+2);
  ctx.stroke();
  // 縦線
  ctx.lineWidth=size*0.06;
  [-1,0,1].forEach(i=>{
    ctx.beginPath(); ctx.moveTo(cx+i*size*0.15,cy-h/2+size*0.14); ctx.lineTo(cx+i*size*0.13,cy+h/2-size*0.1); ctx.stroke();
  });
  ctx.restore();
}

// 長い文章をキャンバス幅に合わせて複数行に折り返す（スペース区切りの言語は単語単位、日本語は1文字単位）
function wrapLines(text,maxWidth,fontSize){
  ctx.font=`400 ${fontSize}px 'Nunito','M PLUS Rounded 1c',sans-serif`;
  const lines=[];
  if(text.includes(' ')){
    let cur='';
    text.split(' ').forEach(w=>{
      const test=cur?cur+' '+w:w;
      if(cur&&ctx.measureText(test).width>maxWidth){ lines.push(cur); cur=w; } else cur=test;
    });
    if(cur) lines.push(cur);
  } else {
    let cur='';
    for(const ch of text){
      const test=cur+ch;
      if(cur&&ctx.measureText(test).width>maxWidth){ lines.push(cur); cur=ch; } else cur=test;
    }
    if(cur) lines.push(cur);
  }
  return lines;
}
// アイテム使用前の確認ポップアップ（はい/いいえ）
function drawItemConfirm(){
  const ic=G.itemConfirm; if(!ic) return;
  ctx.fillStyle='rgba(30,20,10,0.55)'; ctx.fillRect(0,0,W,H);
  const pw=560, fontSize=17, lineH=26;
  const lines=wrapLines(itemConfirmMsg(ic.type), pw-60, fontSize);
  const ph=150+lines.length*lineH;
  const px=W/2-pw/2, py=H/2-ph/2;
  rr(px,py,pw,ph,18,'#ffffff','#f0a850',3);
  tx(itemLabel(ic.type), W/2, py+36, 20,'#d4900a','center',true);
  lines.forEach((l,i)=>tx(l, W/2, py+76+i*lineH, fontSize,'#3a3a44','center'));
  const btnY=py+ph-60;
  BR.itemConfirmYes={x:W/2-140,y:btnY,w:120,h:44};
  rr(W/2-140,btnY,120,44,10,'#28a040','#1a7030',2);
  tx(T('btn.yes'),W/2-80,btnY+22,17,'#fff','center',true);
  BR.itemConfirmNo={x:W/2+20,y:btnY,w:120,h:44};
  rr(W/2+20,btnY,120,44,10,'#e05656','#a03030',2);
  tx(T('btn.no'),W/2+80,btnY+22,17,'#fff','center',true);
}
function drawGame(){
  ctx.fillStyle=C_BG;ctx.fillRect(0,0,W,H);
  BR={};
  drawBoard();
  drawHandRow();
  drawMidPanel();
  drawRightPanel();
  if(G.phase==='game_over') drawEndPanel(T('endpanel.title'),'#3a78c0','#3a78c0');
  if(howTo) drawHowToScreen();
  if(G.jokerPicker) drawJokerPicker();
  if(G.itemConfirm) drawItemConfirm();
  G.flash=G.flash.filter(f=>{ f.ttl--; f.rise+=0.5; return f.ttl>0; });
}

// ============================================================
//  INPUT
// ============================================================
function toXY(e){
  const r=cvs.getBoundingClientRect();
  return {mx:(e.clientX-r.left)*W/r.width, my:(e.clientY-r.top)*H/r.height};
}
function toCell(mx,my){
  const c=Math.floor((mx-GX)/CELL), r=Math.floor((my-GY)/CELL);
  return (r>=0&&r<GN&&c>=0&&c<GN)?{r,c}:null;
}
const hit=(b,mx,my)=>b&&mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h;
const drag={active:false,mode:'hand',handIdx:0,markCell:null,boardCardCell:null,tapDeselect:false,curX:0,curY:0,startX:0,startY:0,pid:null};

cvs.addEventListener('pointermove',e=>{
  e.preventDefault();
  const{mx,my}=toXY(e);
  if(drag.active&&e.pointerId===drag.pid){ drag.curX=mx; drag.curY=my; G.hoverCell=toCell(mx,my); }
  else if(G.phase==='game'){ G.hoverCell=toCell(mx,my); }
},{passive:false});

cvs.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const{mx,my}=toXY(e);
  if(howTo){ if(hit(BR.htclose,mx,my)) howTo=false; return; }
  if(G.phase==='game_over'){
    if(hit(BR.retry, mx,my)) initGame();
    else if(hit(BR.title2,mx,my)) showTitle();
    else if(hit(BR.rank2, mx,my)) showRanking();
    return;
  }
  if(G.phase!=='game') return;
  if(G.starCounterDisplay<G.starsClearedTotal) return; // ⭐カウンターのアニメーション中は操作を受け付けない

  // アイテム使用の確認中：はい/いいえのみ受け付ける
  if(G.itemConfirm){
    if(hit(BR.itemConfirmYes,mx,my)) confirmItemUse(true);
    else if(hit(BR.itemConfirmNo,mx,my)) confirmItemUse(false);
    return;
  }

  // ジョーカーの色・数字を選択中：グリッドをタップして選ぶか、外側タップで一旦閉じる
  if(G.jokerPicker){
    const gp=G.jokerPicker;
    for(let ci=0;ci<3;ci++) for(let ni=0;ni<4;ni++){
      if(hit(BR[`jokerpick_${ci}_${ni}`],mx,my)){
        G.hand[gp.handIdx]={kind:'card', color:ci, num:ni+1};
        G.jokerPicker=null;
        return;
      }
    }
    G.jokerPicker=null;
    return;
  }

  // 複数の消し方が選べる状態：候補グループのマークをタップして選ぶまで他の操作はできない
  if(G.pendingChoice){
    const cell=toCell(mx,my);
    if(cell){
      const pc=G.pendingChoice;
      for(const t in pc.groups){
        if(pc.groups[t].some(g=>g.r===cell.r&&g.c===cell.c)){ resolveChoice(+t); return; }
      }
    }
    return;
  }

  // アイテムはいつでも使える（8個を超えて捨てる選択中の場合は、タップしたものを捨てる）
  for(let i=0;i<G.items.length;i++){
    if(hit(BR[`item${i}`],mx,my)){ useItem(i); return; }
  }
  if(G.pendingItemDiscard) return; // 捨てるまでは他の操作を受け付けない

  // 手札のカードは、いつでも選択・ドラッグして置ける（ジョーカーは色と数字を選ぶポップアップを開く）
  for(let i=0;i<3;i++){
    if(G.hand[i]&&hit(BR[`h${i}`],mx,my)){
      if(G.hand[i].joker){ G.jokerPicker={handIdx:i}; return; }
      G.selHand=i; G.selMark=null; G.selBoardCard=null; drag.active=true; drag.mode='hand'; drag.handIdx=i;
      drag.curX=mx; drag.curY=my; drag.startX=mx; drag.startY=my; drag.pid=e.pointerId;
      cvs.setPointerCapture(e.pointerId);
      return;
    }
  }
  if(hit(BR.howto,mx,my)){ howTo=!howTo; return; }
  if(hit(BR.back,mx,my)){ showTitle(); return; }
  if(hit(BR.discard,mx,my)){
    if(G.selHand>=0) discardCard(G.selHand);
    else if(G.selBoardCard) discardBoardCard(G.selBoardCard.r,G.selBoardCard.c);
    return;
  }

  const cell=toCell(mx,my);
  if(!cell){
    // マス目以外をタップしたら選択解除
    if(G.selHand>=0||G.selMark||G.selBoardCard) { G.selHand=-1; G.selMark=null; G.selBoardCard=null; }
    return;
  }
  const cellObj=G.board[idx(cell.r,cell.c)];
  if(G.selHand>=0){
    if(!cellObj){ placeCard(G.selHand,cell.r,cell.c); return; }
    if(cellObj.kind==='mark'||cellObj.kind==='crown'){ G.selHand=-1; G.selMark={r:cell.r,c:cell.c}; return; } // マーク／クラウンをタップ→そちらの選択に切替
    if(cellObj.kind==='card'){ G.selHand=-1; G.selBoardCard={r:cell.r,c:cell.c}; return; }
    return; // おじゃまブロックの上には置けない
  }
  if(G.selMark){
    if(G.selMark.r===cell.r&&G.selMark.c===cell.c){
      // 選択中のマークを再びつかんだ：そのままドラッグを開始できるようにする
      // （軽くタップしただけならpointerupで選択解除、動かせばそのまま移動・入れ替え・合体）
      drag.active=true; drag.mode='mark'; drag.markCell={r:cell.r,c:cell.c}; drag.tapDeselect=true;
      drag.curX=mx; drag.curY=my; drag.startX=mx; drag.startY=my; drag.pid=e.pointerId;
      cvs.setPointerCapture(e.pointerId);
      return;
    }
    if(cellObj&&(cellObj.kind==='garbage'||cellObj.kind==='chest')){ return; } // おじゃまブロック・宝箱へは動かせない
    // カードの上なら入れ替え、マークの上なら合体か入れ替え、空きマスなら移動（moveMarkが内部で判定する）
    moveMark(G.selMark.r,G.selMark.c,cell.r,cell.c);
    return;
  }
  if(G.selBoardCard){
    if(G.selBoardCard.r===cell.r&&G.selBoardCard.c===cell.c){
      // 選択中のカードを再びつかんだ：そのままドラッグを開始できるようにする
      drag.active=true; drag.mode='boardCard'; drag.boardCardCell={r:cell.r,c:cell.c}; drag.tapDeselect=true;
      drag.curX=mx; drag.curY=my; drag.startX=mx; drag.startY=my; drag.pid=e.pointerId;
      cvs.setPointerCapture(e.pointerId);
      return;
    }
    if(cellObj&&cellObj.kind==='card'){ G.selBoardCard={r:cell.r,c:cell.c}; return; } // 別のカードをタップ→選び直す
    // 空きマスなら移動、マークの上なら入れ替え（moveBoardCardが内部で判定する）
    moveBoardCard(G.selBoardCard.r,G.selBoardCard.c,cell.r,cell.c);
    return;
  }
  if(cellObj&&(cellObj.kind==='mark'||cellObj.kind==='crown')){
    // マーク／クラウンをタップ/ドラッグ開始：軽いタップなら選択のみ、ドラッグすればそのまま移動・入れ替え・合体
    G.selMark={r:cell.r,c:cell.c};
    drag.active=true; drag.mode='mark'; drag.markCell={r:cell.r,c:cell.c}; drag.tapDeselect=false;
    drag.curX=mx; drag.curY=my; drag.startX=mx; drag.startY=my; drag.pid=e.pointerId;
    cvs.setPointerCapture(e.pointerId);
  } else if(cellObj&&cellObj.kind==='card'){
    // カードをタップ/ドラッグ開始：軽いタップなら選択のみ、ドラッグすればそのまま移動・すてる
    G.selBoardCard={r:cell.r,c:cell.c};
    drag.active=true; drag.mode='boardCard'; drag.boardCardCell={r:cell.r,c:cell.c}; drag.tapDeselect=false;
    drag.curX=mx; drag.curY=my; drag.startX=mx; drag.startY=my; drag.pid=e.pointerId;
    cvs.setPointerCapture(e.pointerId);
  }
},{passive:false});

cvs.addEventListener('pointerup',e=>{
  e.preventDefault();
  if(drag.active&&e.pointerId===drag.pid){
    const dx=drag.curX-drag.startX, dy=drag.curY-drag.startY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>=12&&G.phase==='game'){
      if(drag.mode==='hand'){
        if(hit(BR.discard,drag.curX,drag.curY)){ discardCard(drag.handIdx); }
        else { const cell=toCell(drag.curX,drag.curY); if(cell) placeCard(drag.handIdx,cell.r,cell.c); }
      } else if(drag.mode==='mark'&&drag.markCell){
        const cell=toCell(drag.curX,drag.curY);
        if(cell) moveMark(drag.markCell.r,drag.markCell.c,cell.r,cell.c);
      } else if(drag.mode==='boardCard'&&drag.boardCardCell){
        if(hit(BR.discard,drag.curX,drag.curY)){ discardBoardCard(drag.boardCardCell.r,drag.boardCardCell.c); }
        else { const cell=toCell(drag.curX,drag.curY); if(cell) moveBoardCard(drag.boardCardCell.r,drag.boardCardCell.c,cell.r,cell.c); }
      }
    } else if(drag.mode==='mark'&&drag.tapDeselect){
      // 選択中のマークを軽くタップしただけ→選択解除
      G.selMark=null;
    } else if(drag.mode==='boardCard'&&drag.tapDeselect){
      // 選択中のカードを軽くタップしただけ→選択解除
      G.selBoardCard=null;
    }
    drag.active=false; drag.tapDeselect=false; G.hoverCell=null;
    try{cvs.releasePointerCapture(e.pointerId);}catch(_){}
  }
},{passive:false});
cvs.addEventListener('pointercancel',()=>{drag.active=false; G.hoverCell=null;});

// ============================================================
//  SCREEN NAVIGATION
// ============================================================
function showTitle(){
  G.phase='title'; howTo=false; drag.active=false;
  document.getElementById('title-screen').classList.remove('hidden');
  updPlayer();
}

// ============================================================
//  RANKING
// ============================================================
// 合計スコア（sum＝そのゲームで最終的にためたスコア）と最大スコア（best＝1回の計算で得た最高スコア）の
// 2種類のランキングを、それぞれローカル／ワールドで用意する
const RANK_KEYS={sum:'colorcross_ranking_easy', turnMax:'colorcross_ranking_easy_turnmax'};
const RANK_WORLD_DIFF={sum:'easy', turnMax:'easy_turnmax'};
const RANK_KINDS=['sum','turnMax'];
let rankTab='world', rankKind='sum';
function getLocalRanking(kind){
  try{return JSON.parse(localStorage.getItem(RANK_KEYS[kind])||'[]');}catch{return [];}
}
function saveLocalScore(name,score,turns,kind){
  let r=getLocalRanking(kind);
  const dateStr=new Date().toLocaleDateString('ja-JP');
  r.push({name,score,turns,date:dateStr});
  r.sort((a,b)=>b.score-a.score);
  r=r.slice(0,10);
  localStorage.setItem(RANK_KEYS[kind],JSON.stringify(r));
}
function renderRankList(rows,myName){
  const ul=document.getElementById('rank-list');
  ul.innerHTML='';
  if(!rows||rows.length===0){
    ul.innerHTML=`<li><span class="rank-empty">${T('rank.empty')}</span></li>`;
    return;
  }
  rows.forEach((r,i)=>{
    const li=document.createElement('li');
    const isMe=myName&&myName!=='ゲスト'&&r.name===myName;
    const medals=['🥇','🥈','🥉'];
    const numTxt=i<3?medals[i]:`${i+1}.`;
    const numCls=i<3?'rank-num top3':'rank-num';
    const nameCls=isMe?'rank-pname me':'rank-pname';
    const turns=r.turns!=null?r.turns:0;

    const numSpan=document.createElement('span'); numSpan.className=numCls; numSpan.textContent=numTxt;
    const nameSpan=document.createElement('span'); nameSpan.className=nameCls; nameSpan.textContent=r.name||'ゲスト';
    const subSpan=document.createElement('span'); subSpan.className='rank-sub'; subSpan.textContent=`${turns}${T('unit.turns')}`;
    const scoreSpan=document.createElement('span'); scoreSpan.className='rank-score'; scoreSpan.textContent=`${(r.score||0).toLocaleString()}pt`;
    li.appendChild(numSpan); li.appendChild(nameSpan); li.appendChild(subSpan); li.appendChild(scoreSpan);
    if(r.date){ const dateSpan=document.createElement('span'); dateSpan.className='rank-date'; dateSpan.textContent=r.date; li.appendChild(dateSpan); }
    ul.appendChild(li);
  });
}
function switchRankTab(tab){
  rankTab=tab;
  document.getElementById('btn-rank-local').classList.toggle('active',tab==='local');
  document.getElementById('btn-rank-world').classList.toggle('active',tab==='world');
  loadAndRender();
}
function switchRankKind(kind){
  rankKind=kind;
  RANK_KINDS.forEach(k=>{
    document.getElementById(`btn-rank-kind-${k}`).classList.toggle('active',k===kind);
  });
  loadAndRender();
}
async function loadAndRender(){
  const loading=document.getElementById('rank-loading');
  loading.style.display='block';
  document.getElementById('rank-list').innerHTML='';
  if(rankTab==='local'){
    loading.style.display='none';
    renderRankList(getLocalRanking(rankKind),G.playerName);
  } else {
    const rows=await(window.ccLoadWorldRanking?window.ccLoadWorldRanking(RANK_WORLD_DIFF[rankKind]):Promise.resolve(null));
    loading.style.display='none';
    if(!rows){
      document.getElementById('rank-list').innerHTML=`<li><span class="rank-empty">${T('rank.fail')}</span></li>`;
      return;
    }
    renderRankList(rows,G.playerName);
  }
}
function showRanking(){
  rankTab='world'; rankKind='sum';
  document.getElementById('btn-rank-world').classList.add('active');
  document.getElementById('btn-rank-local').classList.remove('active');
  RANK_KINDS.forEach(k=>{
    document.getElementById(`btn-rank-kind-${k}`).classList.toggle('active',k==='sum');
  });
  document.getElementById('ranking-screen').classList.remove('hidden');
  loadAndRender();
}
function closeRanking(){document.getElementById('ranking-screen').classList.add('hidden');}

function updPlayer(){document.getElementById('current-player-name-display').textContent=G.playerName;}

document.getElementById('btn-start-menu').addEventListener('click',()=>{
  initGame();
});
document.getElementById('btn-view-ranking').addEventListener('click',showRanking);
document.getElementById('btn-close-ranking').addEventListener('click',closeRanking);
document.getElementById('player-select-btn').addEventListener('click',openPM);
document.getElementById('btn-close-player-manager').addEventListener('click',()=>document.getElementById('player-manager').classList.add('hidden'));
document.getElementById('btn-open-settings').addEventListener('click',()=>document.getElementById('settings-screen').classList.remove('hidden'));
document.getElementById('btn-close-settings').addEventListener('click',()=>document.getElementById('settings-screen').classList.add('hidden'));
document.getElementById('btn-add-player').addEventListener('click',addP);
document.getElementById('input-new-player').addEventListener('keydown',e=>{if(e.key==='Enter')addP();});

// Player manager
function getPs(){return JSON.parse(localStorage.getItem('cc_players')||'[]');}
function savePs(a){localStorage.setItem('cc_players',JSON.stringify(a));}
function selP(n){G.playerName=n; localStorage.setItem('cc_current_player',n); updPlayer();}
function openPM(){document.getElementById('player-manager').classList.remove('hidden'); renderPL();}
function addP(){
  const inp=document.getElementById('input-new-player');
  const n=inp.value.trim(); if(!n)return;
  const ps=getPs(); if(!ps.includes(n))ps.push(n);
  savePs(ps); selP(n); inp.value=''; renderPL();
}
function renderPL(){
  const ul=document.getElementById('player-list-ul');
  const ps=getPs(); ul.innerHTML='';
  if(!ps.length){ul.innerHTML=`<li style="color:#b0b0b8;text-align:center;padding:12px;">${T('pm.empty')}</li>`;return;}
  ps.forEach(n=>{
    const li=document.createElement('li'); li.className='player-item';
    if(n===G.playerName) li.classList.add('selected');
    const nm=document.createElement('span'); nm.className='player-name'; nm.textContent=n;
    const del=document.createElement('button'); del.className='delete-btn'; del.textContent='×';
    del.addEventListener('click',ev=>{ev.stopPropagation();
      const a=getPs().filter(x=>x!==n); savePs(a);
      if(G.playerName===n){G.playerName=a[0]||'ゲスト'; updPlayer();} renderPL();});
    li.appendChild(nm); li.appendChild(del);
    li.addEventListener('click',()=>{selP(n); renderPL();});
    ul.appendChild(li);
  });
}

// ============================================================
//  FRAME LOOP
// ============================================================
(function loop(){
  requestAnimationFrame(loop);
  if(G.displayScore<G.totalScore){
    G.displayScore=Math.min(G.totalScore, G.displayScore+Math.max(1,Math.floor((G.totalScore-G.displayScore)*0.15)));
  }
  // ⭐カウンターの表示を0.2秒ごとに1ずつstarsClearedTotalへ追いつかせる（その間は操作不可）
  if(G.starCounterDisplay<G.starsClearedTotal){
    const now=performance.now();
    if(G.starCounterNextStepAt===null) G.starCounterNextStepAt=now+200;
    if(now>=G.starCounterNextStepAt){
      G.starCounterDisplay++;
      G.starCounterNextStepAt=now+200;
    }
  } else {
    G.starCounterNextStepAt=null;
  }
  if(G.phase==='game'||G.phase==='game_over') drawGame();
})();

(function(){
  const s=localStorage.getItem('cc_current_player');
  if(s) G.playerName=s;
  updPlayer();
})();
applyLanguage();
</script>
