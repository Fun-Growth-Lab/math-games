        /* ティール×金(スチーム)。--h は共通CSSの色相(たしざん=220, ひきざん=352, かけざん=150) */
        :root { --h: 172; --led: #7dffd8; --led-soft: rgba(125,255,216,0.45); }
        .mon { --c: #2fbf71; }

        /* ---- スチームロボ(150x150の箱に描いて縮小する。ボスは190x190)。体の色は --c ---- */
        .rbx { position:absolute; left:50%; top:50%; width:150px; height:150px; margin:-75px 0 0 -75px; transform:scale(1.04); z-index:1; }
        .rbx.big { width:190px; height:190px; margin:-95px 0 0 -95px; transform:scale(0.84); }
        .rbx .ab { position:absolute; }
        .sgr { background:linear-gradient(135deg, color-mix(in srgb, var(--c) 52%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 62%, #000)); box-shadow:inset 0 -6px 0 rgba(0,0,0,.16); }
        .sgd { background:linear-gradient(135deg,#fff3a8,#ffc93d 55%,#d9931a); box-shadow:inset 0 -5px 0 rgba(0,0,0,.14); }
        .sdk { background:linear-gradient(135deg,#5a6a62,#2a3a32); }
        .ssc { background:#10281c; border:4px solid #2a5a40; box-shadow:inset 0 0 12px rgba(120,255,180,.25); }
        /* ジト目(まぶたが上半分をおおう・光なし) */
        .sjt { position:absolute; border-radius:50%; background:#fff; overflow:hidden; box-shadow:0 0 0 2.5px #1a2a22; animation: stBlink 4.8s infinite; }
        .sjt .sp { position:absolute; border-radius:50%; background:#1a1220; }
        .sjt .sl { position:absolute; left:-4px; right:-4px; top:-4px; border-bottom:3px solid #1a2a22; }
        @keyframes stBlink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
        @keyframes stSpin { to { transform:rotate(360deg); } }
        @keyframes stPuff { 0% { transform:translateY(0) scale(.5); opacity:.9; } 100% { transform:translateY(-34px) scale(1.3); opacity:0; } }
        @keyframes stGlow { 0%,100% { opacity:.7; } 50% { opacity:1; } }

        /* ---- 戦闘の画面 ---- */
        .fd-enemy { position:absolute; left:0; top:0; width:0; height:0; }
        .fd-enemy.dead { animation: enDead 0.5s ease-in forwards; transform-origin:360px 150px; }
        .fd-enemy .gnd { position:absolute; height:22px; border-radius:50%; background:radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 70%); }
        .fd-enemy .rw { position:absolute; left:285px; top:44px; width:150px; height:150px; transform:scale(1.4); transform-origin:50% 0; }

<script src="../braves-run.js?v=20261016"></script>
<script>
// ============================================================
// チュートリアル（練習プレイ）
// ============================================================
// 実際のバトル画面で「手札を場のカードに重ねて かけざんし、101いじょうで こうげき」を体験する。
// 書き込みはエンジンが止めるので、ランキング・クリア回数は一切汚れない。
function startTutorial() {
    FGLTutorial.begin({ root: '#container', getLang: () => currentLang });
    state.star = 1; state.difficulty = 'STAR1';
    CONFIG = Object.assign({}, PRESET_EASY);
    initGame();
    state.tutorial = true;
    state.controlMode = 'drag';      // 説明はドラッグ操作。設定は保存しない(終わるとページが読みこまれなおす)
    startStage(1);
    // 手順どおりに進むよう、手札と場のカードを決めた値にする(3 ×4 ×5 ×2 = 120 → 101いじょうで こうげき)
    [4, 5, 3, 2, 6].forEach((v, i) => { state.cards[i].value = v; });
    state.field.value = 3;
    const CV = '#gameCanvas';
    const cv = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [canvas.width, canvas.height], pad: 8 });
    // 手順どおりの操作だけ許すための、ぴったりの範囲(余白なし)。手札は最初のカード(順に 4,5,3,2,6)を覚えておく
    const hand0 = state.cards.slice();
    const rect0 = (x, y, w, h) => ({ sel: CV, rect: [x, y, w, h], of: [canvas.width, canvas.height], pad: 0 });
    const handP = (i) => () => { const c = hand0[i]; return rect0(c.x - c.width / 2, c.y - c.height / 2, c.width, c.height); };
    const fieldP = () => { const f = state.field; return rect0(f.x - f.width / 2, f.y - f.height / 2, f.width, f.height); };
    const enemyR = () => cv(150, 30, 420, 320);
    const actionR = () => cv(16, 16, 88, 88);
    const fieldR = () => cv(state.field.x - 70, state.field.y - 90, 140, 180);
    const handR = () => cv(state.width / 2 - 285, HAND_Y - 75, 570, 150);
    const bothR = () => cv(60, FIELD_Y - 100, 600, 350);
    const settle = () => FGLTutorial.wait(() => state.phase === 'PLAY', 8000);
    FGLTutorial.run([
        { type: 'say', target: enemyR, pos: 'bottom', text: {
            ja: 'てきが登場！ HPバーを0にすればたおせるよ。こうげきの力は「カードをかけざんして大きな数を作る」ことだよ。',
            easy: 'てきがとうじょう！ HPバーを0にすればたおせるよ。こうげきのちからは「カードをかけざんしておおきなかずをつくる」ことだよ。',
            en: 'An enemy appears! Bring its HP bar to 0 to win. Your attack power comes from multiplying cards into a big number.' } },
        { type: 'say', target: actionR, pos: 'bottom', text: {
            ja: '「のこりアクション」。こうげきするたびに1へって、0になるとゲームオーバー。少ない回数で大きなダメージを与えよう！',
            easy: '「のこりアクション」。こうげきするたびに1へって、0になるとゲームオーバー。すくないかいすうでおおきなダメージをあたえよう！',
            en: 'Remaining actions. Each attack uses one, and at 0 it\'s game over. Deal big damage in as few attacks as you can!' } },
        { type: 'say', target: fieldR, pos: 'top', text: {
            ja: 'まん中の「ばのカード」が、こうげきの元になる数。いまは 3 だね。',
            easy: 'まんなかの「ばのカード」が、こうげきのもとになるかず。いまは 3 だね。',
            en: 'The card in the middle is the "field card", the base of your attack. It\'s 3 right now.' } },
        { type: 'say', target: handR, pos: 'top', text: {
            ja: '下のしろいカードが手札。ドラッグして、ばのカードに重ねると、数がかけざんされるよ！',
            easy: 'したのしろいカードがてふだ。ドラッグして、ばのカードにかさねると、かずがかけざんされるよ！',
            en: 'The white cards below are your hand. Drag one onto the field card and the numbers are multiplied!' } },
        { type: 'do', target: bothR, pos: 'top', until: () => state.field.value === 12,
          only: { from: handP(0), to: fieldP, hint: {
            ja: '手札の「4」のカードを、まん中のばのカードにドラッグして重ねてみよう！',
            easy: 'てふだの「4」のカードを、まんなかのばのカードにドラッグしてかさねてみよう！',
            en: 'Drag the "4" card from your hand onto the field card in the middle!' } }, text: {
            ja: '手札の「4」を、ばのカードに重ねてみよう！ 3 × 4 = 12 になるよ。',
            easy: 'てふだの「4」を、ばのカードにかさねてみよう！ 3 × 4 = 12 になるよ。',
            en: 'Drag the "4" from your hand onto the field card! 3 × 4 = 12.' } },
        { type: 'do', target: bothR, pos: 'top', until: () => state.field.value === 60,
          only: { from: handP(1), to: fieldP, hint: {
            ja: '手札の「5」のカードを、まん中のばのカードにドラッグして重ねよう！',
            easy: 'てふだの「5」のカードを、まんなかのばのカードにドラッグしてかさねよう！',
            en: 'Drag the "5" card from your hand onto the field card!' } }, text: {
            ja: 'いいね！ 次は「5」を重ねよう。12 × 5 = 60 だよ。',
            easy: 'いいね！ つぎは「5」をかさねよう。12 × 5 = 60 だよ。',
            en: 'Nice! Now stack the "5": 12 × 5 = 60.' } },
        { type: 'say', target: fieldR, pos: 'top', text: {
            ja: 'ばのカードが「101いじょう」になると、てきにこうげき！ ダメージは、ばのカードの数そのままだよ。あと少し、60 を 101 以上にしよう。',
            easy: 'ばのカードが「101いじょう」になると、てきにこうげき！ ダメージは、ばのカードのかずそのままだよ。あとすこし、60 を 101 いじょうにしよう。',
            en: 'When the field card reaches 101 or more, you attack! The damage equals the field card\'s number. Let\'s push 60 past 101.' } },
        { type: 'do', target: bothR, pos: 'top', until: () => state.score > 0,
          only: { from: handP(3), to: fieldP, hint: {
            ja: '手札の「2」のカードを、まん中のばのカードにドラッグして重ねよう！',
            easy: 'てふだの「2」のカードを、まんなかのばのカードにドラッグしてかさねよう！',
            en: 'Drag the "2" card from your hand onto the field card!' } }, text: {
            ja: '「2」のカードを重ねよう！ 60 × 2 = 120 で、101を超えるからこうげきだ！',
            easy: '「2」のカードをかさねよう！ 60 × 2 = 120 で、101をこえるからこうげきだ！',
            en: 'Stack the "2"! 60 × 2 = 120, which is over 101, so you attack!' } },
        { type: 'run', fn: settle },
        { type: 'say', target: '#right-panel', pos: 'bottom', text: {
            ja: 'ダメージ 120 が入ったよ！ 右にはスコアとアイテム。てきをたおすと、アイテムが1つもらえて、ここにたまるよ。アイテムを上手に使って、最後のボスをたおそう！',
            easy: 'ダメージ 120 がはいったよ！ みぎにはスコアとアイテム。てきをたおすと、アイテムが1つもらえて、ここにたまるよ。アイテムをじょうずにつかって、さいごのボスをたおそう！',
            en: '120 damage! On the right you see the score and items. Defeating an enemy gives an item that collects here. Use items wisely to beat the final boss!' } }
    ]);
}
</script>
