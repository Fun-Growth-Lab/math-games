<body>
<div id="stage">
    <canvas id="world" width="1280" height="720"></canvas>

    <div id="hud" class="hidden">
        <div id="bars" class="plate">
            <div class="bar-row"><span>❤️</span><div class="bar"><i id="hp-fill"></i></div><span class="bar-num" id="hp-num"></span></div>
            <div class="bar-row"><span>🍖</span><div class="bar"><i id="food-fill"></i></div><span class="bar-num" id="food-num"></span></div>
            <div class="bar-row hidden" id="air-row"><span>🫧</span><div class="bar"><i id="air-fill"></i></div><span class="bar-num" id="air-num"></span></div>
        </div>
        <div id="goal" class="plate"></div>
        <div id="clock" class="plate"></div>
        <button id="btn-grid" class="wbtn" style="padding:0">グリッド<i class="kbd2" style="position:absolute;right:2px;top:-8px">G</i></button>
        <button id="btn-menu" class="wbtn" style="padding:0">メニュー<i class="kbd2" style="position:absolute;right:2px;top:-8px">Esc</i></button>
        <div id="log"></div>
        <div id="hot" class="plate"></div>
        <div id="dpad">
            <span></span><button class="pad" data-d="0,-1" aria-label="上">▲</button><span></span>
            <button class="pad" data-d="-1,0" aria-label="左">◀</button><button class="pad" id="btn-turn"><span>向き<br>だけ</span><i class="kbd2">Shift</i></button><button class="pad" data-d="1,0" aria-label="右">▶</button>
            <span></span><button class="pad" data-d="0,1" aria-label="下">▼</button><span></span>
        </div>
        <div id="actions">
            <button class="act" id="btn-map"><i class="kbd">M</i><b>🗺️</b><span>地図</span></button>
            <button class="act" id="btn-craft"><i class="kbd">E</i><b>🎒</b><span>持ち物</span></button>
            <button class="act" id="btn-wait"><i class="kbd">Q</i><b>⏳</b><span>まつ</span></button>
            <button class="act" id="btn-dig"><i class="kbd">X</i><b>✋</b><span>ほる</span></button>
            <button class="act hidden" id="btn-use2"><i class="kbd">C</i><span></span></button>
            <button class="act" id="btn-use"><i class="kbd">Z</i><b>✋</b><span>つかう</span></button>
        </div>
    </div>

    <div id="banner"><b></b><span></span></div>
    <div id="fade"></div>
    <div id="ach-toast"></div>
    <div id="tip" class="hidden"></div>

    <div id="panel" class="modal hidden"><div class="sheet">
        <div class="tabs">
            <span id="panel-title" class="hidden"></span>
            <button class="tab" id="tab-inv" data-tab="inv">持ち物</button>
            <button class="tab" id="tab-make" data-tab="make">つくる</button>
            <button class="tab" id="tab-tool" data-tab="tool">組み立て</button>
            <button class="tab" id="tab-book" data-tab="book">図鑑</button>
            <button class="tab" id="tab-ach" data-tab="ach">実績</button>
            <div class="chips" id="chips"></div>
            <button class="wbtn hidden" id="panel-sort" style="margin-left:auto" title="2段目から下を ならべかえる(手持ちはそのまま)">ならべる</button>
            <button class="wbtn hidden" id="panel-remove" style="margin-left:auto">片づける</button>
            <button class="wbtn close" id="panel-close">とじる</button>
        </div>
        <div class="pbody" id="pbody"></div>
    </div></div>
    <div id="chest-modal" class="modal hidden"><div class="sheet" style="width:1210px;height:600px;padding:12px 16px">
        <div class="tabs"><span style="font-size:24px;font-weight:900">箱(タップで出し入れ)</span><button class="wbtn" id="chest-remove" style="margin-left:auto">箱を片づける</button><button class="wbtn" id="chest-close">とじる</button></div>
        <div class="pbody" style="justify-content:center;gap:30px">
            <div class="col"><h4>持ち物</h4><div class="grid" id="chest-inv" style="grid-template-columns:repeat(8,64px)"></div></div>
            <div class="col"><h4>箱の中</h4><div class="grid" id="chest-box" style="grid-template-columns:repeat(4,64px)"></div></div>
        </div>
    </div></div>
    <div id="map-modal" class="modal hidden"><div class="sheet" id="map-sheet">
        <canvas id="map-cv" width="250" height="250"></canvas>
        <div id="map-side">
            <div class="tabs" id="map-tabs" style="flex-wrap:wrap"></div>
            <div id="map-info"></div>
            <button class="wbtn" id="map-close" style="margin-top:auto">とじる</button>
        </div>
    </div></div>
    <div id="dialog" class="modal hidden"><div class="sheet box" id="dialog-box"></div></div>

    <div id="title-screen">
        <div id="title-real">
            <button id="btn-start"></button><button id="btn-new">はじめから</button><button id="btn-tutorial">チュートリアル</button><button id="btn-howto">あそびかた</button>
            <button id="btn-rank">ランキング</button><button id="btn-ach">実績</button><button id="btn-sound">設定</button><button id="btn-home">ホーム</button>
        </div>
    </div>
</div>
